<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A free FAA Part 107 remote pilot study platform: all 46 official FAA sample questions in their own section, plus 254 audited items, full ACS coverage, chart lab and exam simulations.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Part 107 Ground School">
<meta property="og:description" content="Free FAA Part 107 study platform. All 46 official FAA sample questions, kept in their own section.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 100 100&apos;%3E%3Ctext y=&apos;.9em&apos; font-size=&apos;90&apos;%3E%F0%9F%9B%A9%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Part 107 Ground School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
</head>
<body>
<style id="app-style">
:root{
  --paper:#F1F0EC;--card:#FFFFFF;--card2:#FAF9F6;--card3:#F5F3EF;
  --ink:#1F1E1B;--ink2:#403E39;--muted:#6E6A62;
  --line:#DCD9D2;--line2:#EAE7E1;
  --acc:#BC4B18;--acc-soft:#FAE7DC;
  --slate:#2F5670;--slate-soft:#E0EAF1;
  --ok:#2A6B44;--ok-soft:#DEEDE3;
  --no:#A8342E;--no-soft:#F8E3E1;
  --warn:#8A6410;--warn-soft:#F7EEDA;
  --mag:#B01E6B;--blu:#1F4E8C;
  --sh:0 1px 2px rgba(31,30,27,.05),0 8px 22px rgba(31,30,27,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121110;--card:#1B1A18;--card2:#232120;--card3:#2A2826;
  --ink:#EDEBE6;--ink2:#C9C5BD;--muted:#948F86;
  --line:#302E2B;--line2:#252322;
  --acc:#EE8B52;--acc-soft:#332014;
  --slate:#84AFCB;--slate-soft:#17242D;
  --ok:#6EC08E;--ok-soft:#13241A;
  --no:#E4817A;--no-soft:#2C1715;
  --warn:#D3A650;--warn-soft:#2A2211;
  --mag:#E77BB0;--blu:#7FAEDC;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#121110;--card:#1B1A18;--card2:#232120;--card3:#2A2826;
  --ink:#EDEBE6;--ink2:#C9C5BD;--muted:#948F86;
  --line:#302E2B;--line2:#252322;
  --acc:#EE8B52;--acc-soft:#332014;
  --slate:#84AFCB;--slate-soft:#17242D;
  --ok:#6EC08E;--ok-soft:#13241A;
  --no:#E4817A;--no-soft:#2C1715;
  --warn:#D3A650;--warn-soft:#2A2211;
  --mag:#E77BB0;--blu:#7FAEDC;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Karla",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.mono,code{font-family:"DM Mono",ui-monospace,monospace}
a{color:var(--slate);text-underline-offset:2.5px}
a:hover{color:var(--acc)}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
p{margin:0 0 15px}

.topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.tbin{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
.brand{font-family:"Fraunces",serif;font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand em{font-style:normal;color:var(--acc)}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav button{font-family:"Karla",sans-serif;font-weight:600;font-size:13.5px;padding:7px 11px;border-radius:7px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--ink);background:var(--card2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}

.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.col{max-width:74ch}
.hero{padding:44px 0 8px}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);font-weight:500;margin:0 0 14px}
h1{font-size:clamp(32px,5.6vw,50px);line-height:1.04;margin-bottom:14px}
.lede{font-size:19px;color:var(--ink2);max-width:60ch;margin:0}

.facts{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin:26px 0;box-shadow:var(--sh)}
@media(min-width:640px){.facts{grid-template-columns:repeat(5,1fr)}}
.fact{background:var(--card);padding:15px 14px}
.fact b{display:block;font-family:"Fraunces",serif;font-size:24px;line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums}
.fact span{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

.call{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--card);box-shadow:var(--sh);padding:20px 22px;margin:24px 0;border-radius:0 8px 8px 0}
.call.warnc{border-left-color:var(--warn);background:var(--warn-soft)}
.call.slatec{border-left-color:var(--slate)}
.call.okc{border-left-color:var(--ok);background:var(--ok-soft)}
.call h3{font-size:19px;margin:0 0 7px}
.call p:last-child{margin-bottom:0}
.call .stamp{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--warn);margin-bottom:8px;display:block}
.call.slatec .stamp{color:var(--slate)}.call.okc .stamp{color:var(--ok)}

section{margin-top:42px}
h2{font-size:29px;margin-bottom:8px}
h3{font-size:21px;margin:30px 0 8px}
h4{font-size:17px;margin:22px 0 6px;font-family:"Karla",sans-serif;font-weight:700;letter-spacing:0}
.sublede{color:var(--muted);margin:0 0 22px;font-size:16.5px}

.cite{display:inline-flex;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.pill{font-family:"DM Mono",monospace;font-size:10.5px;padding:3px 8px;border-radius:4px;background:var(--card3);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.pill.reg{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pill.acs{background:var(--slate-soft);color:var(--slate);border-color:transparent}

.keys{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:6px 18px;margin:16px 0}
.keys dl{display:grid;grid-template-columns:1fr auto;gap:0;margin:0}
.keys dt,.keys dd{padding:11px 0;border-bottom:1px solid var(--line2);margin:0}
.keys dt{color:var(--ink2);padding-right:16px}
.keys dd{font-family:"DM Mono",monospace;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;color:var(--acc)}
.keys dl>:nth-last-child(-n+2){border-bottom:none}

ul.lst{margin:12px 0;padding-left:20px}ul.lst li{margin-bottom:9px}ul.lst li::marker{color:var(--acc)}
ol.num{margin:12px 0;padding-left:22px}ol.num li{margin-bottom:9px}ol.num li::marker{color:var(--acc);font-family:"DM Mono",monospace;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:var(--sh);margin:18px 0}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
thead th{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--card2)}
tbody tr:last-child td{border-bottom:none}
.codebox{border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:var(--sh);padding:14px 16px;margin:16px 0;overflow-x:auto}
.codebox code{font-size:14.5px;white-space:pre}

.gwrap{display:grid;gap:26px}
@media(min-width:900px){.gwrap{grid-template-columns:220px 1fr;align-items:start}}
.rail{position:sticky;top:70px}
@media(max-width:899px){.rail{position:static}}
.rail .rl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.rail button{display:block;width:100%;text-align:left;font-family:"Karla",sans-serif;font-size:14.5px;font-weight:600;padding:9px 12px;border-radius:7px;border:none;background:transparent;color:var(--ink2);cursor:pointer;margin-bottom:2px;line-height:1.3}
.rail button:hover{background:var(--card2)}
.rail button[aria-current="true"]{background:var(--acc-soft);color:var(--acc)}
.rail .wt{font-family:"DM Mono",monospace;font-size:10px;color:var(--muted);float:right;padding-top:2px}
.rail button[aria-current="true"] .wt{color:var(--acc)}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:22px 20px}
.qmeta{display:flex;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap;align-items:center}
.q{font-size:18.5px;line-height:1.45;font-weight:600;font-family:"Fraunces",serif;margin:0 0 17px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 15px;border-radius:8px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:16.5px;line-height:1.4;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt .ltr{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);flex:none;padding-top:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .ltr{color:var(--ok)}
.opt.bad{border-color:var(--no);background:var(--no-soft)}.opt.bad .ltr{color:var(--no)}
.exp{margin-top:15px;padding:15px 16px;border-radius:8px;background:var(--card3);border-left:3px solid var(--slate)}
.exp .hd{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:7px}
.exp p{margin:0;font-size:16px;color:var(--ink2)}
.exp b{color:var(--ink)}

.btn{font-family:"Karla",sans-serif;font-weight:700;font-size:15px;padding:13px 22px;border-radius:8px;border:none;background:var(--acc);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn,html:not([data-theme="light"]) .btn{color:#121110}
.btn:hover{filter:brightness(1.07)}
.btn.gh{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.btn.gh:hover{border-color:var(--acc);color:var(--acc);filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.modes{display:grid;gap:12px;margin:20px 0}
@media(min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.mode{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:19px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.mode:hover{border-color:var(--acc)}
.mode.hero2{border-left:4px solid var(--acc)}
.mode h4{font-family:"Fraunces",serif;font-size:19px;margin:0 0 5px;font-weight:600;letter-spacing:-.01em}
.mode p{font-size:15px;color:var(--muted);margin:0}
.mode .badge{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:8px}
.mode .sc{float:right;font-family:"DM Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums}
.mode .sc.g{color:var(--ok)}.mode .sc.r{color:var(--no)}.mode .sc.n{color:var(--muted)}

.scorebar{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:13px 16px;margin-bottom:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.scorebar .s{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.scorebar .s b{font-family:"Fraunces",serif;font-size:19px;color:var(--ink)}
.bar{flex:1 1 100px;min-width:90px;height:7px;background:var(--card3);border-radius:99px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.result{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:30px 24px;text-align:center}
.result .big{font-family:"Fraunces",serif;font-size:60px;font-weight:700;line-height:1;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.result .big.pass{color:var(--ok)}.result .big.fail{color:var(--no)}
.result .verdict{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.result p{color:var(--ink2);max-width:46ch;margin:0 auto 10px}
.brk{text-align:left;margin:22px auto 0;max-width:420px}
.brk .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);font-size:15px;gap:12px}
.brk .r:last-child{border:none}
.brk .r .v{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.brk .r .v.g{color:var(--ok)}.brk .r .v.r{color:var(--no)}

/* readiness */
.gate{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:22px;margin:26px 0}
.gate h3{margin:0 0 4px;font-size:20px}
.gate .st{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
.gate .st.go{color:var(--ok)}.gate .st.no{color:var(--warn)}
.grid5{display:grid;gap:9px;margin-top:14px}
@media(min-width:640px){.grid5{grid-template-columns:repeat(5,1fr)}}
.mini{background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:11px 12px}
.mini b{display:block;font-family:"Fraunces",serif;font-size:20px;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums}
.mini span{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;line-height:1.3}
.mini.g b{color:var(--ok)}.mini.r b{color:var(--no)}.mini.n b{color:var(--muted)}

.steps{counter-reset:st;list-style:none;padding:0;margin:0}
.steps li{counter-increment:st;position:relative;padding:0 0 22px 50px;border-left:2px solid var(--line2);margin-left:15px}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:-16px;top:-2px;width:30px;height:30px;display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:12px;background:var(--acc);color:#fff;border-radius:50%}
:root[data-theme="dark"] .steps li::before,html:not([data-theme="light"]) .steps li::before{color:#121110}
.steps h4{margin:0 0 4px;font-size:17.5px}
.steps p{margin:0 0 6px;font-size:16px;color:var(--ink2)}

.svgwrap{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:18px;margin:18px 0;overflow-x:auto}
.svgwrap svg{display:block;max-width:100%;height:auto}
.svgcap{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}

.foot{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.8}

/* ---------- mastery layer ---------- */
.pbox{display:flex;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:22px 24px;margin:26px 0;flex-wrap:wrap}
.pnum{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:clamp(40px,8vw,58px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex:none}
.pnum.g{color:var(--ok)}.pnum.m{color:var(--warn)}.pnum.r{color:var(--no)}
.pmeta{flex:1 1 240px;min-width:0}
.pmeta b{display:block;font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.pmeta span{display:block;font-size:14.5px;color:var(--ink2);line-height:1.5}

.nextbox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;box-shadow:var(--sh);padding:20px 22px;margin:22px 0}
.nextbox .lbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 7px}
.nextbox h3{margin:0 0 6px;font-size:21px}
.nextbox p{margin:0;color:var(--ink2);font-size:16px}
.nextbox .row{margin-top:15px}

.stats3{display:grid;gap:9px;margin:20px 0;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.stats3{grid-template-columns:repeat(4,1fr)}}
.s3{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:14px 15px}
.s3 b{display:block;font-family:"Fraunces",serif;font-size:26px;line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums}
.s3 span{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.35;display:block}
.s3.g b{color:var(--ok)}.s3.r b{color:var(--no)}

.checks{display:grid;gap:9px;margin:24px 0}
.chk{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);padding:15px 17px}
.chk .mk{font-family:"DM Mono",monospace;font-size:17px;line-height:1.2;flex:none;width:20px;text-align:center}
.chk.ok .mk{color:var(--ok)}
.chk.no .mk{color:var(--warn)}
.chk.no{border-left:3px solid var(--warn)}
.chk.ok{border-left:3px solid var(--ok)}
.chk b{display:block;font-size:16px;margin-bottom:3px;line-height:1.35}
.chk span{display:block;font-size:14.5px;color:var(--muted);line-height:1.5}

.inp{font-family:"Karla",sans-serif;font-size:15px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:170px}
.inp:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}

.tag{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap;display:inline-block}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.n{background:var(--card3);color:var(--muted)}

.pill.gen{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pill.val{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.confrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:12px 14px;background:var(--card2);border:1px solid var(--line2);border-radius:8px}
.confrow .cl{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.cbtn{font-family:"Karla",sans-serif;font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.cbtn:hover{border-color:var(--acc);color:var(--acc)}
.cbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.btn.sm{font-size:13px;padding:8px 14px;margin-left:auto}
.exp .src{margin-top:10px;font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.7}
.exp .src code{font-size:11.5px;color:var(--ink2)}
.mut{color:var(--muted);font-size:15px}
.result .verdict.g{color:var(--ok)}.result .verdict.r{color:var(--no)}
.result .big.g{color:var(--ok)}.result .big.r{color:var(--no)}
td b.g{color:var(--ok)}td b.m{color:var(--warn)}td b.r{color:var(--no)}
.mini.m b{color:var(--warn)}
.mode .sc.m{color:var(--warn)}
.hero.col{padding-bottom:8px}

/* ---------- mastery layer ---------- */
.pbox{display:flex;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:22px 24px;margin:26px 0;flex-wrap:wrap}

var QB=[
["I","UA.I.B.K21b","What is the maximum altitude for a small UAS under part 107?",["400 ft AGL, or within 400 ft of a structure's uppermost limit", "500 ft AGL anywhere", "400 ft MSL"],0,"<b>400 ft AGL.</b> The structure exception permits higher only within a 400 ft radius of a structure and no more than 400 ft above its uppermost limit. Note <b>AGL, not MSL</b>. Most altitudes on a sectional (airspace floors and ceilings, MEFs, airport elevations, the bold obstruction number) are MSL, but the obstruction height in parentheses is AGL, and so are Class E vignette floors and MTR altitudes.",0,1,"14 CFR 107.51(b)",""],
["I","UA.I.B.K21a","Maximum groundspeed for a small UAS?",["100 mph (87 knots)", "87 mph (100 knots)", "120 mph (104 knots)"],0,"<b>100 mph = 87 knots.</b> Both numbers appear as distractors with the units swapped. Read the unit before the number.",0,1,"14 CFR 107.51(a)",""],
["I","UA.I.B.K21c","Minimum flight visibility for small UAS operations?",["1 statute mile", "3 statute miles", "5 statute miles"],1,"<b>3 statute miles</b>, measured <b>from the control station</b>, not from the aircraft.",0,1,"14 CFR 107.51(c)",""],
["I","UA.I.B.K21d","Minimum distance from clouds?",["500 ft below, 1,000 ft horizontally", "1,000 ft below, 2,000 ft horizontally", "500 ft below, 2,000 ft horizontally"],2,"<b>500 below, 2,000 horizontal.</b> Mnemonic: 5 and 20.",0,1,"14 CFR 107.51(d)",""],
["I","UA.I.B.K1","Which small unmanned aircraft must be registered to operate under part 107?",["Any weighing more than 0.55 lb", "Only aircraft flown commercially", "All, regardless of weight"],2,"<b>All of them, regardless of weight.</b> 14 CFR 48.15(b) waives registration only for an aircraft that weighs 0.55 lb or less <b>and</b> is operated exclusively under the 49 U.S.C. 44809 recreational exception. Both conditions must hold. A sub-250 g drone flown under part 107 still must be registered. The under-0.55-lb rule you have probably heard is the <b>recreational</b> rule, and this is one of the most common traps on the exam.",0,1,"14 CFR 48.15(b)",""],
["I","UA.I.A.K2","Maximum weight of a small unmanned aircraft under part 107?",["Less than 55 lb including everything on board at takeoff", "55 lb excluding payload", "Exactly 55 lb"],0,"<b>Less than 55 lb</b> including everything on board or otherwise attached at takeoff.",0,1,"14 CFR 107.3 (definition of \"small unmanned aircraft\")",""],
["I","UA.I.C.K3","Minimum age to be issued a Remote Pilot Certificate?",["14", "16", "18"],1,"<b>16 to be a remote pilot. 13 to register as an aircraft owner.</b> Both ages are offered as distractors.",0,1,"14 CFR 107.61(a)",""],
["I","UA.I.B.K1","Minimum age to register a small unmanned aircraft?",["13", "16", "18"],0,"<b>13.</b> A younger owner must have someone 13 or older register on their behalf.",0,1,"14 CFR 48.25(b)",""],
["I","UA.I.A.K4","Your drone strikes a parked car causing $700 damage. What is required?",["Report to the FAA within 10 calendar days", "Report to ATC immediately", "Nothing, no injury occurred"],0,"<b>Report to the FAA within 10 calendar days.</b> Triggered by serious injury to any person, any loss of consciousness, or damage to property other than the small UA that <b>exceeds</b> $500 (repair cost, or fair market value if destroyed). Damage of exactly $500 is not reportable. 14 CFR 107.9 is now titled Safety event reporting.",0,2,"14 CFR 107.9(b)(1)",""],
["I","UA.I.A.K4","Your $3,000 aircraft is destroyed in an empty field. No injury, no other damage. What must be reported?",["Nothing", "The aircraft value within 10 days", "An NTSB report"],0,"<b>Nothing.</b> Damage to the small UA itself is explicitly excluded from the $500 threshold.",0,3,"14 CFR 107.9(b)",""],
["I","UA.I.A.K4","The $500 property damage threshold is measured how?",["Repair cost or fair market value, whichever is less", "Replacement cost only", "Insurance deductible"],0,"<b>Repair cost or fair market value, whichever is less</b>, excluding the small UA itself.",0,2,"14 CFR 107.9(b)(1)-(2)",""],
["I","UA.I.C.K4","How often must a remote pilot complete recurrent training?",["12 calendar months", "24 calendar months", "The certificate needs no renewal"],1,"<b>Every 24 calendar months</b>, free and online. The certificate itself does not expire; your currency to act as remote PIC does.",0,1,"14 CFR 107.65",""],
["I","UA.I.B.K4a","May a person without a remote pilot certificate manipulate the controls?",["Never", "Yes, under the direct supervision of a remote PIC who can immediately take control", "Yes, if they are 16 or older"],1,"<b>Yes, with direct supervision.</b> The remote PIC must have the ability to immediately take direct control.",0,2,"14 CFR 107.12(a)(2)",""],
["I","UA.I.B.K12","How many small unmanned aircraft may one person operate at a time?",["One", "Three", "Any number with visual observers"],0,"<b>One.</b> No exception exists without a waiver.",0,1,"14 CFR 107.35",""],
["I","UA.I.B.K7","When may a small UAS be operated from a moving vehicle?",["Never", "Over a sparsely populated area, and not while carrying property for compensation", "Anytime with a visual observer"],1,"<b>Sparsely populated areas only.</b> Over a congested area it requires a waiver.",0,2,"14 CFR 107.25(b)",""],
["I","UA.I.B.K25","What is required to operate at night without a waiver?",["Anti-collision lighting visible for at least 3 statute miles", "A transponder", "A visual observer"],0,"<b>Anti-collision lights visible for 3 statute miles</b> with a flash rate sufficient to avoid collision (107.29(a)(2)), and the remote PIC must have completed an initial knowledge test <b>or</b> training under 107.65 <b>after 6 April 2021</b> (107.29(a)(1)). For pilots certificated before that date, that means the updated recurrent training.",0,1,"14 CFR 107.29(a)",""],
["I","UA.I.B.K25","When may the remote PIC reduce anti-collision light intensity?",["Never", "When manned aircraft are nearby", "When it is in the interest of safety to do so"],2,"<b>When it is in the interest of safety</b>, for example when glare is degrading the remote PIC's own vision.",0,2,"14 CFR 107.29(a)(2)",""],
["I","UA.I.B.K8","Maximum blood alcohol concentration to act as remote PIC?",["0.02", "0.04", "0.08"],1,"<b>0.04</b>, and no operation within <b>8 hours</b> of consuming alcohol, and never while under the influence.",0,1,"14 CFR 107.27, incorporating 14 CFR 91.17(a)",""],
["I","UA.I.B.K13","Does part 107 permit carriage of hazardous material?",["Yes, under 55 lb", "No, and it is not waivable", "Yes, with a waiver"],1,"<b>No.</b> Prohibited outright and absent from the 107.205 list of waivable sections.",0,2,"14 CFR 107.36; waivable list at 14 CFR 107.205",""],
["I","UA.I.B.K10","Visual line of sight must be maintained how?",["With the unaided eye, other than corrective lenses", "Through the first-person-view camera", "With binoculars where needed"],0,"<b>Unaided, except corrective lenses.</b> FPV, binoculars and zoom do not satisfy VLOS. FPV is permitted only when a visual observer maintains unaided VLOS.",0,2,"14 CFR 107.31(a) and (b)",""],
["I","UA.I.B.K11","What must a visual observer be able to do?",["Hold a remote pilot certificate", "Maintain effective communication with the remote PIC at all times", "Take over the controls"],1,"<b>Effective communication at all times</b>, and see the aircraft. No certificate is required of a visual observer.",0,1,"14 CFR 107.33(a)",""],
["I","UA.I.B.K14","You must yield the right of way to which aircraft?",["Only manned aircraft", "All other aircraft", "None below 400 ft"],1,"<b>All other aircraft.</b> There is no altitude at which this reverses.",0,1,"14 CFR 107.37(a)",""],
["I","UA.I.B.K4","Who has final authority over the operation?",["The visual observer", "The remote pilot in command", "The registered owner"],1,"<b>Remote PIC.</b> Responsibility and authority questions default here unless the stem makes it impossible.",0,1,"14 CFR 107.19(b)",""],
["I","UA.I.B.K2","Who ensures the aircraft is in a condition for safe operation?",["The remote PIC", "A certificated mechanic", "The manufacturer"],0,"<b>Remote PIC</b>, before every flight, and the operation must stop if that condition changes.",0,1,"14 CFR 107.15(a)-(b)",""],
["I","UA.I.B.K5","During an in-flight emergency the remote PIC may do what?",["Nothing, all rules still apply", "Deviate from any rule of part 107 to the extent necessary", "Deviate only from altitude limits"],1,"<b>Deviate from any rule of part 107</b> to the extent necessary to meet the emergency. A written report goes to the FAA <b>upon request</b>.",0,2,"14 CFR 107.21(a)-(b)",""],
["I","UA.I.B.K6a","Which is prohibited under 107.23?",["Careless or reckless operation", "Operating above 200 ft AGL", "Operating with a visual observer"],0,"<b>Careless or reckless operation</b>, and dropping an object in a manner that creates an undue hazard.",0,1,"14 CFR 107.23(a)-(b)",""],
["I","UA.I.C.K3","A passing knowledge test report is valid for certificate application for how long?",["12 calendar months", "24 calendar months", "Indefinitely"],1,"<b>24 calendar months.</b> File FAA Form 8710-13 inside that window.",0,1,"FAA Airman Knowledge Test Report (UAG); 14 CFR 107.65",""],
["I","UA.I.C.K3","If you fail the knowledge test, when may you retest?",["Immediately", "After 14 calendar days", "After 30 days with an endorsement"],1,"<b>14 calendar days.</b> No instructor endorsement or remedial training is required, unlike part 61 retests. Full fee again.",0,2,"14 CFR 107.71",""],
["I","UA.I.E.K3a","Weight limit for Category 1 operations over human beings?",["0.55 lb or less", "1.32 lb or less", "4.4 lb or less"],0,"<b>0.55 lb (250 g) or less</b> on takeoff and throughout the operation, including everything attached, <b>and</b> no exposed rotating parts that would lacerate human skin. Category 1 is the only category whose threshold is a weight rather than an impact energy, but weight alone is not enough. Sustained flight over an open-air assembly additionally requires the aircraft meet 14 CFR 89.110 or 89.115(a).",0,1,"14 CFR 107.110(a)(1)-(2), (b)",""],
["I","UA.I.E.K16","Category 2 requires the aircraft transfer no more than what impact energy?",["11 ft-lb", "25 ft-lb", "55 ft-lb"],0,"<b>11 ft-lb for Category 2</b>, 25 ft-lb for Category 3. Both require a Declaration of Compliance.",0,2,"14 CFR 107.120(a)(1); 107.130(a)(1); 107.160",""],
["I","UA.I.E.K3c","Category 3 operations are limited to what impact energy, and what siting?",["25 ft-lb, closed or restricted access sites, no open-air assemblies", "11 ft-lb, anywhere", "No limit, any site"],0,"<b>25 ft-lb</b> (107.130(a)(1)), never over open-air assemblies (107.125(b)), and flight above people only under one of <b>two</b> conditions in 107.125(c): inside a closed or restricted-access site where everyone present is on notice, <b>or</b> no sustained flight over any person who is not a participant, under a covered structure, or inside a stationary vehicle.",0,3,"14 CFR 107.125(b)-(c)",""],
["I","UA.I.E.K3d","Which category requires an airworthiness certificate?",["Category 2", "Category 3", "Category 4"],2,"<b>Category 4</b>, issued under part 21, plus maintenance under an FAA-accepted program.",0,2,"14 CFR 107.140(b)(1)",""],
["I","UA.I.E.K13","Which categories require a manufacturer Declaration of Compliance?",["Categories 2 and 3", "Category 1 only", "All four"],0,"<b>Categories 2 and 3</b> require an FAA-accepted Declaration of Compliance under 107.160. Category 1 needs none because it qualifies on weight (0.55 lb or less) plus the no-exposed-rotating-parts condition. Category 4 relies on a part 21 airworthiness certificate instead.",0,2,"14 CFR 107.160; 107.110(a)(2)",""],
["I","UA.I.F.K1","Your standard Remote ID equipment fails in flight. What do you do?",["Land as soon as practicable", "Notify the nearest ATC facility", "Continue while maintaining visual line of sight"],0,"<b>Land as soon as practicable.</b> There is no in-flight workaround and no call that fixes it.",0,2,"14 CFR 89.110(a)(2)",""],
["I","UA.I.F.K2","What are the three means of Remote ID compliance?",["Standard Remote ID aircraft, a broadcast module, or operating within a FRIA", "Transponder, ADS-B, or radio", "Registration, marking, or waiver"],0,"<b>Standard Remote ID, broadcast module, or FRIA.</b> With a broadcast module you must maintain visual line of sight at all times.",0,2,"14 CFR 89.105, 89.110, 89.115(a) and (b)",""],
["I","UA.I.F.K7","Where is your Remote ID broadcast module serial number listed?",["The Declaration of Compliance", "The Certificate of Aircraft Registration", "The Means of Compliance"],1,"<b>Certificate of Aircraft Registration.</b> Under 89.115(a)(1)(ii) the module's serial number is listed on the registration of the unmanned aircraft it is used with. The module is <b>not</b> registered as its own aircraft; its serial is added to that aircraft's existing registration record.",0,2,"14 CFR 89.115(a)(1)(ii)",""],
["I","UA.I.F.K6","Which does a standard Remote ID aircraft broadcast that a broadcast module does not?",["The control station position and altitude", "The registration number", "Velocity"],0,"Standard Remote ID broadcasts the <b>control station</b> position and altitude. A broadcast module instead sends the <b>takeoff location</b>.",0,3,"14 CFR 89.305(b)-(c) vs. 89.315(e)-(f)",""],
["I","UA.I.B.K27","Is a transponder permitted on a small UAS under part 107?",["Yes, always", "Prohibited unless otherwise authorized by the Administrator", "Only above 400 ft"],1,"<b>Prohibited unless otherwise authorized.</b> Same for ADS-B Out. Both are explicit prohibitions.",0,2,"14 CFR 107.52; 14 CFR 107.53",""],
["I","UA.I.D.K1","Which of these is NOT waivable under 107.205?",["Operation in certain airspace (107.41)", "Operation over human beings", "Carriage of hazardous material"],2,"<b>Carriage of hazardous material (107.36).</b> It is absent from the 107.205 waivable list. Airspace (107.41) and operations over people (107.39) are both waivable.",0,3,"14 CFR 107.205; 14 CFR 107.29; 14 CFR 107.36",""],
["I","UA.I.D.K1","Where do you apply for a Certificate of Waiver?",["FAA DroneZone", "Your local FSDO by mail", "IACRA"],0,"<b>FAA DroneZone.</b> The FAA issues a waiver if it finds the operation can be conducted safely under the waiver's terms.",0,1,"14 CFR 107.200(a); FAA DroneZone (faadronezone-access.faa.gov)",""],
["I","UA.I.B.K20","What must the remote PIC do regarding other participants before flight?",["Inform all directly participating persons of conditions, emergency procedures, roles and hazards", "Nothing", "Collect signatures"],0,"All directly participating persons must be briefed on operating conditions, emergency and contingency procedures, roles and responsibilities, and potential hazards.",0,2,"14 CFR 107.49(b)",""],
["I","UA.I.A.K3","Falsifying an application or record under part 107 can result in what?",["A warning letter", "Denial, suspension or revocation of any certificate or waiver held", "A fixed $50 fine"],1,"Falsification, reproduction or alteration is grounds for <b>denial, suspension or revocation</b>.",0,2,"14 CFR 3.403(d) (14 CFR 107.5 is now [Reserved]; falsification consolidated into part 3 subpart D, 90 FR 59376, Dec. 19, 2025)",""],
["I","UA.V.F.K5","Who may perform maintenance on a small UAS?",["Only an A&P mechanic", "Anyone the operator determines qualified, following manufacturer guidance", "Only the manufacturer"],1,"Part 107 imposes no certificated-mechanic requirement. Follow manufacturer guidance and keep records.",0,2,"AC 107-2A, Ch. 7 (Maintenance and Inspection); cf. 14 CFR 107.140(c) for Category 4",""],
["I","UA.I.B.K3","You have a medical condition that would interfere with safe operation. What applies?",["You may not act as remote PIC or visual observer", "You may fly with a waiver", "It only matters above 200 ft"],0,"<b>You may not operate.</b> Part 107 requires no medical certificate but does prohibit operating with a known interfering condition.",0,2,"14 CFR 107.17",""],
["I","UA.I.B.K26","Transporting property for compensation under part 107 requires what?",["Prohibited entirely", "Combined aircraft and payload under 55 lb, within one state, not from a moving vehicle", "A part 135 certificate in all cases"],1,"Permitted with limits: under 55 lb total, wholly within the boundaries of a single state, and not from a moving vehicle or aircraft.",0,3,"14 CFR 107.1(b)(1); 14 CFR 107.3 (definition of small unmanned aircraft); 14 CFR 107.25(b); FAA AC 107-2A, Transportation of Property for Compensation or Hire",""],
["I","UA.I.A.K5","The FAA may inspect your aircraft and records when?",["Only after an accident", "Upon request at any reasonable time", "Never without a warrant"],1,"The remote PIC must make the aircraft and associated documents and records available to the Administrator upon request.",0,2,"14 CFR 107.7(a)(3), (b)",""],
["I","UA.I.F.K2","What is a FRIA?",["An FAA-Recognized Identification Area where Remote ID equipment is not required", "A class of restricted airspace", "A category of waiver"],0,"<b>FAA-Recognized Identification Area.</b> Flying inside one satisfies Remote ID without equipment, provided you remain within visual line of sight.",0,2,"14 CFR 89.115(b)",""],
["I","UA.I.A.K1","Does part 107 apply to recreational flyers?",["Yes, always", "Not if they meet every condition of the limited recreational exception", "Only above 400 ft"],1,"Recreational flyers may operate under the statutory exception. Failing any of its conditions puts the flight under part 107.",0,3,"14 CFR 107.1(b)(2); 49 U.S.C. 44809(b)",""],
["I","UA.I.B.K1","Where must the registration number be displayed?",["Inside the battery compartment", "On an external surface, legible without tools", "It need not be displayed"],1,"<b>On an external surface</b> and legible without tools or opening any compartment.",0,2,"14 CFR 48.205",""],
["I","UA.I.B.K1","How long is small UAS registration valid?",["1 year", "3 years", "Indefinitely"],1,"<b>3 years</b>, then renewal.",0,1,"14 CFR 48.100(c) (part 107 aircraft); 14 CFR 48.105(c) (44809 aircraft)",""],
["I","UA.I.B.K24","Under 14 CFR 107.29(c), civil twilight outside Alaska means which periods?",["From 30 minutes before official sunrise until official sunrise, and from official sunset until 30 minutes after official sunset", "One continuous period from 30 minutes before sunrise to 30 minutes after sunset", "One hour either side of sunrise and sunset"],0,"<b>Two separate 30 minute windows</b>, one on each end of the day. The single continuous window is the obsolete pre-2021 daylight-operation definition and is a live distractor. Anti-collision lighting is required during civil twilight under 107.29(b). In Alaska, civil twilight is as defined in the Air Almanac.",0,2,"14 CFR 107.29(c)",""],
["I","UA.I.B.K6b","May you drop an object from a small UA?",["Never", "Yes, if it creates no undue hazard to persons or property", "Only with a waiver"],1,"Permitted so long as it does not create an <b>undue hazard</b>. Careless or reckless operation is separately prohibited.",0,2,"14 CFR 107.23(b)",""],
["I","UA.I.B.K17","You may not operate so as to interfere with operations at which airports?",["Any airport, heliport or seaplane base", "Only towered airports", "Only Class B airports"],0,"<b>Any</b> airport, heliport or seaplane base, including uncontrolled fields in Class G where no authorization is needed.",0,3,"14 CFR 107.43",""],
["I","UA.I.B.K19","A TFR is active over a stadium and the event sponsor invites you to film. May you fly?",["Yes, sponsorship grants access", "No, TFRs apply to all aircraft", "Yes, if spectators are notified"],1,"<b>No.</b> Venue permission is not FAA authorization.",0,2,"14 CFR 107.47",""],
["I","UA.I.C.K2","Refusing a drug or alcohol test results in what?",["A fine only", "Denial of an application for up to 1 year, or suspension or revocation", "No consequence"],1,"Refusal is grounds for denial for up to one year, or suspension or revocation of a certificate held.",0,2,"14 CFR 107.59",""],
["I","UA.I.E.K6","Operations over a moving vehicle are governed by what?",["Always prohibited", "Category requirements plus whether the site is closed or restricted access", "Permitted below 400 ft"],1,"Section 107.145 permits it subject to the category requirements and site conditions.",0,3,"14 CFR 107.145",""],
["I","UA.I.E.K1","Category restrictions on operations over people apply to whom?",["Everyone within line of sight", "Non-participants, not directly participating persons", "Only children"],1,"Restrictions protect <b>non-participants</b>. Directly participating persons, and people under a covered structure or inside a stationary vehicle, are treated differently.",0,3,"14 CFR 107.39; 14 CFR 107.105",""],
["I","UA.I.B.K21b","The 400 ft structure exception requires which two conditions?",["Within a 400 ft radius of the structure AND no more than 400 ft above its uppermost limit", "Either condition alone", "Only that the structure is under construction"],0,"<b>Both.</b> Radius and height. Meeting only one does not qualify.",0,3,"14 CFR 107.51(b)",""],
["I","UA.I.B.K21c","You are set up at a control station. Visibility at your position is 2 statute miles and improving. May you launch?",["Yes, if the aircraft stays within 400 ft", "No, minimum flight visibility is 3 statute miles from the control station", "Yes, with a visual observer"],1,"<b>No.</b> 3 statute miles is a hard minimum measured from the control station. A visual observer does not substitute.",1,2,"14 CFR 107.51(c)",""],
["I","UA.I.A.K4","A rotor strike lacerates a bystander's arm. The wound requires suturing and the person is hospitalized for treatment. What is required?",["Report the event to the FAA within 10 calendar days", "Nothing, the person was not killed", "Immediate NTSB notification"],0,"<b>Report to the FAA within 10 calendar days.</b> A laceration requiring suturing is an AIS Level 3 serious injury under 14 CFR 107.9(a). NTSB notification is not required for a small UA under 49 CFR part 830.",1,3,"14 CFR 107.9(a); FAA AC 107-2A (serious injury = AIS Level 3)",""],
["I","UA.I.E.K3a","A 240 g aircraft with fully shrouded propellers is flown briefly over a small group of spectators. Which category applies?",["Category 1", "Category 2", "No category, this is prohibited"],0,"<b>Category 1.</b> Under 0.55 lb (250 g) with no exposed rotating parts able to lacerate skin. No Declaration of Compliance needed.",1,2,"14 CFR 107.110(a); 14 CFR 107.160 (Declaration of Compliance applies to Category 2 and 3)",""],
["I","UA.I.B.K10","During an inspection you lose sight of the aircraft behind a tower. Your FPV feed remains clear. What is required?",["Continue, FPV maintains awareness", "Regain unaided visual line of sight immediately or terminate the flight", "Descend below 200 ft"],1,"FPV does not satisfy visual line of sight. Regain unaided VLOS at once or land.",1,3,"14 CFR 107.31(a)",""],
["I","UA.I.B.K7","You are flying from a moving pickup on a rural county road, carrying no payload for hire. Is this permitted?",["Yes, if the area is sparsely populated", "No, never from a moving vehicle", "Only with a visual observer"],0,"Permitted over a <b>sparsely populated</b> area, provided you are not transporting property for compensation.",1,2,"14 CFR 107.25(b)",""],
["I","UA.I.D.K1","Which set is entirely waivable under 107.205?",["Anti-collision lighting for night operations, visual line of sight, operation over human beings", "Hazardous material, right of way under 107.37(b), Remote ID", "Registration, Remote ID, remote pilot certification"],0,"107.205 lists <b>107.25, 107.29(a)(2) and (b), 107.31, 107.33, 107.35, 107.37(a), 107.39, 107.41, 107.51 and 107.145</b>. Carriage of hazardous material (107.36), registration and Remote ID are <b>not</b> waivable, and no waiver of 107.25 or 107.31 will be issued to allow carriage of another person's property for compensation or hire.",1,3,"14 CFR 107.205",""],
["I","UA.I.F.K1","Your broadcast module stops transmitting mid-flight in Class G airspace. What is required?",["Continue, Class G has no Remote ID requirement", "Land as soon as practicable", "Switch to FPV and continue"],1,"Remote ID applies regardless of airspace class. Land as soon as practicable.",1,2,"14 CFR 89.115(a)(4)",""],
["I","UA.I.C.K4","Your certificate was issued 26 months ago and you have not completed recurrent training. What is your status?",["Certificate expired, must retest", "Certificate valid but you may not act as remote PIC until recurrent training is complete", "Fully current, the certificate does not expire"],1,"The certificate does not expire, but aeronautical knowledge recency lapses at 24 calendar months and you may not act as remote PIC until it is restored.",1,3,"14 CFR 107.65",""],
["II","UA.II.B.K2","What is required before operating in Class C airspace?",["Monitor the ATC frequency", "Prior ATC authorization", "Contact ATC after launch"],1,"<b>Prior ATC authorization</b>, obtained through LAANC or DroneZone. Monitoring a frequency is not authorization.",0,1,"14 CFR 107.41 (eCFR)",""],
["II","UA.II.A.K1e","In which airspace may you operate without ATC authorization?",["Class G", "Class E surface area", "Class D"],0,"<b>Class G.</b> B, C, D and surface-area E all require authorization.",0,1,"14 CFR 107.41 (eCFR)",""],
["II","UA.II.A.K1a","On a sectional, Class B airspace is depicted by what?",["Solid magenta lines", "Solid blue lines", "Dashed blue lines"],1,"<b>Solid blue.</b> The full set: B solid blue, C solid magenta, D dashed blue, surface E dashed magenta.",0,1,"FAA Aeronautical Chart Users' Guide, VFR airspace legend; AIM 3-2-3",""],
["II","UA.II.A.K1b","Class C airspace is depicted by what?",["Solid magenta lines", "Dashed magenta lines", "Solid blue lines"],0,"<b>Solid magenta.</b> Dashed magenta is Class E surface area, a different thing entirely.",0,1,"FAA Aeronautical Chart Users' Guide, VFR Airspace (Class C)",""],
["II","UA.II.A.K1c","Class D airspace is depicted by what?",["Dashed blue lines", "Solid blue lines", "Dashed magenta lines"],0,"<b>Dashed blue.</b> The number in the dashed box is the ceiling in hundreds of feet MSL.",0,1,"AIM 3-2-5; FAA Chart Users' Guide VFR airspace legend",""],
["II","UA.II.A.K1d","A dashed magenta line around an airport indicates what?",["Class D", "Class E surface area", "An alert area"],1,"<b>Class E surface area</b>, extending from the ground up, requiring ATC authorization exactly like Class D. The most under-taught authorization case.",0,2,"FAA Chart Users' Guide VFR airspace legend; 14 CFR 107.41",""],
["II","UA.II.A.K1d","A faded magenta vignette indicates what?",["Class E beginning at 700 ft AGL", "Class C", "A restricted area"],0,"<b>Class E starting at 700 ft AGL.</b> The shaded side faces the lower airspace. No authorization needed beneath it.",0,2,"FAA Chart Users' Guide, Class E vignettes; AIM 3-2-6",""],
["II","UA.II.A.K1d","A faded blue vignette abutting Class G indicates what?",["Class E floor at 1,200 ft AGL or greater", "Class B", "Class E surface area"],0,"<b>Class E at 1,200 ft AGL or greater</b> abutting uncontrolled airspace.",0,2,"FAA VFR chart legend, Class E airspace; FAA Chart Users' Guide",""],
["II","UA.II.A.K1d","Where not otherwise designated, Class E generally begins at what altitude?",["700 ft AGL", "1,200 ft AGL", "14,500 ft MSL"],1,"<b>1,200 ft AGL</b> is the default. A magenta vignette lowers it to 700 ft AGL.",0,2,"14 CFR 71.71(e); AIM 3-2-6",""],
["II","UA.II.X.C2","A Class C sector is charted 41 over 13. What does this mean?",["Ceiling 4,100 ft MSL over floor 1,300 ft MSL", "41,000 over 13,000 ft", "4,100 ft AGL over 1,300 ft AGL"],0,"<b>Ceiling over floor, hundreds of feet, MSL, last two zeros dropped.</b> Convert to AGL by subtracting terrain elevation.",0,2,"FAA Chart Users' Guide, VFR Airspace (Class C)",""],
["II","UA.II.X.C2","A Class C shelf shows a floor of 13. Is that AGL or MSL?",["1,300 ft AGL", "1,300 ft MSL", "1,300 meters"],1,"<b>MSL.</b> Class B, C and D ceiling and floor figures on a sectional are MSL in hundreds of feet. Not every charted altitude is MSL though: obstruction heights in parentheses, Class E vignette floors of 700 and 1,200 ft, and MTR altitudes are all AGL.",0,3,"FAA Chart Users' Guide, VFR Airspace (Class C) and Obstructions",""],
["II","UA.II.X.C2","A Class C sector shows SFC in the denominator. What does that mean?",["The airspace extends to the surface", "Surface friction advisory", "Special flight conditions"],0,"<b>Surface.</b> The airspace touches the ground, so ATC authorization is required at any altitude inside it.",0,2,"FAA Chart Users' Guide, VFR Airspace (Class C); 14 CFR 107.41",""],
["II","UA.II.X.C3","The large bold number in a chart quadrangle, 2 with superscript 5, means what?",["Maximum Elevation Figure, 2,500 ft MSL", "Airspace ceiling in thousands", "Magnetic variation"],0,"<b>MEF: 2,500 ft MSL.</b> Highest terrain or obstacle in that 30 by 30 minute quadrangle, rounded up, last two digits dropped.",0,2,"FAA Aeronautical Chart Users' Guide, Maximum Elevation Figures",""],
["II","UA.II.X.C4","An obstruction is charted 1549 with (249) beneath. What do these mean?",["Top at 1,549 ft MSL, structure 249 ft tall", "Top at 1,549 ft AGL, base at 249 ft", "1,549 m and 249 ft"],0,"<b>Top MSL above, height AGL in parentheses.</b> Subtract for ground elevation: 1,549 minus 249 is about 1,300 ft MSL.",0,2,"FAA Aeronautical Chart Users' Guide, Obstructions",""],
["II","UA.II.X.C4","Obstructions are charted on sectionals above what height?",["More than 200 ft AGL", "More than 500 ft AGL", "Any height"],0,"<b>More than 200 ft AGL</b>, or more than 299 ft AGL within yellow city tint.",0,2,"FAA Aeronautical Chart Users' Guide, Obstructions",""],
["II","UA.II.X.C6","On a sectional, a towered airport and its data print in what color?",["Blue", "Magenta", "Green"],0,"<b>Blue means towered. Magenta means non-towered.</b> A one-glance test before you read anything else.",0,2,"FAA Aeronautical Chart Users' Guide, Airport Data",""],
["II","UA.II.X.C6","An airport data block shows runway length 81. What is the actual length?",["81 ft", "810 ft", "About 8,100 ft"],2,"<b>Hundreds of feet</b>, rounded to the nearest 100 using 70 as the division point. A runway of 8,070 ft charts as 81.",0,3,"FAA Aeronautical Chart Users' Guide, Airport Data (runway length)",""],
["II","UA.V.B.K4","RP 13 in an airport data block means what?",["Right traffic for runway 13", "Runway 13 closed", "Reporting point 13"],0,"<b>Right traffic</b> for that runway. Standard is left turns unless RP is noted.",0,2,"FAA Aeronautical Chart Users' Guide, Airport Data (traffic pattern)",""],
["II","UA.V.A.K2","A part-time control tower is closed. Which frequency becomes the CTAF?",["122.95 UNICOM", "The tower frequency", "121.5"],1,"<b>The tower frequency becomes the CTAF.</b> 122.95 is the classic trap. This appears in an official FAA new-format sample question.",0,3,"AIM 4-1-9",""],
["II","UA.II.A.K3","A Military Training Route labeled VR1667 tells you what?",["At or below 1,500 ft AGL", "Above 1,500 ft AGL", "Nothing about altitude"],0,"<b>Four digits means at or below 1,500 ft AGL</b>, which is your airspace. Three or fewer digits means segments above 1,500 ft AGL. VR visual, IR instrument.",0,3,"AIM 3-5-2 (Military Training Routes)",""],
["II","UA.II.A.K2","How do you find out whether a Military Operations Area is active?",["It is always active", "Contact Flight Service or check NOTAMs", "The chart shows current status"],1,"<b>Flight Service or NOTAMs.</b> The chart margin lists times of use and controlling agency, but live status comes from FSS.",0,2,"AIM 3-4-5 (Military Operations Areas)",""],
["II","UA.II.A.K2","What does a restricted area indicate?",["Flight is prohibited at all times", "Hazards such as artillery firing, aerial gunnery or guided missiles; entry requires permission from the using or controlling agency", "Heavy training activity but free entry"],1,"<b>Hazards to aircraft.</b> Entry requires permission from the <b>using or controlling agency, as appropriate</b> (14 CFR 107.45, AIM 3-4-3). For restricted areas it is normally the using agency. Prohibited areas ban flight outright.",0,2,"14 CFR 107.45; AIM 3-4-3",""],
["II","UA.II.A.K2","In an alert area, who is responsible for collision avoidance?",["The controlling agency", "All pilots operating in the area", "ATC"],1,"<b>All pilots.</b> High volume of unusual activity, shared responsibility.",0,2,"AIM 3-4-6 Alert Areas",""],
["II","UA.II.A.K2","Why is a Controlled Firing Area not charted?",["Activity ceases when an aircraft approaches", "It is classified", "It is never active"],0,"<b>Activity stops when aircraft approach</b>, so it poses no hazard and is not charted.",0,3,"AIM 3-4-5 Controlled Firing Areas",""],
["II","UA.II.B.K5","Where would you find a Temporary Flight Restriction?",["Sectional chart", "NOTAMs", "Chart Supplements"],1,"<b>NOTAMs.</b> TFRs are issued and cancelled by NOTAM, so the NOTAM system is the only current source. One nuance: a small set of long-standing national security TFRs is also depicted on sectionals with a broken blue line, but you still have to check NOTAMs.",0,1,"FAA Aeronautical Chart User's Guide, VFR section, Temporary Flight Restrictions",""],
["II","UA.V.B.K6b","Best source of comprehensive information for a particular airport?",["Chart Supplements U.S.", "NOTAMs", "Sectional chart"],0,"<b>Chart Supplements U.S.</b> If the question says comprehensive, this is the answer.",0,1,"AIM 9-1-4 Chart Supplement U.S.",""],
["II","UA.II.X.C5","Lines of latitude measure what?",["Degrees east and west of the Prime Meridian", "Degrees north and south of the equator", "Magnetic variation"],1,"<b>Latitude: north and south of the equator.</b> Longitude: east and west of the Prime Meridian.",0,1,"FAA Aeronautical Chart User's Guide, geographic coordinates / PHAK Ch. 16 (latitude and longitude)",""],
["II","UA.II.X.C1","Dashed magenta lines labeled 7E on a sectional are what?",["Isogonic lines showing magnetic variation", "Class E boundaries", "Military routes"],0,"<b>Isogonic lines</b>, connecting points of equal magnetic variation. Used to convert true to magnetic.",0,3,"FAA Aeronautical Chart User's Guide, VFR Navigational and Procedural Information, 'Isogonic Line and Value'",""],
["II","UA.II.X.C1","Basic terrain contour lines on a sectional are spaced at what interval?",["100 ft", "500 ft", "1,000 ft"],1,"<b>500 ft</b>, with intermediate contours at 250 ft in flatter terrain. Hypsometric tints run light green low to dark brown high.",0,3,"FAA Aeronautical Chart User's Guide, VFR Topographic Information / Contours",""],
["II","UA.II.X.C3","Which is true of a Maximum Elevation Figure?",["It marks a specific charted obstacle", "It is a conservative derived figure including terrain, obstacles and error allowances", "It is the airspace ceiling"],1,"<b>Conservative and derived.</b> Includes a vertical error allowance plus 200 ft for uncharted obstacles, rounded up to the next 100 ft.",0,3,"FAA Aeronautical Chart User's Guide, Maximum Elevation Figures (MEF) derivation",""],
["II","UA.II.X.C4","An obstruction symbol annotated UC means what?",["Under construction", "Uncontrolled", "Unlighted ceiling"],0,"<b>Under construction.</b> Height data may be preliminary.",0,2,"FAA Aeronautical Chart User's Guide, VFR Obstructions",""],
["II","UA.II.X.C4","A group obstruction symbol is annotated with which height?",["The average", "The highest", "The nearest"],1,"<b>Only the highest</b> obstruction of the group is annotated.",0,2,"FAA Aeronautical Chart User's Guide, VFR Obstructions (group obstacle symbol)",""],
["II","UA.II.X.C2","A Class D ceiling shows a dashed box containing minus 13. What does the minus mean?",["Surface to but not including 1,300 ft MSL", "1,300 ft below sea level", "A 13 degree offset"],0,"<b>To but not including.</b> The Class D tops out just below 1,300 ft MSL.",0,3,"FAA Aeronautical Chart User's Guide, VFR Airspace Information (Class D ceiling figures)",""],
["II","UA.II.B.K2","A field is enclosed by a dashed magenta line. You plan to fly at 150 ft AGL. What is required?",["Nothing, you are below 400 ft", "Prior ATC authorization, because this is Class E surface area", "Only a visual observer"],1,"Dashed magenta is Class E <b>surface area</b>. It reaches the ground, so authorization is required at any altitude.",1,3,"FAA Aeronautical Chart User's Guide (Class E surface area) and 14 CFR 107.41",""],
["II","UA.II.X.C2","A Class C shelf reads 40/18. Field elevation beneath you is 600 ft MSL. The floor is how high above you?",["1,200 ft AGL", "1,800 ft AGL", "600 ft AGL"],0,"Floor is 1,800 ft MSL. Subtract 600 ft terrain: <b>1,200 ft AGL</b>. You are well clear at 400 ft AGL.",1,3,"FAA Aeronautical Chart User's Guide, Class C airspace figures (hundreds of feet MSL, ceiling over floor)",""],
["II","UA.II.X.C4","An obstruction reads 2210 (310). What is the approximate ground elevation there?",["About 1,900 ft MSL", "About 2,520 ft MSL", "310 ft MSL"],0,"2,210 MSL top minus 310 ft structure height gives about <b>1,900 ft MSL</b> ground.",1,3,"FAA Aeronautical Chart User's Guide, VFR Obstructions (obstacle elevation conventions)",""],
["II","UA.II.A.K3","A gray line on the chart is labeled IR644. What does this tell you?",["Instrument route with segments above 1,500 ft AGL", "Visual route below 1,500 ft AGL", "A victor airway"],0,"IR is instrument. <b>Three digits means the route includes segments above 1,500 ft AGL.</b> Four digits would mean at or below.",1,3,"FAA Aeronautical Chart User's Guide, Military Training Routes",""],
["II","UA.V.A.K2","An airport data block shows CT 118.3 with an asterisk, and 122.7 with a circled C. When the tower is closed, what do you monitor?",["122.7", "118.3", "Both simultaneously"],0,"<b>122.7.</b> The asterisk after CT 118.3 means the tower is <b>part time</b>. The circled C identifies the published <b>CTAF</b>, which is what you monitor whenever the tower is closed. The CTAF is sometimes the tower frequency itself, but here the chart explicitly designates 122.7.",1,3,"FAA Aeronautical Chart User's Guide (circled C legend) and AIM 4-1-9",""],
["II","UA.II.A.K1e","You are in an area with no charted airspace boundaries, beneath a blue vignette. What class are you in at 300 ft AGL?",["Class E", "Class G", "Class D"],1,"Beneath a Class E floor of 1,200 ft AGL, the airspace from the surface up is <b>Class G</b>. No authorization required.",1,2,"FAA Aeronautical Chart User's Guide, Class E airspace vignettes",""],
["V","UA.V.D.K4","'I can do it, I'll show them' is which hazardous attitude?",["Impulsivity", "Invulnerability", "Macho"],2,"<b>Macho.</b> Antidote: taking chances is foolish.",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, Aeronautical Decision-Making, Hazardous Attitudes and Antidotes table",""],
["V","UA.V.D.K4","'Do something quickly' is which hazardous attitude?",["Macho", "Impulsivity", "Resignation"],1,"<b>Impulsivity.</b> Antidote: not so fast, think first.",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, Aeronautical Decision-Making, Hazardous Attitudes and Antidotes table",""],
["V","UA.V.D.K4","'It won't happen to me' is which hazardous attitude?",["Invulnerability", "Resignation", "Anti-authority"],0,"<b>Invulnerability.</b> Antidote: it could happen to me.",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, Aeronautical Decision-Making, Hazardous Attitudes and Antidotes table",""],
["V","UA.V.D.K4","'What's the use' is which hazardous attitude?",["Macho", "Resignation", "Impulsivity"],1,"<b>Resignation.</b> Antidote: I'm not helpless, I can make a difference.",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, Aeronautical Decision-Making, Hazardous Attitudes and Antidotes table",""],
["V","UA.V.D.K4","'Don't tell me what to do' is which hazardous attitude?",["Anti-authority", "Macho", "Invulnerability"],0,"<b>Anti-authority.</b> Antidote: follow the rules, they are usually right.",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, Aeronautical Decision-Making, Hazardous Attitudes and Antidotes table",""],
["V","UA.V.D.K4","The antidote for Impulsivity is what?",["Not so fast, think first", "It could happen to me", "Follow the rules"],0,"<b>Not so fast, think first.</b> All five antidotes are free points; learn them verbatim.",0,2,"FAA PHAK (FAA-H-8083-25C) Chapter 2, Aeronautical Decision-Making, Hazardous Attitudes and Antidotes table",""],
["V","UA.V.D.K2","CRM applies to which phases of the operation?",["Flight only", "All phases", "Communications only"],1,"<b>All phases</b>, from planning through post-flight debrief.",0,1,"AC 107-2A para 5.3 (ADM and CRM); AC 120-51E, Crew Resource Management Training",""],
["V","UA.V.D.K5","What addresses the accident chain at an organizational level?",["CRM", "Safety Management System", "ADM"],1,"<b>Safety Management System.</b> The formal organization-wide approach. CRM and ADM operate inside it.",0,2,"AC 120-92D, Safety Management Systems for Aviation Service Providers, definition of SMS",""],
["V","UA.V.E.K7","IMSAFE stands for what?",["Illness, Medication, Stress, Alcohol, Fatigue, Emotion", "Inspection, Maintenance, Safety, Airspace, Fuel, Equipment", "Interference, Motion, Speed, Altitude, Frequency, Energy"],0,"<b>Illness, Medication, Stress, Alcohol, Fatigue, Emotion.</b> The personal preflight self-check.",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, I'M SAFE Checklist",""],
["V","UA.V.D.K5","PAVE covers which risk elements?",["Pilot, Aircraft, enVironment, External pressures", "Preflight, Airspace, Visibility, Emergency", "Power, Altitude, Velocity, Endurance"],0,"<b>Pilot, Aircraft, enVironment, External pressures.</b>",0,1,"FAA PHAK (FAA-H-8083-25C) Chapter 2, The PAVE Checklist",""],
["V","UA.V.E.K6","Correct technique for scanning for traffic?",["Short, regularly spaced eye movements across sky segments", "A smooth continuous sweep", "Peripheral vision alone"],0,"<b>Segment by segment</b>, pausing at least a second on each. The eye resolves detail only when it stops moving.",0,2,"AIM 8-1-6, Vision in Flight (Scanning for Other Aircraft)",""],
["V","UA.V.E.K5","What is true about fatigue?",["Easily self-recognized", "An impaired state that is difficult to self-assess", "Overcome by willpower"],1,"<b>Difficult to self-recognize.</b> It degrades judgement before it degrades awareness of the degradation.",0,2,"AIM 8-1-1, Fitness for Flight (Fatigue)",""],
["V","UA.V.E.K2","What is true about alcohol?",["A small amount improves vision", "Water cures a hangover", "It impairs judgement and decision-making"],2,"<b>Judgement and decision-making.</b> A hangover impairs you after the alcohol itself has cleared.",0,1,"AIM 8-1-1, Fitness for Flight (Alcohol)",""],
["V","UA.V.E.K8","Full dark adaptation takes about how long?",["5 minutes", "30 minutes", "It is instant"],1,"<b>About 30 minutes</b>, and a bright white light destroys it in seconds. Use red or dim lighting.",0,2,"AIM 8-1-6, Vision in Flight; Airplane Flying Handbook FAA-H-8083-3C Chapter 11, Night Operations",""],
["V","UA.V.E.K9","At night, the best way to see a dim object is what?",["Look directly at it", "Look about 10 degrees off to the side", "Blink rapidly"],1,"<b>Off-center viewing.</b> The center of the retina has almost no night sensitivity.",0,2,"Airplane Flying Handbook FAA-H-8083-3C Chapter 11, Night Operations (Night Blind Spot / off-center viewing)",""],
["V","UA.V.E.K4","Hyperventilation is best treated how?",["Breathe faster", "Slow the breathing rate, or talk aloud", "Hold your breath"],1,"<b>Slow the rate.</b> It results from expelling too much carbon dioxide.",0,2,"FAA Glider Flying Handbook FAA-H-8083-13A Chapter 13, Human Factors (Hyperventilation)",""],
["V","UA.V.E.K1","Dehydration and heatstroke affect a remote pilot how?",["Not at all, you are on the ground", "They degrade alertness, reaction time and judgement", "Only above 400 ft"],1,"Being on the ground does not exempt you from physiology.",0,2,"FAA Glider Flying Handbook FAA-H-8083-13A Chapter 13 (Dehydration and Heatstroke); FAA PHAK Chapter 17",""],
["V","UA.V.E.K3","You take an over-the-counter antihistamine. May you fly?",["Yes, OTC drugs are always acceptable", "No, if it could interfere with safe operation", "Only with a waiver"],1,"<b>No.</b> Many OTC medications cause drowsiness. Part 107 prohibits operating with a condition or medication that would interfere.",0,3,"14 CFR 107.17 and 14 CFR 107.27 (incorporating 14 CFR 91.17); AIM 8-1-1",""],
["V","UA.V.C.K1","Who briefs participants on emergency procedures?",["The FAA", "The lead visual observer", "The remote pilot in command"],2,"<b>Remote PIC.</b>",0,1,"14 CFR 107.49(a)(2); AC 107-2A para 5.11.1",""],
["V","UA.V.C.K2a","A lithium polymer battery is swollen. What should you do?",["Charge it slowly to recondition it", "Remove it from service and dispose of it properly", "Puncture it to vent"],1,"<b>Remove from service.</b> Never charge a swollen, punctured or damaged pack, and never puncture one.",0,2,"FAA SAFO 09013 (lithium battery thermal runaway); FAA SAFO 16001; FAA-S-ACS-10B UA.V.C.K2a",""],
["V","UA.V.C.K2d","A lithium battery fire should be handled how?",["Smothered with a blanket", "Cooled with large volumes of water or a lithium-rated extinguisher", "Left to burn indoors"],1,"<b>Cool it.</b> Per FAA SAFO 09013, extinguish the flames with a Halon, Halon replacement or water extinguisher, then douse the device with water or another non-alcoholic liquid to cool it and stop adjacent cells entering thermal runaway. <b>Do not cover the device</b> and do not use ice; insulating it traps heat. Re-ignition is possible because cooling, not flame knockdown, is what stops thermal runaway.",0,2,"FAA SAFO 09013, Fighting Fires Caused by Lithium Type Batteries in Portable Electronic Devices",""],
["V","UA.V.C.K2b","When is it safe to charge a LiPo battery?",["Immediately after landing while warm", "After cooling to ambient, attended, on a non-flammable surface", "Overnight unattended"],1,"<b>Cool, attended, on a fire-resistant surface.</b> Let a pack return to ambient temperature before charging, never leave a charging pack unattended, and follow the manufacturer's instructions. Charging a hot or damaged pack raises the risk of an internal short and thermal runaway (FAA SAFO 09013).",0,2,"FAA-S-ACS-10B UA.V.C.K2b (Safe charging); FAA SAFO 09013",""],
["V","UA.V.C.K3","What is a fly-away?",["Any flight beyond visual line of sight", "A lost link where the aircraft does not follow its programmed lost-link procedure", "Normal return to home"],1,"<b>Lost link plus failure of the programmed procedure.</b> Know your aircraft's lost-link behavior before launch.",0,2,"FAA Notice N 8900.227, Unmanned Aircraft Systems (UAS) Operational Approval, Definitions (Fly-Away / Lost Link)",""],
["V","UA.V.C.K4","Loss of GPS in flight can cause what?",["Immediate battery failure", "Degraded position hold and drift", "Automatic shutdown"],1,"<b>Degraded position hold and drift.</b> Be able to fly manually.",0,2,"FAA-S-ACS-10B, Remote Pilot sUAS ACS, Area V Task C, UA.V.C.K4; supporting FAA text on GPS interference",""],
["V","UA.V.C.K5","Most consumer small UAS control links use which bands?",["2.4 GHz and 5.8 GHz", "121.5 MHz", "1090 MHz"],0,"<b>2.4 and 5.8 GHz</b>, shared unlicensed bands, so interference is a real operational risk.",0,2,"AC 107-2A, Appendix B (Supplemental Operational Information), small UAS frequency spectrums; cross-referenced by FAA-S-ACS-10B UA.V.C.K5",""],
["V","UA.V.B.K3","Runway 27 points toward which magnetic heading?",["027", "270", "027 true"],1,"<b>270 magnetic.</b> The runway number is the whole number nearest one tenth of the runway's magnetic azimuth measured clockwise from magnetic north. Round the magnetic heading to the nearest 10 degrees and drop the trailing zero, so 268 degrees is Runway 27, not 26. It is rounding, not truncation.",0,1,"AIM 2-3-3(b), Runway Markings / Runway Designators",""],
["V","UA.V.B.K4","What is the standard traffic pattern direction?",["Left turns", "Right turns", "Varies by aircraft"],0,"<b>Left turns</b> unless RP is published or the segmented circle indicates otherwise.",0,1,"AIM 4-3-3, Traffic Patterns (see also 14 CFR 91.126(b))",""],
["V","UA.V.A.K2","What is CTAF used for?",["Receiving ATC clearances", "Airport advisory practices where no tower is operating", "Filing flight plans"],1,"<b>Advisory practices without an operating tower.</b> Pilots self-announce position and intentions.",0,1,"FAA Pilot/Controller Glossary, COMMON TRAFFIC ADVISORY FREQUENCY (CTAF); also FAA-G-8082-22 Remote Pilot Study Guide",""],
["V","UA.V.A.K4","What does UNICOM provide?",["A non-government air-ground station for advisory and airport services", "ATC clearances", "Forecasts only"],0,"<b>Non-government communication facility</b> providing airport information at public-use airports.",0,2,"AIM 4-1-9(g), UNICOM/MULTICOM",""],
["V","UA.V.A.K5","ATIS provides what?",["Continuous recorded non-control information", "Direct ATC clearance", "Emergency monitoring"],0,"<b>Recorded non-control information</b>: weather, active runway, NOTAMs, broadcast continuously.",0,1,"AIM 4-1-13(a), Automatic Terminal Information Service (ATIS)",""],
["V","UA.V.A.K7","How is the letter J pronounced phonetically?",["Juliett", "Jupiter", "Jackson"],0,"<b>Juliett</b>, spelled with two Ts.",0,1,"AIM 4-2-7, Phonetic Alphabet (TBL 4-2-2)",""],
["V","UA.V.B.K4","A segmented circle with L-shaped extensions indicates what?",["Traffic pattern direction", "Runway length", "Wind speed"],0,"<b>Traffic pattern direction.</b> The extensions show the direction of turn from base to final.",0,3,"AIM 4-3-4(b), Traffic Pattern Indicators / Segmented Circle Airport Marking System",""],
["V","UA.II.B.K4e","A laser illumination incident should be reported to whom?",["No one", "The FAA and local law enforcement", "The manufacturer"],1,"A safety and criminal matter. Report it.",0,2,"FAA Laser Safety Initiative (faa.gov/about/initiatives/lasers); see also AIM 7-6-13, Reporting Laser Illumination",""],
["V","UA.II.B.K4f","Why avoid flying near a thermal plume?",["It looks unprofessional", "Invisible violent turbulence and rising heated air", "It is illegal"],1,"<b>Severe invisible turbulence</b> that can flip or destabilize a small UA without warning.",0,2,"AIM 7-6-16, Flight Operations in the Vicinity of Exhaust Plumes (Smoke Stacks and Cooling Towers)",""],
["V","UA.II.B.K4g","Primary risk in a wire environment?",["Radio interference", "Wires are very hard to see and often uncharted", "Wires attract lightning"],1,"<b>Wires are nearly invisible</b> and frequently uncharted. Find the towers and infer the span.",0,3,"AIM 7-6-4, Obstructions to Flight / Flying in the Wire Environment",""],
["V","UA.II.B.K4d","Precipitation static causes what?",["Loss of radio communication and possible corona discharge", "Longer battery life", "Better GPS accuracy"],0,"<b>Radio interference</b> from static charge accumulating on the airframe.",0,3,"AIM 7-6-12, Precipitation Static",""],
["V","UA.II.B.K4b","Why avoid flight beneath an unmanned free balloon?",["They are manned", "A long, nearly invisible tether may extend below", "They emit radiation"],1,"An unmanned <b>free</b> balloon usually trails a suspension device holding its payload, a trailing wire antenna, or both. These are often invisible until you are close, so stay well clear and never fly beneath one. The AIM states no specific length. Note a free balloon is not tethered; a moored balloon is a different thing under 14 CFR part 101 subpart B.",0,3,"AIM 7-6-5, Avoid Flight Beneath Unmanned Balloons",""],
["V","UA.V.F.K1","The manufacturer provides no maintenance schedule. What should you do?",["No maintenance required", "Develop and follow your own scheduled protocol", "Wait for an FAA inspection"],1,"<b>Develop your own.</b> Absence of a schedule never means no maintenance.",0,2,"AC 107-2A, paragraph 7.2, Scheduled Maintenance",""],
["V","UA.V.F.K4","Appropriate small UAS record keeping means what?",["Records are unnecessary", "Maintain maintenance, repair and component replacement records", "Accident records only"],1,"Records demonstrate the aircraft was in a condition for safe operation.",0,2,"AC 107-2A, paragraph 7.2, Small UAS Maintenance and Inspection / recordkeeping",""],
["V","UA.V.F.K6","An additional preflight item specific to night operations is what?",["Verifying anti-collision lighting operation and visibility", "Checking the transponder", "Filing a flight plan"],0,"<b>Anti-collision lighting</b>, verified working and visible for 3 statute miles.",0,2,"14 CFR 107.29(a)(2); AC 107-2A paragraph 5.11.1",""],
["V","UA.V.D.K3","Your visual observer loses sight of the aircraft. What should you do?",["Continue, you have the camera feed", "Act immediately to regain visual line of sight or land", "Climb to find it"],1,"VLOS is continuous. Regain it at once or terminate. The camera feed does not satisfy it.",0,3,"AC 107-2A, paragraph 5.9 (Visual Line of Sight); 14 CFR 107.31",""],
["V","UA.V.D.K1a","Effective team communication means what?",["Only the PIC speaks", "Clear, confirmed exchanges with roles defined in the briefing", "Radio silence"],1,"Roles assigned beforehand, plain language, and confirmation that messages were received.",0,2,"AC 107-2A, paragraph 5.9.2.2 (VO communication); paragraph 5.3 (CRM)",""],
["V","UA.V.D.K4","A pilot continues an inspection in deteriorating light, thinking the crew will be impressed if the job finishes today. Which attitude and antidote apply?",["Macho — taking chances is foolish", "Resignation — I'm not helpless", "Anti-authority — follow the rules"],0,"Performing for an audience at the cost of margin is <b>Macho</b>. Antidote: taking chances is foolish.",1,3,"FAA-H-8083-25, Pilot's Handbook of Aeronautical Knowledge, Ch. 2, The Five Hazardous Attitudes and Antidotes (also AC 60-22)",""],
["V","UA.V.C.K2d","A pack ignites during charging in your garage. What is the correct immediate response?",["Cover it with a wool blanket", "Apply large volumes of water or a lithium-rated extinguisher and evacuate the space", "Move it to a cardboard box"],1,"<b>Flood it with large amounts of water</b> or another non-alcoholic liquid to cool the pack and stop cell to cell thermal runaway, and clear the toxic smoke. <b>Do not cover the pack, do not use ice, and do not pick it up or move it</b> (SAFO 09013, SAFO 25002). FAA guidance does not endorse Class D agents for lithium-ion packs, and Halon may knock down flame briefly without halting thermal runaway.",1,3,"SAFO 25002, Lithium Battery Fire and Overheating Conditions; SAFO 09013, Fighting Fires Caused by Lithium Type Batteries (both referenced by FAA-S-ACS-10B for UA.V.C.K2d)",""],
["V","UA.V.E.K5","You slept four hours, feel alert and have a deadline. What is the correct assessment?",["Alertness proves you are fit", "Fatigue is not reliably self-detectable; treat the sleep deficit as disqualifying", "Caffeine resolves it"],1,"Fatigue degrades judgement before awareness. Subjective alertness is not evidence of fitness.",1,3,"AIM 8-1-1(a)(5) Fitness for Flight - Fatigue; cf. 14 CFR 107.17",""],
["V","UA.V.B.K3","An aircraft reports midfield left downwind for runway 31. Roughly what magnetic heading will it fly on final?",["310", "130", "031"],0,"Runway 31 is a magnetic heading of about <b>310</b>.",1,2,"AIM 2-3-3(b) Runway Markings / Runway Designators",""],
["V","UA.V.F.K2","Who may perform the preflight inspection required by part 107?",["Any crew member", "The remote pilot in command", "A certificated mechanic"],1,"The <b>remote PIC</b> is responsible. It is not delegable to a visual observer or owner.",1,2,"14 CFR 107.15(a)",""],
["III","UA.III.B.K1c","Characteristics of a moist, unstable air mass?",["Turbulence and showery precipitation", "Poor visibility and smooth air", "Haze and smoke"],0,"<b>Unstable: turbulence, showers, cumulus, good visibility.</b> Rising air stirs and clears.",0,1,"FAA Remote Pilot Study Guide FAA-G-8082-22, p.26 (Stability of the Atmosphere table); also PHAK FAA-H-8083-25 p.12-12",""],
["III","UA.III.B.K1c","Characteristics of stable air?",["Good visibility, steady precipitation", "Poor visibility, steady precipitation", "Poor visibility, showery precipitation"],1,"<b>Stable: smooth, steady drizzle, stratus, poor visibility.</b> Nothing rises, so haze stays trapped.",0,2,"FAA Remote Pilot Study Guide FAA-G-8082-22, p.26 (Stability of the Atmosphere table)",""],
["III","UA.III.B.K1c","A low-level temperature inversion with high humidity produces what?",["Smooth air, poor visibility, fog and haze", "Turbulence and good visibility", "Thunderstorms"],0,"<b>Smooth but murky.</b> Warm over cold is the most stable arrangement possible.",0,2,"PHAK FAA-H-8083-25, Chapter 12 Weather Theory, p.12-13 (Temperature Inversion)",""],
["III","UA.III.B.K1a","Effect of high density altitude on propeller efficiency?",["Increased", "Decreased", "No effect"],1,"<b>Decreased.</b> Thin air gives the propeller less to work against.",0,1,"PHAK FAA-H-8083-25, Chapter 11 Aircraft Performance, p.11-2",""],
["III","UA.III.B.K1a","High density altitude results from what?",["High temperature, high altitude, high humidity", "Low temperature, low altitude, low humidity", "High pressure and cool air"],0,"<b>Hot, high, humid.</b>",0,1,"PHAK FAA-H-8083-25, Chapter 11 Aircraft Performance, p.11-5; identical wording in Remote Pilot Study Guide FAA-G-8082-22 p.21-22",""],
["III","UA.III.A.K2","METAR wind direction is referenced to what?",["Magnetic north", "True north", "The active runway"],1,"<b>True north</b> in written reports. Winds given verbally by tower or ATIS are <b>magnetic</b>.",0,3,"PHAK FAA-H-8083-25, Chapter 13 Aviation Weather Services, p.13-6 (METAR wind group)",""],
["III","UA.III.A.K2","A METAR reports OVC007. What does this mean?",["Overcast at 700 ft", "Overcast at 7,000 ft", "Overcast at 70 ft"],0,"<b>700 feet.</b> Cloud heights are in hundreds of feet above the station.",0,2,"PHAK FAA-H-8083-25, Chapter 13 Aviation Weather Services, p.13-7 (Sky condition group); same wording in Remote Pilot Study Guide p.17",""],
["III","UA.III.A.K2","Which coverage codes constitute a ceiling?",["FEW or SCT", "BKN or OVC", "CLR only"],1,"<b>Broken or overcast.</b> A ceiling is the lowest BKN or OVC layer.",0,2,"PHAK FAA-H-8083-25, Chapter 12 Weather Theory, p.12-17 (Ceiling)",""],
["III","UA.III.B.K1i","Temperature 18 C, dewpoint 17 C. What does this suggest?",["Fog or low cloud likely", "Clear and dry", "Thunderstorms"],0,"<b>Fog is likely.</b> A narrow spread means near saturation.",0,2,"FAA Remote Pilot Study Guide FAA-G-8082-22, p.25 (Moisture/Dew Point); PHAK p.12-14",""],
["III","UA.III.B.K1e","Which thunderstorm stage features predominantly downdrafts?",["Cumulus", "Mature", "Dissipating"],2,"<b>Dissipating.</b> Cumulus is updrafts, mature has both.",0,3,"FAA Remote Pilot Study Guide FAA-G-8082-22, p.28 (Thunderstorm life cycle); AC 00-24C para 4",""],
["III","UA.III.B.K1e","What is a microburst?",["A brief intense downdraft producing severe wind shear", "A small thunderstorm", "A radio interference event"],0,"<b>An intense localized downdraft.</b> FAA figures: horizontal diameter 1 to 2 miles, depth about 1,000 ft, lifespan about 5 to 15 minutes, downdrafts up to 6,000 fpm, and headwind losses of 30 to 90 knots.",0,2,"FAA Remote Pilot Study Guide FAA-G-8082-22, p.24 (Microbursts)",""],
["III","UA.III.A.K3","What is a TAF?",["A forecast for the area around an airport", "A current observation", "A chart supplement"],0,"<b>Forecast.</b> A METAR is the observation; a TAF is the prediction, typically covering a 5 statute mile radius.",0,2,"PHAK FAA-H-8083-25, Chapter 13 Aviation Weather Services, p.13-9 (Terminal Aerodrome Forecasts)",""],
["III","UA.III.A.K5","What are ASOS and AWOS?",["Automated surface weather observing systems", "Airspace classification systems", "Air traffic services"],0,"<b>Automated observing systems</b> broadcasting current conditions continuously.",0,1,"PHAK FAA-H-8083-25, Chapter 13 Aviation Weather Services, p.13-2; Remote Pilot Study Guide p.15",""],
