     {t:"Nothing. Density altitude only matters to airplanes at mountain airports.",o:"bad",r:"Any wing or rotor lifts by moving air mass. Less mass means less lift at the same speed, whatever the aircraft. 1,200 ft at 36°C is already a performance penalty."},
     {t:"Performance improves because warm air is lighter and easier to push through.",o:"bad",r:"Lighter air is the problem. The aircraft has less to push against."}]},
 w4:{ph:"storm",type:"metar",label:"TAF",tok:[["TAF KHLE","Terminal aerodrome forecast, simulated"],["111720Z","Issued 17:20 UTC (12:20 local)"],["1118/1218","Valid from 18Z on the 11th to 18Z on the 12th"],["24008KT","Wind 240° at 8 kt"],["P6SM","Visibility more than 6 statute miles"],["SCT040","Scattered at 4,000 ft AGL"],["TEMPO 1120/1123","Temporarily, between 20Z and 23Z (15:00 to 18:00 local):"],["4SM TSRA BKN030CB","4 SM in thunderstorms and rain, broken at 3,000 with cumulonimbus"],["FM120000","From 00Z on the 12th (19:00 local):"],["27012KT P6SM SKC","Wind 270° at 12 kt, more than 6 SM, sky clear"]],
  q:"13:30. You read the afternoon forecast. The survey needs 35 minutes of flight plus a battery swap, about 45 minutes in all. Decide.",rule:"107.49",
  c:[{t:"Launch now and plan to be down by 14:30, half an hour before the TEMPO window opens at 15:00. If towering cumulus builds early, land immediately.",o:"good",r:"The forecast gives a usable window before 20Z, which is 15:00 local: 13:30 plus 45 minutes is 14:15, with margin to spare. TEMPO means the condition is expected for less than half the period but can start early; cumulus towers are your visual warning. Plan the swap so both flights finish before the window."},
     {t:"Launch at 14:30 after lunch. TEMPO means it probably will not happen.",o:"bad",r:"TEMPO means temporary fluctuations expected to last less than an hour at a time, not unlikely. Launching into the forecast window with thunderstorms is a preflight assessment failure under § 107.49."},
     {t:"Cancel. Any forecast with TS in it is an automatic no-go for the whole day.",o:"meh",r:"Safe, but it throws away a 90 minute window before 15:00 and the clear evening the forecast gives from 19:00 local. Reading the TAF properly is the skill; the forecast tells you when, not just whether."}]},
 w5:{ph:"storm",type:"choice",q:"14:00, second battery in. To the southwest a cumulus tower has gone dark at the base and you see the first rain shaft reach the ground. Which stage is that storm in, and what does it mean for you?",rule:"PHAK 12 p22",
  c:[{t:"Mature stage. Precipitation reaching the ground marks it, and the gust front, downdrafts and worst turbulence arrive with it. Land now.",o:"good",r:"Cumulus stage is updrafts only. The mature stage begins when precipitation reaches the surface and brings downdrafts, gust fronts that can run 15 miles ahead, and the strongest turbulence. Dissipating is downdrafts throughout."},
     {t:"Cumulus stage, so there is time to finish the second flight.",o:"bad",r:"Rain reaching the ground is the definition of the mature stage. The gust front may already be moving toward you."},
     {t:"Dissipating stage; the worst is over.",o:"bad",r:"Dissipating is the end, dominated by downdrafts after the rain has fallen. A storm with rain just starting to fall is at its most dangerous."}]},
 w6:{ph:"storm",type:"timed",secs:15,q:"The wind at your position jumps from 8 to 25 kt in a few seconds and shifts 90 degrees. The aircraft is 1,500 ft away at 300 ft AGL with 60 percent battery. Act.",rule:"107.19",
  c:[{t:"Command an immediate return and land at the nearest safe spot, into the wind, even if it is not the launch point.",o:"good",r:"That is the gust front. Wind shear near the ground is the hazard that kills light aircraft. Get it on the ground now, anywhere safe; the launch point is a preference, not a rule. § 107.19 puts the decision and the responsibility on you."},
     {t:"Hold position and wait for the gust to pass.",o:"bad",r:"A gust front is not a gust. It is the leading edge of the storm's outflow and the wind behind it gets worse, with rain and possibly hail following."},
     {t:"Climb to 400 ft to get above the turbulence.",o:"bad",r:"Turbulence from a gust front extends well above 400 ft, and climbing moves you into the storm's inflow and away from the ground you need to reach."}],freeze:1},
 w7:{ph:"storm",type:"choice",q:"Down safely. Lightning is now within a few miles. The client asks you to relaunch as soon as the rain stops, because the sky behind looks clear.",rule:"PHAK 12 p25",
  c:[{t:"Wait until the storm has moved well past and lightning is no longer within range. Clear sky behind a storm often means the gust front and downdrafts have just passed through, not that they are finished.",o:"good",r:"The dissipating stage still produces downdrafts, and a second cell can follow the first. Lightning risk alone keeps you and your crew under cover. The forecast's clear evening is your window."},
     {t:"Relaunch the moment the rain stops.",o:"bad",r:"Rain stopping does not end the storm. Downdrafts, outflow winds and lightning continue in the dissipating stage."},
     {t:"Relaunch but stay below 100 ft to be safe.",o:"bad",r:"Altitude does not protect you from gust fronts or lightning. Low is where the shear is worst."}]}
 }},
m3:{t:"Night Operation",art:"night",max:160,phases:[["brief","Brief"],["rules","Rules"],["equip","Equipment"],["flight","Flight"],["debrief","Debrief"]],start:"n1",
 brief:{title:"Holiday lights, Riverton town square",rows:[["Client","Town of Riverton"],["Deliverable","Aerial video of the lights display, 17:50 to 21:00 local"],["Sunset","17:45. Civil twilight ends 18:15."],["Aircraft","2.0 lb quad, anti-collision strobe rated for 2 miles, Standard Remote ID"],["Crew","You, certificated March 2024, recurrent training current; one visual observer"]],
  note:"Riverton and its times are invented. § 107.29 and the night vision facts are real."},
 nodes:{
 n1:{ph:"rules",type:"choice",q:"Can you fly this job at night under part 107 at all?",rule:"107.29",
  c:[{t:"Yes. Since 2021, with anti-collision lighting visible for 3 statute miles and a flash rate sufficient to avoid a collision, and a remote PIC whose initial test or recurrent training was completed after 6 April 2021.",o:"good",r:"§ 107.29(a) sets both conditions: the pilot's training currency after the 2021 rule, and lighted anti-collision lighting visible for at least 3 statute miles with a flash rate sufficient to avoid a collision."},
     {t:"Only with a § 107.29 daylight operations waiver.",o:"bad",r:"That was the rule until April 2021. Night flight now needs lighting and current training, not a waiver. Waivers granted before 17 May 2021 expired."},
     {t:"No. Part 107 is a daylight rule.",o:"bad",r:"It was. Amendment 107-8 changed it in 2021."}]},
 n2:{ph:"rules",type:"choice",q:"The client wants to start at 17:50, five minutes after sunset. What rule applies between sunset and 18:15?",rule:"107.29",
  c:[{t:"Civil twilight. § 107.29(b) requires the same anti-collision lighting visible for 3 SM, even though it is not yet night.",o:"good",r:"Civil twilight outside Alaska is 30 minutes before sunrise to sunrise, and sunset to 30 minutes after. During it, the aircraft must carry the 3 SM anti-collision lighting."},
     {t:"Nothing special. Daylight rules run until 30 minutes after sunset.",o:"bad",r:"Civil twilight has its own requirement in § 107.29(b): lighting visible for 3 SM."},
     {t:"Civil twilight requires a visual observer.",o:"bad",r:"A visual observer is optional under § 107.33 at any time. Lighting is the twilight requirement."}]},
 n3:{ph:"equip",type:"checklist",q:"Tick everything § 107.29 and § 107.31 require for this night flight, and nothing they do not.",rule:"107.29",
  items:[{k:"light3",t:"Anti-collision light visible for at least 3 statute miles",req:1,r:"§ 107.29(a)(2)"},{k:"flash",t:"Flash rate sufficient to avoid a collision",req:1,r:"§ 107.29(a)(2)"},{k:"train",t:"Remote PIC's initial test or recurrent training completed after 6 April 2021",req:1,r:"§ 107.29(a)(1)"},{k:"vlos",t:"Ability to see the aircraft well enough to know its location, attitude, altitude and direction, with the lights on",req:1,r:"§ 107.31(a)"},{k:"noreduce",t:"Do not reduce the light's intensity unless safety requires it",req:1,r:"§ 107.29(a)(2)"},{k:"waiver",t:"A night operations waiver from the FAA",req:0,r:"Not required since April 2021."},{k:"nav",t:"Red and green navigation lights on the wingtips",req:0,r:"Not a part 107 requirement. Anti-collision lighting is the rule; navigation lights are optional."},{k:"vo",t:"A visual observer with night vision goggles",req:0,r:"Not required. A VO is optional under § 107.33, and goggles are not mentioned anywhere."}]},
 n4:{ph:"equip",type:"choice",q:"Preflight shows the fitted strobe is rated for 2 miles. The town is waiting with a crowd. Decide.",rule:"107.29",
  c:[{t:"No flight until a 3 SM anti-collision light is fitted. Borrow one, buy one, or reschedule.",o:"good",r:"§ 107.29 says 3 statute miles. Two miles is a violation on the first minute after sunset, and the remote PIC may not reduce the intensity of a compliant light except in the interest of safety."},
     {t:"Fly. At 2 miles nobody can tell the difference.",o:"bad",r:"The rule is specific and so are spec sheets. Three miles.",next:"n4x"},
     {t:"Fly, but only during civil twilight, then land at 18:15.",o:"bad",r:"Civil twilight has the same 3 SM lighting requirement under § 107.29(b).",next:"n4x"}]},
 n4x:{ph:"equip",type:"choice",branch:1,shares:"n4",next:"n5",q:"You launched with the 2 mile strobe. Ten minutes in, a deputy walks over: a resident called about a drone over the square with a light you can barely see. Decide.",rule:"107.29",
  c:[{t:"Land now, tell the deputy the light does not meet § 107.29, and relaunch only once a 3 SM anti-collision light is fitted.",o:"good",r:"Stopping the violation comes first. The deputy may ask for your certificate under § 107.7; a compliant light, not a lower altitude, is what makes the flight legal again."},
     {t:"Keep flying. The light is on, so the rule is met.",o:"bad",r:"§ 107.29 does not ask for a light, it asks for one visible for 3 statute miles. A 2 mile strobe fails it every second it is airborne."},
     {t:"Switch the strobe off so the complaints stop.",o:"bad",r:"No anti-collision light at all during civil twilight or night is a plainer § 107.29 violation, and the remote PIC may reduce intensity only in the interest of safety."}]},
 n5:{ph:"flight",type:"choice",q:"Compliant light fitted. It is fully dark and your eyes have adjusted. A floodlight on the square snaps on next to you. What is the vision problem?",rule:"AFH 11 p1",
  c:[{t:"Dark adaptation takes about 30 minutes and a bright light undoes it in seconds. Avoid looking at bright lights, use dim red light at the control station, and look slightly to the side of the aircraft to use the rods.",o:"good",r:"The rods take roughly 30 minutes to adapt fully and lose it almost instantly. They sit outside the fovea, so off-centre viewing shows a dim aircraft better than staring straight at it."},
     {t:"Nothing. The camera feed is what matters at night.",o:"bad",r:"VLOS applies at night, § 107.31. Your eyes are the instrument and the exam tests how they work in the dark."},
     {t:"Stare directly at the aircraft to keep it in focus.",o:"bad",r:"Direct vision uses the cones, which are poor in the dark. Off-centre viewing uses the rods."}]},
 n6:{ph:"flight",type:"timed",secs:15,q:"20:40. The aircraft is 1,800 ft out. You can see its strobe but not which way it is pointing. Act.",rule:"107.31",
  c:[{t:"Bring it back now until you can see its attitude and direction, not just a light.",o:"good",r:"§ 107.31 requires seeing the aircraft well enough to know its location, attitude, altitude and direction of flight and to watch the airspace around it. A dot of light fails that test even though you can see it."},
     {t:"Hold position. Seeing the strobe is line of sight.",o:"bad",r:"Seeing a light is not seeing the aircraft well enough to judge attitude and direction. § 107.31(a) lists what you must be able to determine."},
     {t:"Use the camera feed to orient it and continue.",o:"bad",r:"A camera feed is not visual line of sight. First person view is permitted only with a visual observer who keeps unaided VLOS."}],freeze:1},
 n7:{ph:"flight",type:"choice",q:"Low over the trees to the east you see a steady red light on your left and a green light on your right, with a white light between them, slowly drifting. What is it doing?",rule:"AFH 11 p6",
  c:[{t:"A manned aircraft flying away from you. Its red left-wing light is on your left, so you are seeing its tail. Watch it, but it is not a conflict yet.",o:"good",r:"Aircraft carry red on the left wingtip, green on the right, white at the tail. If red appears on your left and green on your right, you are behind it. Red on your right and green on your left means it is coming toward you."},
     {t:"A manned aircraft heading straight at you. Descend immediately.",o:"meh",r:"Descending clear of any manned aircraft is never wrong under § 107.37, but the lights say it is moving away. Red on your right and green on your left would be the head-on picture."},
     {t:"A police drone. Ignore it.",o:"bad",r:"Never assume. Steady red, green and white in that arrangement is the standard manned-aircraft lighting pattern."}]},
 n8:{ph:"flight",type:"choice",q:"21:05, packing up. A police officer asks what you are doing and whether you are allowed. What do you do?",rule:"107.7",
  c:[{t:"Show your remote pilot certificate and identification, and the aircraft registration, and explain the operation.",o:"good",r:"§ 107.7 requires the remote PIC to present the remote pilot certificate and identification on request to the FAA, NTSB, TSA or any federal, state or local law enforcement officer, and to make the aircraft and records available."},
     {t:"Decline. Only the FAA can ask for your certificate.",o:"bad",r:"§ 107.7 names law enforcement officers specifically. Refusing is itself a violation."},
     {t:"Show only your driver's licence.",o:"bad",r:"Identification plus the remote pilot certificate. The certificate is the point."}]}
 }},
m4:{t:"Over People and Remote ID",art:"people",max:140,phases:[["brief","Brief"],["category","Category"],["crowd","Crowd"],["rid","Remote ID"],["debrief","Debrief"]],start:"p1",
 brief:{title:"Charity 10K, downtown course",rows:[["Client","Riverton Children's Hospital Foundation"],["Deliverable","Live aerial video of 3,000 runners on a closed course, plus the start line"],["Aircraft options","A: 0.52 lb micro quad, no exposed blades that could lacerate, Standard Remote ID. B: 2.4 lb quad, manufacturer says Category 2."],["Airspace","Class G"],["Window","08:00 start, 10:30 finish"]],
  note:"The event is invented. Subpart D (§§ 107.100 to 107.145), § 107.39 and part 89 are real."},
 nodes:{
 p1:{ph:"category",type:"choice",q:"What does part 107 say about flying over the runners at all?",rule:"107.39",
  c:[{t:"Not unless the aircraft qualifies under Category 1, 2, 3 or 4 in Subpart D, or the people are directly participating, under a covered structure, or inside a stationary vehicle.",o:"good",r:"§ 107.39 bans operation over a human being except those four cases. Spectators and runners are not participants in your operation."},
     {t:"Fine above 100 ft; the rule only covers low flight.",o:"bad",r:"There is no altitude that makes flight over people legal on its own."},
     {t:"Fine, because the runners signed the race waiver.",o:"bad",r:"A race waiver does not make runners direct participants in a drone operation. Only crew and people necessary to the operation count."}]},
 p2:{ph:"category",type:"choice",q:"You bring aircraft A, 0.52 lb with no exposed parts that could lacerate skin. The start line is a dense crowd. Which category, and what is the catch?",rule:"107.110",
  c:[{t:"Category 1. But sustained flight over an open-air assembly requires Remote ID, which this aircraft has.",o:"good",r:"§ 107.110: 0.55 lb or less on takeoff including everything attached, no exposed rotating parts that would lacerate skin, no safety defects, and for sustained flight over open-air assemblies the aircraft must meet § 89.110 or § 89.115(a). No Declaration of Compliance for Category 1."},
     {t:"Category 2, because it is under 11 ft-lb of kinetic energy.",o:"bad",r:"Category 2 is defined by the 11 ft-lb test and needs a Declaration of Compliance and a label. A 0.52 lb aircraft is Category 1 and needs neither."},
     {t:"Category 1, with nothing else required.",o:"meh",r:"Right category, but the start line is an open-air assembly and § 107.110 conditions sustained flight over it on Remote ID."}]},
 p3:{ph:"category",type:"checklist",q:"The organisers prefer aircraft B, the 2.4 lb quad the maker calls Category 2. Tick what must be true before you fly it over the runners, and nothing that need not be.",rule:"107.120",
  items:[{k:"doc",t:"An FAA-accepted Declaration of Compliance covers this make and model",req:1,r:"§ 107.115(a)(2), § 107.160"},{k:"label",t:"The aircraft displays a label indicating Category 2 eligibility",req:1,r:"§ 107.120(b)(1)"},{k:"ke",t:"It will not cause injury above 11 foot-pounds of kinetic energy on impact",req:1,r:"§ 107.120(a)(1)"},{k:"parts",t:"No exposed rotating parts that would lacerate skin",req:1,r:"§ 107.120(a)(2)"},{k:"defect",t:"No safety defects",req:1,r:"§ 107.120(a)(3)"},{k:"rid",t:"Standard Remote ID or a broadcast module, for sustained flight over the open-air assembly",req:1,r:"§ 107.115(b)"},{k:"instr",t:"The manufacturer's remote pilot operating instructions are available and followed",req:1,r:"§ 107.120(b)(2), § 107.115"},{k:"aw",t:"An airworthiness certificate issued under part 21",req:0,r:"That is Category 4, § 107.140. Not Category 2."},{k:"waiver",t:"A § 107.39 waiver",req:0,r:"Category eligibility is the alternative to a waiver, not an addition to it."},{k:"wt",t:"Weight of 0.55 lb or less",req:0,r:"That is the Category 1 test. Category 2 is defined by kinetic energy, not weight."}]},
 p4:{ph:"crowd",type:"choice",q:"Mid-race, the lead runners pass a stretch where cars are still moving on a parallel open road. Can you follow them over the cars?",rule:"107.145",
  c:[{t:"Transit only. Sustained flight over moving vehicles is allowed only inside a closed or restricted-access site where everyone has been notified. An open road is not that.",o:"good",r:"§ 107.145: Category 1, 2 or 3 operations over moving vehicles must either stay within a closed or restricted-access site with occupants on notice, or must not maintain sustained flight over the vehicles. Crossing is transit; hovering and following is sustained."},
     {t:"Yes. The category covers people and people are inside the cars.",o:"bad",r:"Moving vehicles have their own section. Category eligibility alone does not permit sustained flight over them on an open road."},
     {t:"Yes, above 200 ft.",o:"bad",r:"No altitude exemption exists in § 107.145."}]},
 p5:{ph:"rid",type:"choice",q:"A spectator asks what the drone is 'broadcasting about her'. What does Standard Remote ID actually send?",rule:"89.305",
  c:[{t:"The aircraft's serial number or session ID, its position, altitude and velocity, the control station's position and altitude, a time mark, and emergency status. Nothing about anyone on the ground.",o:"good",r:"§ 89.305 lists the message elements for standard Remote ID. A broadcast module under § 89.315 sends the takeoff location instead of the control station position and requires VLOS."},
     {t:"Live video to the FAA.",o:"bad",r:"Remote ID is a local broadcast of identity and position, not video and not a stream to the FAA."},
     {t:"The pilot's name and address.",o:"bad",r:"The broadcast carries the serial number or session ID. Linking it to a person is a records matter, not part of the broadcast."}]},
 p6:{ph:"rid",type:"timed",secs:15,q:"Hovering over the finish-line crowd with aircraft A, the controller flashes: Remote ID broadcast failed. Act.",rule:"89.110",
  c:[{t:"Move off the crowd and land as soon as practicable. Without a working broadcast the aircraft no longer meets the condition for sustained flight over the assembly.",o:"good",r:"§ 89.110(a)(2): if the standard Remote ID equipment fails to broadcast, the person operating must land as soon as practicable. And § 107.110 ties sustained flight over the open-air assembly to a working Remote ID."},
     {t:"Keep filming. The crowd cannot tell.",o:"bad",r:"The rule does not depend on who notices. The condition for being over the crowd has lapsed and § 89.110 requires landing.",next:"p6x"},
     {t:"Climb to 400 ft so the signal carries further.",o:"bad",r:"A failed broadcast is not a range problem, and climbing keeps you over the crowd longer.",next:"p6x"}],freeze:1},
 p6x:{ph:"rid",type:"choice",branch:1,shares:"p6",next:"p7",q:"Ground stop. A race marshal radios: an FAA inspector at the finish line sees no Remote ID on a spectator's app and wants the aircraft on the ground now. Act.",rule:"89.110",
  c:[{t:"Land at once away from the crowd, show your certificate and registration, explain the broadcast failure, and do not relaunch until the Remote ID equipment works.",o:"good",r:"§ 89.110 requires landing as soon as practicable when standard Remote ID stops broadcasting, and § 107.7 requires you to show your certificate and records on request. Fix first, fly second."},
     {t:"Finish the last few minutes of the race first.",o:"bad",r:"The condition for sustained flight over the assembly lapsed when the broadcast failed. Every minute over the crowd without Remote ID is the violation."},
     {t:"Swap to aircraft B and keep filming over the runners.",o:"bad",r:"Changing aircraft does not answer the inspector, and aircraft B over the crowd needs every Category 2 condition met first, Remote ID included, § 107.115 and § 107.120."}]},
 p7:{ph:"rid",type:"choice",q:"The foundation asks for a second event next month: a night 5K. Same aircraft A. What extra applies to flying over the runners at night?",rule:"107.29",
  c:[{t:"The category rules still apply, plus § 107.29: anti-collision lighting visible for 3 SM, and the lighting must not change the aircraft's category eligibility.",o:"good",r:"Operations over people at night combine Subpart D with § 107.29. For Category 1 the light counts toward the 0.55 lb limit and must not add a laceration hazard; for Category 2 and 3 the Declaration of Compliance must still describe the configuration you fly."},
     {t:"Night flight over people is prohibited.",o:"bad",r:"Nothing in Subpart D or § 107.29 prohibits it. Both sets of conditions apply together."},
     {t:"Nothing extra; the category covers all conditions.",o:"bad",r:"§ 107.29's lighting requirement is separate and applies at night regardless of category."}]}
 }},
m5:{t:"Emergency and Reporting",art:"accident",max:160,phases:[["brief","Brief"],["event","Event"],["after","Aftermath"],["paper","Paperwork"],["debrief","Debrief"]],start:"e1",
 brief:{title:"Roof survey gone wrong, Riverton industrial park",rows:[["Client","Ridgeline Roofing"],["Aircraft","2.1 lb quad, Standard Remote ID, GPS return-to-home"],["Airspace","Class G"],["Crew","You and a visual observer. Your certificate was issued 25 months ago."],["Weather","Fine. Wind 12 kt from the west."]],
  note:"The incident is invented. § 107.9, § 107.21, § 107.27, § 107.7 and § 107.65 are real."},
 nodes:{
 e1:{ph:"event",type:"timed",secs:15,q:"At 250 ft the controller shows GPS lost. The aircraft starts drifting east with the wind toward a car park where people are walking. Act.",rule:"107.19",
  c:[{t:"Take manual control in attitude mode and fly it west, away from the people, descending to land in the open yard.",o:"good",r:"Return-to-home needs GPS, which you just lost. Manual flight away from people is the only control you have left. § 107.19(c) requires the remote PIC to ensure the aircraft poses no undue hazard if there is a loss of control; this is that moment."},
     {t:"Trigger return-to-home.",o:"bad",r:"RTH is a GPS function. With no position fix it does nothing useful, and the drift continues toward the people.",next:"e1x"},
     {t:"Cut the motors so it falls in the yard.",o:"bad",r:"At 250 ft, a dead-stick fall lands wherever the wind takes it, which is the car park. Flying it is better than dropping it."}],freeze:1},
 e1x:{ph:"event",type:"choice",branch:1,shares:"e1",next:"e2",q:"Emergency landing. Return-to-home did nothing without a GPS fix. The aircraft is still drifting east at 180 ft and is now over the edge of the car park, where two people are walking to their cars. You have manual control. Act.",rule:"107.19",
  c:[{t:"Fly it manually away from the people and put it down in the nearest open spot, accepting damage to the aircraft, and shout a warning to the people below.",o:"good",r:"An emergency landing away from people is the remaining way to meet § 107.19(c): no undue hazard to people or property if control is lost. The aircraft is replaceable."},
     {t:"Hover and wait for the GPS fix to come back.",o:"bad",r:"Without GPS the aircraft cannot hold position. It keeps drifting over the people while you wait."},
     {t:"Cut the motors now, over the car park.",o:"bad",r:"A dead-stick drop over people and cars is exactly the undue hazard § 107.19 forbids. Fly it clear first."}]},
 e2:{ph:"event",type:"choice",q:"While fighting the drift you climbed to 450 ft to clear a building before regaining control. Trouble?",rule:"107.21",
  c:[{t:"No. In an in-flight emergency requiring immediate action the remote PIC may deviate from any rule of part 107 to the extent necessary. If the FAA asks, I must send a written report of the deviation.",o:"good",r:"§ 107.21(a) and (b). The deviation must be necessary and no more than necessary, and a written report is required upon request."},
     {t:"Yes. 400 ft is absolute and the FAA will cite it.",o:"bad",r:"§ 107.21 exists for exactly this. Necessary deviation in an emergency is lawful."},
     {t:"No, and no report can ever be required.",o:"meh",r:"The deviation is lawful, but § 107.21(b) says a written report must be sent to the Administrator upon request."}]},
 e3:{ph:"after",type:"choice",q:"The aircraft clipped a parked car on the way down and then landed on a bystander's foot. She is bruised and walks it off. The body shop quotes $640 for the dented hood. Report?",rule:"107.9",
  c:[{t:"Yes. Property damage other than the aircraft over $500 to repair is reportable to the FAA within 10 calendar days, whatever the injury outcome.",o:"good",r:"§ 107.9: report no later than 10 calendar days after an operation involving serious injury or loss of consciousness, or damage to property other than the UA unless repair cost does not exceed $500 or fair market value does not exceed $500 in a total loss. $640 exceeds the threshold."},
     {t:"No. Nobody was seriously hurt.",o:"bad",r:"Injury is only one of the two triggers. The $500 property test stands on its own."},
     {t:"Yes, within 24 hours, to the NTSB.",o:"bad",r:"The part 107 report is to the FAA within 10 calendar days. NTSB part 830 is a separate regime with its own thresholds."}]},
 e4:{ph:"after",type:"choice",q:"What would have made the bystander's injury 'serious' under § 107.9?",rule:"107.9",
  c:[{t:"An injury at Level 3 or higher on the Abbreviated Injury Scale, such as a fracture or a laceration needing surgery. Any loss of consciousness also counts on its own.",o:"good",r:"§ 107.9(a) says serious injury or any loss of consciousness. The FAA's advisory circular AC 107-2 defines serious injury using the AIS Level 3 threshold."},
     {t:"Any injury that needs a bandage.",o:"bad",r:"Minor first-aid injuries are AIS Level 1 and not reportable."},
     {t:"Only a fatality.",o:"bad",r:"Death is far above the threshold. AIS Level 3 is the line."}]},
 e5:{ph:"paper",type:"choice",q:"How and when do you file the § 107.9 report?",rule:"107.9",
  c:[{t:"Within 10 calendar days, to the FAA, through the method the FAA accepts, currently the online DroneZone or a Flight Standards office.",o:"good",r:"§ 107.9 says no later than 10 calendar days, in a manner acceptable to the Administrator. The FAA directs reports to DroneZone or the nearest FSDO."},
     {t:"Within 48 hours, by phone to the control tower.",o:"bad",r:"Ten calendar days, to the FAA. A tower is ATC, not the reporting channel."},
     {t:"Only if the bystander files a complaint.",o:"bad",r:"The duty is yours and it is triggered by the event, not by a complaint."}]},
 e6:{ph:"paper",type:"choice",q:"The bystander's friend says she saw you drinking a beer with lunch, an hour before the flight. What is the rule?",rule:"107.27",
  c:[{t:"No acting as remote PIC within 8 hours of consuming alcohol, while under its influence, or with an alcohol concentration of 0.04 or more. One beer an hour before flying is a violation regardless of how you felt.",o:"good",r:"§ 107.27 applies § 91.17 and § 91.19. § 91.17(a): 8 hours bottle to throttle, no operation while impaired, 0.04 by weight or more prohibited. § 61.15 and § 107.57 add certificate consequences for offences and refusals."},
     {t:"One beer is fine if you feel sober.",o:"bad",r:"The 8 hour rule is a clock, not a feeling."},
     {t:"Part 107 has no alcohol rule.",o:"bad",r:"§ 107.27 imports the part 91 rules, and § 107.59 makes refusing a test grounds for certificate action."}]},

function rmStart(id){

}
function rmDef(){return st.rm&&RM[st.rm.id]}
/* main path in order; branch nodes (branch:1) are reached only through a choice's next and rejoin via their own next */
function rmOrder(d){return Object.keys(d.nodes).filter(function(k){return !d.nodes[k].branch})}
function rmMax(d){return d.max||rmOrder(d).length*20}
function rmScored(d){return rmMax(d)/20}
function rmPts(o){return o==="good"?20:o==="meh"?8:0}
var _rmT=null,_rmLive=false; /* false after a reload: a resumed timed node restarts its countdown */

 clearInterval(_rmT);_rmLive=true;
 _rmT=setInterval(function(){
  var r=st.rm;if(!r||r.pick!=null){clearInterval(_rmT);_rmLive=false;return}
  var n=rmDef().nodes[r.node];if(!n||n.type!=="timed"){clearInterval(_rmT);_rmLive=false;return}
  var left=Math.max(0,r.deadline-Date.now()),el=document.getElementById("m1clock"),sx=document.getElementById("m1secs");
  if(el)el.style.width=(left/(n.secs*10))+"%";if(sx)sx.textContent=(left/1000).toFixed(1)+"s";
  if(left<=0){clearInterval(_rmT);_rmLive=false;rmChoose(typeof n.freeze==="number"?n.freeze:1,1)}
 },100);
}
function rmNext(id){
 st.keepScroll=0;
 var r=st.rm,d=rmDef(),n=d.nodes[id];
 r.node=id;r.pick=null;r.tok=null;r.chk={};
 if(n&&n.type==="timed"){r.deadline=Date.now()+n.secs*1000;save();render();rmTimer();return}
 save();render();
}
function rmChoose(ci,auto){
 var r=st.rm,d=rmDef(),n=d.nodes[r.node];if(!n||!n.c||r.pick!=null)return;
 if(n.type==="timed"&&!auto){clearInterval(_rmT);_rmLive=false}
 var c=n.c[ci];r.pick=ci;
 var why=auto?(mTimedPreface(c)+c.r):c.r,pts=rmPts(c.o);
 /* a branch node shares the 20 points of the decision that led to it, so no path can pass the maximum */
 if(n.shares){var prior=0;for(var li=0;li<r.log.length;li++)if(r.log[li].k===n.shares)prior+=r.log[li].p;pts=Math.min(pts,Math.max(0,20-prior))}

 save();render();
}
function rmChecklist(){
 var r=st.rm,n=rmDef().nodes[r.node],hit=0,miss=[],wrong=[],reqN=0;
 for(var i=0;i<n.items.length;i++){var it=n.items[i];if(it.req){reqN++;if(r.chk[it.k])hit++;else miss.push(it.t)}else if(r.chk[it.k])wrong.push(it.t)}
 /* every required item plus extras is "meh", never "incomplete" */
 var o=(hit===reqN&&!wrong.length)?"good":(hit===reqN||(hit>=reqN-2&&wrong.length<=1))?"meh":"bad";
 var why=o==="good"?"Every required item and none of the distractors. That is the regulation in one list.":("You ticked "+hit+" of "+reqN+" required items"+(miss.length?", missing: "+miss.join("; "):"")+(wrong.length?". Not required: "+wrong.join("; "):"")+".");
 r.log.push({k:r.node,l:n.q,o:o,p:rmPts(o),rule:n.rule,why:why,h:mChkHead(o,hit===reqN,wrong.length)});r.score+=rmPts(o);r.pick=0;save();render();
}
function rmAdvance(){
 var r=st.rm,d=rmDef(),order=rmOrder(d),n=d.nodes[r.node],c=n&&n.c?n.c[r.pick]:null;
 var nxt=(c&&c.next)||(n&&n.next)||order[order.indexOf(r.node)+1]||"debrief";
 if(nxt==="debrief"){
  var max=rmMax(d),prev=st.missions[r.id]||{},good=r.log.filter(function(x){return x.o==="good"}).length;
  r.score=mClamp(r.score,max);var passed=r.score>=mPassMark(max);
  st.missions[r.id]={done:(passed||prev.done)?1:0,xp:Math.max(mClamp(prev.xp,max),r.score),best:Math.max(Number(prev.best)||0,good),score:Math.max(mClamp(prev.score,max),r.score),max:max,n:rmScored(d),at:Date.now()};
  st.keepScroll=0;r.node="debrief";save();setTimeout(checkAch,350);render();return;

}
function rmAct(k,v){

 if(k==="begin"){rmNext(rmDef().start);return}

 if(k==="tok"){r.tok=+v;render();return}
 if(k==="chk"){r.chk[v]=r.chk[v]?0:1;render();return}

 if(k==="exit"){st.keepScroll=0;clearInterval(_rmT);st.rm=null;st.mRun=null;save();render();return}

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
function metarGen(){
 var r=Math.random, pick=function(a){return a[Math.floor(r()*a.length)]};
 var st3="K"+pick(["RVT","PNF","OAK","MRC","DLN","WLK"]);
 var day=1+Math.floor(r()*28),hh=Math.floor(r()*24),mm=pick([53,55,56]);
 var calm=r()<0.12,dir=(1+Math.floor(r()*36))*10,spd=calm?0:3+Math.floor(r()*18),gst=(!calm&&r()<0.3)?spd+6+Math.floor(r()*10):0;
 var vis=pick([0.5,1,2,2.5,3,4,5,6,7,10,10,10]);
 var temp=5+Math.floor(r()*28),spread=vis<3?Math.floor(r()*2):(r()<0.5?1+Math.floor(r()*3):4+Math.floor(r()*10)),dew=temp-spread;
 var skyKind=pick(["CLR","FEW","SCT","BKN","OVC","BKN","SCT"]),base=pick([4,6,8,10,12,15,20,25,30,40,50]);
 var wx=vis<=0.5?"FG":(vis<3&&spread<=2?"BR":(vis<=4&&r()<0.4?"HZ":(r()<0.15&&skyKind!=="CLR"?"-RA":"")));
 var alt=2960+Math.floor(r()*90);
 var tok=[];
 tok.push([st3,"Station identifier. Simulated."]);
 tok.push([("0"+day).slice(-2)+("0"+hh).slice(-2)+mm+"Z","Day "+day+" of the month, "+("0"+hh).slice(-2)+":"+mm+" UTC. Z is Zulu."]);
 var wt=calm?"00000KT":("00"+dir).slice(-3)+("0"+spd).slice(-2)+(gst?"G"+("0"+gst).slice(-2):"")+"KT";
 tok.push([wt,calm?"Wind calm.":"Wind from "+("00"+dir).slice(-3)+"° true at "+spd+" kt"+(gst?", gusting "+gst+" kt":"")+". METAR wind is true north and the direction it blows FROM."]);
 var vs=vis<1?(vis===0.5?"1/2SM":"3/4SM"):(vis%1?Math.floor(vis)+" 1/2SM":vis+"SM");
 tok.push([vs,"Visibility "+vs.replace("SM"," statute miles")+". § 107.51(c) requires at least 3."]);
 if(wx)tok.push([wx,{FG:"Fog: visibility below 5/8 SM.",BR:"Mist: visibility 5/8 SM or more, but reduced.",HZ:"Haze.","-RA":"Light rain."}[wx]]);
 var sky=skyKind==="CLR"?"CLR":skyKind+("00"+base).slice(-3);
 var cap=Math.max(0,base*100-500),capTxt=cap>0?"Staying 500 ft below it caps you at "+cap+" ft AGL.":"500 ft below it is below the ground, so there is no usable altitude.";
 tok.push([sky,skyKind==="CLR"?"Sky clear. No ceiling.":skyKind+" at "+(base*100)+" ft AGL. "+(skyKind==="BKN"||skyKind==="OVC"?"Broken or overcast is a ceiling. "+capTxt:"Few or scattered is not a ceiling, but § 107.51(d) applies to every cloud: 500 ft below, 2,000 ft horizontal. "+capTxt)]);
 tok.push([("0"+temp).slice(-2)+"/"+("0"+dew).slice(-2),"Temperature "+temp+"°C, dew point "+dew+"°C. Spread "+spread+"°C"+(spread<=2?": saturated air, fog or low cloud likely.":".")]);
 tok.push(["A"+alt,"Altimeter "+(alt/100).toFixed(2)+" inHg. Standard is 29.92."]);
 var ceiling=(skyKind==="BKN"||skyKind==="OVC")?base*100:null;
 var cbase=skyKind==="CLR"?null:base*100; /* § 107.51(d) applies to any layer, ceiling or not */
 var legal=vis>=3&&(cbase===null||cbase-500>0);
 return {tok:tok,raw:tok.map(function(t){return t[0]}).join(" "),vis:vis,ceiling:ceiling,base:skyKind==="CLR"?null:base*100,skyKind:skyKind,dir:dir,spd:spd,gst:gst,calm:calm,legal:legal,spread:spread};
}
function metarQ(m,type){
 var q,opts,ans,why;
 if(type===0){q="Can you launch right now under § 107.51, planning to work up to 400 ft AGL?";
  /* § 107.51(d): 500 ft below ANY cloud, so the lowest reported layer caps you whether or not it is a ceiling */
  var room=m.base?Math.max(0,m.base-500):null;
  opts=["Yes. Visibility and cloud clearance both allow it.","No. Visibility is below 3 SM.","No. The cloud rule leaves no usable altitude.","Yes, but only up to "+(room!==null&&room>0&&room<400?room:(m.base&&m.base<900?Math.max(100,m.base-500):300))+" ft AGL."];
  if(m.vis<3)ans=1;else if(room!==null&&room<=0)ans=2;else if(room!==null&&room<400)ans=3;else ans=0;
  why=(m.vis<3?"Visibility "+m.vis+" SM fails the 3 SM minimum in § 107.51(c). ":"Visibility "+m.vis+" SM meets § 107.51(c). ")+(m.base?("The lowest cloud is "+m.skyKind+" at "+m.base+" ft AGL"+(m.ceiling?", a ceiling":", not a ceiling but still cloud")+". § 107.51(d) requires 500 ft below any cloud, so "+(room<=0?"there is no usable altitude.":room<400?"you are capped at "+room+" ft AGL.":"500 ft below it is "+room+" ft and the full 400 ft is available.")):"Sky clear, so there is no cloud to stay 500 ft under.");}
 else if(type===1){q="What is the ceiling?";
  opts=["No ceiling",(m.base||1200)+" ft AGL",(m.base||1200)+" ft MSL",(m.base?m.base+500:700)+" ft AGL"];
  ans=m.ceiling?1:0;
  why=m.ceiling?"A ceiling is the lowest broken or overcast layer. "+m.skyKind+" at "+m.ceiling+" ft, and cloud heights in a METAR are AGL.":(m.base?"FEW and SCT layers are not ceilings. There is cloud at "+m.base+" ft AGL, but the ceiling is reported as none.":"CLR: no cloud, no ceiling.");}
 else if(type===2){q="What is the wind doing?";
  if(m.calm){opts=["Calm","From 000° at 0 kt, so from the north","Variable at 5 kt","Unknown"];ans=0;why="00000KT is calm.";}
  else{opts=["From "+("00"+m.dir).slice(-3)+"° true at "+m.spd+" kt"+(m.gst?", gusts "+m.gst:""),"Toward "+("00"+m.dir).slice(-3)+"° at "+m.spd+" kt","From "+("00"+m.dir).slice(-3)+"° magnetic at "+m.spd+" mph","From "+("00"+((m.dir+180)%360)).slice(-3)+"° at "+m.spd+" kt"];ans=0;
   why="Three digits are the direction the wind blows from, in degrees true, then speed in knots. G marks gusts. Runway numbers are magnetic, which is why a METAR wind and a runway heading do not line up exactly.";}}
 else {q="What is the visibility?";
  var v=m.vis;opts=[v+" statute mile"+(v===1?"":"s"),v+" nautical mile"+(v===1?"":"s"),(v*1000)+" ft",v+" km"];ans=0;why="SM is statute miles. Aviation visibility in the US is reported in statute miles, not nautical.";}
 return {q:q,opts:opts,ans:ans,why:why};
}

 else if(air==="D-yes")f.push({k:"air",l:"Airspace",v:"Class D, LAANC authorization approved to 400 ft",ok:true,r:"Class D with authorization in hand. § 107.41 satisfied."});

 else f.push({k:"air",l:"Airspace",v:"Inside a dashed magenta line (Class E surface area), nothing requested",ok:"fix",r:"Class E surface areas need authorization exactly like Class D, § 107.41. Request it first."});

 o=cleanBackup(o);
 /* merge logs by timestamp so importing on a second device does not lose either side */
 var seen={};for(var i=0;i<st.log.length;i++)seen[st.log[i].at+"|"+st.log[i].c]=1;

 st.log.sort(function(a,b){return a.at-b.at});
 _keys(o.srs).forEach(function(k){if(!_own(st.srs,k)||(o.srs[k].due||0)>(st.srs[k].due||0))st.srs[k]=o.srs[k]});

 for(i=0;i<o.misconceptions.length;i++)if(st.misconceptions.indexOf(o.misconceptions[i])<0)st.misconceptions.push(o.misconceptions[i]);

 for(i=0;i<o.bookmarks.length;i++)if(st.bookmarks.indexOf(o.bookmarks[i])<0)st.bookmarks.push(o.bookmarks[i]);

 _keys(o.missions).forEach(function(k){if(!_own(st.missions,k)||(o.missions[k].score||0)>(st.missions[k].score||0))st.missions[k]=o.missions[k]});
 _keys(o.daily).forEach(function(k){if(!_own(st.daily,k)||st.daily[k]==null)st.daily[k]=o.daily[k]});
