["I","UA.I.B.K1","According to 14 CFR part 48, when would a small UA owner not be permitted to register it?",["If the owner is less than 13 years of age.", "All persons must register their small UA.", "If the owner does not have a valid United States driver's license."],0,"14 CFR 48.25 sets a minimum age of 13 for the registrant: if the owner is under 13, the aircraft must be registered by someone who is at least 13. The minor still owns the drone, they simply cannot be the one to file the registration. Choice C invents a requirement — part 48 asks for U.S. citizenship or permanent residency, not a driver's license, and no aviation registration has ever keyed off a driver's license. Choice B misreads the question, which asks who is barred from registering, not who must register.",2,3,"14 CFR 48.25 (eCFR).",""],
["I","UA.I.B.K1","According to 14 CFR part 48, when must a person register a small UA with the Federal Aviation Administration?",["All civilian small UAs weighing greater than .55 pounds must be registered regardless of its intended use.", "When the small UA is used for any purpose other than as a model aircraft.", "Only when the operator will be paid for commercial services."],0,"14 CFR 48.15 requires registration unless the aircraft meets a narrow exemption, and that exemption is a two-part AND test: the aircraft must weigh 0.55 pounds or less on takeoff AND be operated exclusively under the 49 U.S.C. 44809 recreational-flyer exception. Above 0.55 pounds no exemption exists at any weight, for any purpose, which is exactly what choice A says. Here is the trap students fall into: the 0.55-pound cutoff is NOT a universal free pass — a sub-0.55-pound drone flown under part 107 fails the second half of the AND test and must still be registered, so weight alone never settles it. Choices B and C both make registration hinge on purpose or payment, but part 48 keys on weight plus the operating rule, and a heavy model aircraft flown purely for fun registers just the same.",2,3,"14 CFR 48.15 (eCFR) — exemption requires ≤0.55 lb AND exclusive operation under 49 U.S.C. 44809; 14 CFR 107.13.",""],
["V","UA.V.E.K2","Which is true regarding the presence of alcohol within the human body?",["A small amount of alcohol increases vision acuity.", "Consuming an equal amount of water will increase the destruction of alcohol and alleviate a hangover.", "Judgment and decision-making abilities can be adversely affected by even small amounts of alcohol."],2,"FAA guidance is explicit that as little as one ounce of liquor, one bottle of beer, or four ounces of wine can impair flying skills, so judgment degrades well before a person feels drunk. Alcohol degrades vision rather than sharpening it, which kills choice A. Choice B is the classic folk-remedy trap: the liver metabolizes alcohol at a fixed rate that water, coffee, oxygen, and time-in-the-shower cannot accelerate — only time removes it, and a hangover can still leave you impaired.",2,3,"AIM 8-1-1 (Fitness for Flight, Alcohol); PHAK ch. 17 (Aeromedical Factors).",""],
["V","UA.V.C.K1","When using a small UA in a commercial operation, who is responsible for briefing the participants about emergency procedures?",["The FAA inspector-in-charge.", "The lead visual observer.", "The remote PIC."],2,"14 CFR 107.49(a)(4) requires the remote pilot in command, before flight, to ensure that all persons directly participating in the operation are informed about operating conditions, emergency procedures, contingency procedures, roles and responsibilities, and potential hazards. The visual observer is one of the people being briefed, not the briefer. There is no 'FAA inspector-in-charge' assigned to routine part 107 operations — the FAA does not staff your job site, and the duty never leaves the RPIC.",2,3,"14 CFR 107.49(a)(4) (eCFR).",""],
["III","UA.III.B.K1c","What are the characteristics of stable air?",["Good visibility and steady precipitation.", "Poor visibility and steady precipitation.", "Poor visibility and intermittent precipitation."],1,"Stable air resists vertical motion, so haze, smoke, and pollutants stay trapped near the surface (poor visibility) and clouds spread horizontally into stratiform layers that yield continuous, steady precipitation. Unstable air is the mirror image: vertical currents scour out the haze for good visibility but build cumulus that produce showery, intermittent precipitation. Choice A pairs the unstable visibility with the stable precipitation, and choice C pairs the stable visibility with the unstable precipitation — both are half-right hybrids, which is the trap.",2,3,"FAA Remote Pilot – sUAS Study Guide (stable air: fair-to-poor visibility in haze and smoke, continuous precipitation); PHAK ch. 12 (Weather Theory).",""],
["III","UA.III.B.K1j","You have received an outlook briefing from flight service through 1800wxbrief.com. The briefing indicates you can expect a low-level temperature inversion with high relative humidity. What weather conditions would you expect?",["Smooth air, poor visibility, fog, haze, or low clouds.", "Light wind shear, poor visibility, haze, and light rain.", "Turbulent air, poor visibility, fog, low stratus type clouds, and showery precipitation."],0,"A temperature inversion is the most stable condition in the atmosphere — warm air sitting on cold air shuts off vertical mixing, which makes the air smooth. With high relative humidity added, the trapped moisture and pollutants below the inversion produce fog, haze, smoke, or low clouds and badly reduced visibility. Choice C is wrong on the two words that matter, 'turbulent' and 'showery,' since both are signatures of unstable air and an inversion is the opposite. The trap is knowing the visibility half and not checking the stability half.",2,3,"FAA Remote Pilot – sUAS Study Guide (high relative humidity in an inversion contributes to clouds, fog, haze, or smoke and diminished visibility in the inversion layer); PHAK ch. 12.",""],
["I","UA.I.B.K25","When may a remote pilot reduce the intensity of an aircraft's lights during a night flight?",["At no time may the lights of an sUAS be reduced in intensity at night.", "When a manned aircraft is in the vicinity of the sUAS.", "When it is in the interest of safety to dim the aircraft's lights."],2,"14 CFR 107.29 states that the remote pilot in command may reduce the intensity of, but may not extinguish, the anti-collision lighting if he or she determines that, because of operating conditions, it would be in the interest of safety to do so. The judgment call belongs to the RPIC and is tied to safety, not to any particular triggering event. Choice B gets it exactly backwards — nearby manned traffic is when you most want the lights at full output. Watch the reduce-versus-extinguish line: dimming is permitted, turning them off never is.",2,3,"14 CFR 107.29(a)(2) and 107.29(b) (eCFR).",""],
["I","UA.I.F.K1","What must a person, who is manipulating the controls of a small unmanned aircraft, do if the standard remote identification fails during a flight?",["Land the aircraft as soon as practicable.", "Notify the nearest FAA Air Traffic facility.", "Activate the aircraft's navigation lights."],0,"14 CFR 89.110(a)(2) requires the person manipulating the flight controls to land the unmanned aircraft as soon as practicable once it is no longer broadcasting the required remote ID message elements, and 89.115(a)(4) imposes the identical duty when a broadcast module fails. Note the wording is 'as soon as practicable,' not 'immediately' — you still get to pick a safe landing spot. Part 89 requires no ATC phone call and no lighting change; lights are a 107.29 night matter and have nothing to do with remote ID.",2,3,"14 CFR 89.110(a)(2) and 89.115(a)(4) (eCFR).",""],
["I","UA.I.B.K1","Where must a small unmanned aircraft's serial number be listed when using either standard remote identification or a broadcast module?",["The aircraft's Document of Compliance.", "The manufacturer's Method of Compliance.", "The Certificate of Aircraft Registration."],2,"Under 14 CFR 89.110(b)(4) the Certificate of Aircraft Registration must list the serial number of a standard remote ID aircraft, and 89.115(a)(1)(ii) requires the broadcast module's serial number on the registration when a module is used — so either way the serial number lives on the registration certificate. The Declaration of Compliance and the Means of Compliance are manufacturer-side documents proving a design meets the remote ID standard; they are filed by the producer and never track your individual aircraft. The trap is that those two official-sounding names appear in part 89 and feel plausible.",2,3,"14 CFR 89.110(b)(4) and 89.115(a)(1)(ii) (eCFR).",""],
["V","UA.V.E.K8","When preparing for a night flight, what should an sUAS pilot be aware of after assembling and conducting a preflight of an aircraft while using a bright flashlight or work light?",["Once adapted to darkness, a persons eyes are relatively immune to bright lights.", "It takes approximately 30 minutes for a persons eyes to fully adapt to darkness.", "The person should use a flash light equipped with LED lights to facilitate their night vision."],1,"The AIM states that exposure to total darkness for at least 30 minutes is required for complete dark adaptation, so a pilot who just finished a preflight under a work light needs roughly half an hour before their night vision is usable. Choice A is the exact opposite of the rule — any degree of dark adaptation is lost within a few seconds of viewing a bright light, which is precisely why this question exists. Choice C is wrong because bright white LED light destroys adaptation fastest; dim red light is the traditional answer, and closing one eye while using a light preserves vision in the other.",2,3,"AIM 8-1-6 (Vision in Flight): 30 minutes in total darkness for complete dark adaptation; adaptation lost within seconds of a bright light.",""],
["I","UA.I.E.K3a","To conduct Category 1 operations, a remote pilot in command must use a small unmanned aircraft that weighs",["0.55 pounds or less.", "0.65 pounds or less.", "0.75 pounds or less."],0,"14 CFR 107.110 limits Category 1 operations over human beings to an aircraft weighing 0.55 pounds or less on takeoff and throughout the flight, including everything on board or otherwise attached, with no exposed rotating parts that could lacerate human skin. The 0.55-pound figure is the same number used as the registration threshold, which makes it easy to remember. The other two weights are invented; part 107 subpart D defines Categories 2, 3, and 4 by injury-severity testing and certification, not by a higher simple weight cutoff.",2,3,"14 CFR 107.110 (eCFR).",""],
["I","UA.I.E.K3d","Which Category of small unmanned aircraft must have an airworthiness certificate issued by the FAA?",["4.", "3.", "2."],0,"14 CFR 107.140 requires a Category 4 small unmanned aircraft to hold an airworthiness certificate issued under part 21, plus maintenance in accordance with the manufacturer's instructions for continued airworthiness. Category 4 is the only one of the four that reaches that bar — Categories 2 and 3 qualify through injury-severity limits and a manufacturer's declaration of compliance, and Category 1 qualifies purely on the 0.55-pound weight. Read the options carefully here, since they are listed out of numerical order (A is '4.'), which is an easy place to mis-bubble.",2,3,"14 CFR 107.140 (eCFR); 14 CFR 107.115 and 107.120 for Categories 2 and 3.",""],
["II","UA.II.A.K3","Your surveying company is a title sponsor for a race team at the Indianapolis 500. To promote your new aerial surveying department, you decide to video part of the race using a small UA. The FAA has issued a Temporary Flight Restriction (TFR) for the race in the area you plan to fly. In this situation",["you may fly your drone in the TFR since your company is sponsoring a team at the race.", "the TFR applies to all aircraft; you may not fly in the area without a Certificate of Waiver or Authorization.", "flying your drone is allowed if you notify all non-participating people of the closed course UA operation."],1,"A TFR issued under 14 CFR 91.145 for an aerial demonstration or major sporting event restricts the airspace for all aircraft, and a small UAS is an aircraft; 14 CFR 107.47 further requires compliance with airspace restrictions. Entry requires specific authorization from the issuing FAA authority. Sponsorship, media credentials, or a ticket confer no airspace privileges whatsoever — that is the trap in choice A, which dangles a business justification that has no regulatory weight. Choice C confuses the separate operations-over-people rules with airspace access; briefing bystanders does nothing to open a closed TFR.",2,3,"14 CFR 91.145 and 99.7; 14 CFR 107.47 (eCFR); AIM 3-5-3 (Temporary Flight Restrictions).",""]
];

/* ============================================================
   GENERATORS — parameterized items. Memorizing an instance
   teaches nothing, because the numbers and contexts rotate.
   Each returns {t,acs,q,o,a,e,g,diff} where g = concept id.
   ============================================================ */
function ri(n){return Math.floor(Math.random()*n)}
function pick(a){return a[ri(a.length)]}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
/* build a 3-option item with the correct value plus two near-miss distractors */
function opts3(correct,d1,d2){
 var arr=shuf([[correct,1],[d1,0],[d2,0]]),o=[],a=0;
 for(var i=0;i<3;i++){o.push(arr[i][0]);if(arr[i][1])a=i}
 return {o:o,a:a};
}

var AIRPORTS=[["Cedar Key","CDK"],["Marion County","OCF"],["Cross City","CTY"],["Dunnellon","X35"],["Leesburg Intl","LEE"],["Williston Muni","X60"],["Palatka Muni","28J"],["Gainesville Rgnl","GNV"]];

var GEN=[
/* G1 — operating limits, rotating which limit is asked */
{id:"g-limits",t:"I",acs:"UA.I.B.K21",diff:1,f:function(){
 var L=[["the maximum altitude","400 ft AGL","500 ft AGL","400 ft MSL","The ceiling is <b>400 ft AGL</b>. Not MSL, and not 500."],
  ["the maximum groundspeed","100 mph (87 knots)","87 mph (100 knots)","120 mph (104 knots)","<b>100 mph, which is 87 knots.</b> The distractor swaps the units."],
  ["the minimum flight visibility","3 statute miles","1 statute mile","3 nautical miles","<b>3 statute miles</b>, from the control station. Statute, not nautical."],
  ["the minimum distance below clouds","500 ft","1,000 ft","2,000 ft","<b>500 ft below, 2,000 ft horizontally.</b> The 2,000 is the horizontal figure."],
  ["the minimum horizontal distance from clouds","2,000 ft","1,000 ft","500 ft","<b>2,000 ft horizontally, 500 ft below.</b> The 500 is the vertical figure."]];
 var x=pick(L),k=opts3(x[1],x[2],x[3]);
 return {t:"I",acs:"UA.I.B.K21",g:"limits",diff:1,q:"Under part 107, what is "+x[0]+"?",o:k.o,a:k.a,e:x[4]};
}},
/* G2 — MSL to AGL conversion */
{id:"g-agl",t:"II",acs:"UA.II.X.C2",diff:3,f:function(){
 var fld=100*(4+ri(28)), flr=fld+100*(6+ri(24));
 var agl=flr-fld, k=opts3(agl+" ft AGL",flr+" ft AGL",fld+" ft AGL");
 return {t:"II",acs:"UA.II.X.C2",g:"msl-agl",diff:3,
  q:"A charted airspace floor is "+flr+" ft MSL. Terrain elevation beneath you is "+fld+" ft MSL. How far above the ground is that floor?",
  o:k.o,a:k.a,e:"Charted altitudes are <b>MSL</b>. Subtract terrain: "+flr+" minus "+fld+" is <b>"+agl+" ft AGL</b>. Your 400 ft limit is AGL, so this is the number that matters."};
}},
/* G3 — airspace class to authorization */
{id:"g-auth",t:"II",acs:"UA.II.B.K2",diff:2,f:function(){

/* A generator can occasionally land on numbers that make two options identical
   (e.g. a floor exactly twice the terrain elevation makes the AGL answer equal
   one distractor). Rather than corrupt the wording, redraw the scenario. */
function distinct3(o){return o&&o.length===3&&o[0]!==o[1]&&o[1]!==o[2]&&o[0]!==o[2]}
function genItem(gi){var g=GEN[gi],it;
 for(var tries=0;tries<25;tries++){it=g.f();if(distinct3(it.o))break}
 it.gen=1;return it;
}
function genAny(area){
 var pool=[];for(var i=0;i<GEN.length;i++)if(!area||GEN[i].t===area)pool.push(i);
 if(!pool.length)return null;return genItem(pick(pool));
}

/* ============================================================
   READINESS ENGINE
   Posterior predictive P(exam score >= 42 of 60).
   Evidence rules that protect the estimate:
     - only FIRST attempt at a given item counts
     - generated items always count (novel instance each time)
     - validation-bank items are weighted higher
     - answers faster than MIN_MS are discarded as non-evidence
     - evidence decays with age (half-life HALFLIFE_D days)
   ============================================================ */
var MIN_MS=2500, HALFLIFE_D=45, VAL_WEIGHT=2.0;

function gammaSample(k){ /* Marsaglia-Tsang, k>=1 */
 if(k<1){return gammaSample(k+1)*Math.pow(Math.random(),1/k)}
 var d=k-1/3,c=1/Math.sqrt(9*d),x,v,u;
 for(;;){do{x=normSample();v=1+c*x}while(v<=0);v=v*v*v;u=Math.random();
  if(u<1-0.0331*x*x*x*x)return d*v;
  if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}
}
var _spare=null;
function normSample(){
 if(_spare!==null){var s=_spare;_spare=null;return s}
 var u,v,s2;do{u=Math.random()*2-1;v=Math.random()*2-1;s2=u*u+v*v}while(s2>=1||s2===0);
 var m=Math.sqrt(-2*Math.log(s2)/s2);_spare=v*m;return u*m;
}
function betaSample(a,b){var x=gammaSample(a),y=gammaSample(b);return x/(x+y)}
function binomSample(n,p){var c=0;for(var i=0;i<n;i++)if(Math.random()<p)c++;return c}

/* evidence: {areaId:{r:effectiveCorrect, w:effectiveWrong, n:rawCount, nv:validationCount}} */
function decayedEvidence(log){
 var now=Date.now(), ev={};
 for(var i=0;i<AREAS.length;i++)ev[AREAS[i].id]={r:0,w:0,n:0,nv:0};
 for(var j=0;j<log.length;j++){
  var L=log[j];
  if(L.ms<MIN_MS)continue;                    /* anti-gaming: too fast to be reasoning */
  var days=(now-L.at)/86400000;
  var wgt=Math.pow(0.5,days/HALFLIFE_D)*(L.val?VAL_WEIGHT:1);
  var e=ev[L.t]; if(!e)continue;
  if(L.ok)e.r+=wgt; else e.w+=wgt;
  e.n++; if(L.val)e.nv++;
 }
 return ev;
}

function pPass(ev,draws){
 draws=draws||4000;
 var pass=0;
 for(var d=0;d<draws;d++){
  var score=0;
  for(var i=0;i<AREAS.length;i++){
   var a=AREAS[i],e=ev[a.id];
   /* Beta(1,1) uniform prior: thin evidence widens the posterior and lowers P(pass) on its own */
   var p=betaSample(1+e.r,1+e.w);
   score+=binomSample(a.n60,p);
  }
  if(score>=PASS_MARK)pass++;
 }
 return pass/draws;
}

function areaPct(e){var t=e.r+e.w;return t>0?Math.round(e.r/(t)*100):null}
/* Never print 100%. A Monte Carlo estimate that rounds to 100 means "no failures
   in 4,000 draws", which is not the same as certainty, and printing 100% would be
   the exact kind of unearned claim this platform is built to avoid. */
function pStr(p){var v=p*100;if(v>99.9)return "99.9%+";if(v<0.1&&v>0)return "<0.1%";return v.toFixed(1)+"%"}

/* Readiness levels and the gate. Deliberately harder than the legal pass mark. */
var LEVELS=["Foundation","Developing","Proficient","Nearly Ready","Exam Ready","High-Confidence Ready"];

function assess(state){
 var ev=decayedEvidence(state.log);
 var p=pPass(ev);
 var checks=[],ok=true;

 /* 1. per-area floors and minimum evidence */
 for(var i=0;i<AREAS.length;i++){
  var a=AREAS[i],e=ev[a.id],pc=areaPct(e);
  var need=Math.max(15,a.n60);
  var passArea=(pc!==null&&pc>=a.floor&&e.n>=need);
  checks.push({k:a.name,ok:passArea,
   d:pc===null?("no evidence yet, need "+need+" answers"):
     (pc+"% correct vs "+a.floor+"% floor · "+e.n+" answers logged, "+need+" needed")});
  if(!passArea)ok=false;
 }
 /* 2. validation-bank performance, computed separately */
 var vr=0,vw=0;
 for(var j=0;j<state.log.length;j++){var L=state.log[j];if(L.val&&L.ms>=MIN_MS){if(L.ok)vr++;else vw++}}
 var vt=vr+vw, vpc=vt?Math.round(vr/vt*100):null;
 var vOK=(vt>=20&&vpc>=90);
 checks.push({k:"Protected validation bank",ok:vOK,d:vt?(vpc+"% over "+vt+" unseen items, need 90% over 20"):"not attempted"});
 if(!vOK)ok=false;

 /* 3. two full simulations at 85%+ */
 var good=0;for(var m=0;m<state.exams.length;m++)if(state.exams[m].mode==="full"&&state.exams[m].pct>=85)good++;
 var eOK=good>=2;
 checks.push({k:"Full simulations at 85%+",ok:eOK,d:good+" of 2"});
 if(!eOK)ok=false;

 /* 4. one challenge simulation passed */
 var ch=0;for(var n=0;n<state.exams.length;n++)if(state.exams[n].mode==="challenge"&&state.exams[n].pct>=80)ch++;
 var cOK=ch>=1;
 checks.push({k:"Challenge simulation at 80%+",ok:cOK,d:ch+" of 1"});
 if(!cOK)ok=false;

 /* 5. no unresolved confident-wrong misconceptions */
 var mis=state.misconceptions.length;
 var mOK=mis===0;
 checks.push({k:"Unresolved misconceptions",ok:mOK,d:mis?(mis+" concept"+(mis>1?"s":"")+" answered wrong while marked certain"):"none"});
 if(!mOK)ok=false;

 /* 6. evidence spread over at least 3 distinct days */
 var days={};for(var q=0;q<state.log.length;q++)days[new Date(state.log[q].at).toDateString()]=1;
 var nd=Object.keys(days).length, dOK=nd>=3;
 checks.push({k:"Study spread across days",ok:dOK,d:nd+" of 3 distinct days"});
 if(!dOK)ok=false;

 /* 7. model must itself be confident */
 var pOK=p>=0.97;
 checks.push({k:"Modelled P(pass) at or above 97%",ok:pOK,d:pStr(p)});
 if(!pOK)ok=false;

 /* level */
 var lvl=0, passed=0;
 for(var z=0;z<checks.length;z++)if(checks[z].ok)passed++;
 var frac=passed/checks.length;
 if(ok)lvl=5; else if(frac>=0.85)lvl=4; else if(frac>=0.65)lvl=3; else if(frac>=0.4)lvl=2; else if(frac>0)lvl=1;

 return {ev:ev,p:p,checks:checks,ready:ok,level:lvl,valPct:vpc,valN:vt,goodExams:good,challenge:ch};
}

/* Study-to-pass: what to do next, in priority order */
function nextAction(state,A){
 var ev=A.ev;
 /* 1. unresolved misconception */
 if(state.misconceptions.length)return {label:"Resolve a misconception",why:"You answered this while marked Certain and got it wrong. That is a wrong belief, not a gap.",drill:"mis"};
 /* 2. overdue spaced review */
 var due=dueCount(state);
 if(due>=8)return {label:"Clear "+due+" overdue reviews",why:"Knowledge decays. These concepts are past their review date.",drill:"srs"};
 /* 3. weakest area below floor */
 var worst=null;
 for(var i=0;i<AREAS.length;i++){var a=AREAS[i],e=ev[a.id],pc=areaPct(e);
  var need=Math.max(15,a.n60);
  if(pc===null||e.n<need||pc<a.floor){var deficit=(pc===null?100:a.floor-pc)*a.wt;
   if(!worst||deficit>worst.d)worst={a:a,d:deficit,pc:pc,n:e.n,need:need}}}
 if(worst)return {label:"Drill "+worst.a.name,
  why:worst.pc===null?("No evidence yet in an area worth "+worst.a.wt+"% of the exam."):
   ("At "+worst.pc+"% against a "+worst.a.floor+"% floor, in an area worth "+worst.a.wt+"% of the exam."),
  drill:worst.a.id};
 /* 4. exams */
 if(A.goodExams<2)return {label:"Take a full simulation",why:"You need two 60-question simulations at 85% or better.",drill:"full"};
 if(A.challenge<1)return {label:"Take the challenge simulation",why:"Harder than the real exam. Passing it is the last gate.",drill:"challenge"};
 if(A.valN<20)return {label:"Take the validation exam",why:"Unseen items are the only honest measure of whether you understand or merely remember.",drill:"validation"};
 return {label:"Maintain with mixed review",why:"You are at standard. Keep evidence fresh until test day.",drill:"mixed"};
}

/* ============================================================
   SPACED REPETITION — SM-2 style, per CONCEPT not per question
   ============================================================ */
function conceptOf(item){return item.gen?("G:"+item.g):("A:"+item.acs)}
function srsUpdate(state,key,ok,conf){
 var c=state.srs[key]||{ef:2.5,n:0,iv:0,due:0};
 var q=ok?(conf==="certain"?5:conf==="unsure"?4:3):(conf==="certain"?0:2);
 if(q<3){c.n=0;c.iv=1}
 else{c.n++;c.iv=c.n===1?1:c.n===2?4:Math.round(c.iv*c.ef);
  c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)))}
 c.due=Date.now()+c.iv*86400000;
 state.srs[key]=c;
}
function dueCount(state){var n=0,now=Date.now();for(var k in state.srs)if(state.srs[k].due<=now)n++;return n}

/* ============================================================

/* ---- item assembly ---- */
function qItem(idx){var r=QB[idx];return {idx:idx,t:r[0],acs:r[1],q:r[2],o:r[3],a:r[4],e:r[5],val:(r[6]===1?1:0),faa:(r[6]===2?1:0),diff:r[7],src:r[8]||"",fig:r[9]||""}}
var AKTS="https://www.faa.gov/sites/faa.gov/files/training_testing/testing/supplements/sport_rec_private_akts.pdf";
function faaPool(area){var o=[];for(var i=0;i<QB.length;i++)if(QB[i][6]===2&&(!area||QB[i][0]===area))o.push(i);return o}
function trainPool(area){var o=[];for(var i=0;i<QB.length;i++)if(QB[i][6]===0&&(!area||QB[i][0]===area))o.push(i);return o}
function valPool(area){var o=[];for(var i=0;i<QB.length;i++)if(QB[i][6]===1&&(!area||QB[i][0]===area))o.push(i);return o}

/* Low-variety generators (a limit that rotates through five values, say) can emit
   the same stem twice inside one 60-question set. A repeat is not extra evidence
   and it looks broken, so any duplicate is swapped for a fresh generated instance
   or an unused static item from the same area. */
function itemKey(q){return q.gen?("g:"+q.g+":"+q.q):("s:"+q.idx)}
function dedupe(out){
 var seen={},res=[],i,j,t;
 for(i=0;i<out.length;i++){
  var q=out[i],key=itemKey(q);
  if(!seen[key]){seen[key]=1;res.push(q);continue}
  var fixed=null;
  for(t=0;t<12&&!fixed;t++){var g=genAny(q.t);if(g){var k2=itemKey(g);if(!seen[k2]){seen[k2]=1;fixed=g}}}
  if(!fixed){var pool=shuf(trainPool(q.t));
   for(j=0;j<pool.length;j++){if(!seen["s:"+pool[j]]){seen["s:"+pool[j]]=1;fixed=qItem(pool[j]);break}}}
  if(fixed)res.push(fixed);
 }
 return res;
}

function buildSet(mode){
 var out=[],i,k;
 /* The 46 official FAA sample questions, in the FAA's published order, never
    padded and never mixed into practice. They are the only items here whose
    wording is not mine. */
 if(mode==="faa"){
  var fp=faaPool(null);
  for(i=0;i<fp.length;i++)out.push(qItem(fp[i]));
  return out;
 }
 /* The validation exam is every protected item, once. It is never padded to 60
    and never repeats an item, because a repeat would not be unseen evidence. */
 if(mode==="validation"){
  var vp=shuf(valPool(null));
  for(i=0;i<vp.length;i++)out.push(qItem(vp[i]));
  return out;
 }
 if(mode==="full"||mode==="challenge"||mode==="diag"){
  var scale=mode==="diag"?(20/60):1;
  for(k=0;k<AREAS.length;k++){
   var a=AREAS[k],want=Math.max(1,Math.round(a.n60*scale));
   var pool=shuf(trainPool(a.id));
   for(i=0;i<want;i++){
    if(mode==="challenge"){ /* harder: prefer diff 3 and generated variants */
     if(Math.random()<0.5){var g=genAny(a.id);if(g){out.push(g);continue}}
     var hard=pool.filter(function(x){return QB[x][7]>=2});
     out.push(qItem((hard.length?hard:pool)[i%(hard.length||pool.length)]));
    } else {
     /* full exam: mix static and generated so it cannot be memorized */
     if(Math.random()<0.35){var gg=genAny(a.id);if(gg){out.push(gg);continue}}
     if(pool.length)out.push(qItem(pool[i%pool.length]));
    }
   }
  }
  return dedupe(shuf(out));
 }
 if(mode==="mis"){
  for(i=0;i<st.misconceptions.length;i++){
   var m=st.misconceptions[i];
   if(m.indexOf("G:")===0){var gi=-1;for(k=0;k<GEN.length;k++)if("G:"+GEN[k].f().g===m||("G:"+GEN[k].id.replace("g-",""))===m)gi=k;
    var it=genAny(null);if(it)out.push(it)}
   else{var code=m.slice(2);for(k=0;k<QB.length;k++)if(QB[k][1]===code&&QB[k][6]===0)out.push(qItem(k))}
  }
  return shuf(out).slice(0,20);
 }
 if(mode==="srs"){
  var now=Date.now(),due=[];
  for(var key in st.srs)if(st.srs[key].due<=now)due.push(key);
  for(i=0;i<due.length&&i<25;i++){
   if(due[i].indexOf("G:")===0){var g2=genAny(null);if(g2)out.push(g2)}
   else{var c2=due[i].slice(2);for(k=0;k<QB.length;k++)if(QB[k][1]===c2&&QB[k][6]===0){out.push(qItem(k));break}}
  }
  return shuf(out);
 }
 if(mode==="mixed"){
  var tp=shuf(trainPool(null)).slice(0,15);
  for(i=0;i<tp.length;i++)out.push(qItem(tp[i]));
  for(i=0;i<10;i++){var gm=genAny(null);if(gm)out.push(gm)}
  return dedupe(shuf(out));
 }
 /* area drill: static + generated */
 var p2=shuf(trainPool(mode));
 for(i=0;i<p2.length;i++)out.push(qItem(p2[i]));
 for(i=0;i<Math.max(6,Math.round(p2.length*0.5));i++){var ga=genAny(mode);if(ga)out.push(ga)}
 return dedupe(shuf(out));
}

function vReady(){
 var A=assess(st);
 var h='<div class="hero col"><p class="eyebrow">Readiness</p><h1>The gate</h1>';
 h+='<p class="lede">Every check must pass. It is deliberately harder than the legal pass mark, because the cost of a false ready is $175 and 14 days.</p></div><div class="col">';
 h+='<div class="pbox"><div class="pnum '+(A.p>=0.97?"g":A.p>=0.85?"m":"r")+'">'+pStr(A.p)+'</div><div class="pmeta"><b>'+LEVELS[A.level]+'</b><span>'+(A.ready?"All checks passed. Book it.":"Checks remaining below.")+'</span></div></div>';
 h+='<div class="checks">';
 for(var i=0;i<A.checks.length;i++){var c=A.checks[i];
  h+='<div class="chk '+(c.ok?"ok":"no")+'"><span class="mk">'+(c.ok?"✓":"○")+'</span><div><b>'+esc(c.k)+'</b><span>'+esc(c.d)+'</span></div></div>';}
 h+='</div>';
 h+='<h2>How this number is computed</h2>';
 h+='<ul class="lst">';
 h+='<li>Each area gets a <b>Beta posterior</b> over your per-question accuracy, starting from a uniform Beta(1,1) prior.</li>';
 h+='<li>Evidence <b>decays</b> with a 45 day half-life, so mastery from six weeks ago does not count as fresh.</li>';
 h+='<li>Validation-bank answers are weighted <b>2x</b>, because unseen items measure understanding rather than recall of a specific item.</li>';
 h+='<li>Answers submitted in under <b>2.5 seconds</b> are discarded entirely as non-evidence. Clicking fast does not move the number.</li>';
 h+='<li>4,000 Monte Carlo draws sample a per-area accuracy from each posterior, draw a binomial score for that area\'s share of the 60 questions, and count how often the total reaches 42.</li>';
 h+='<li>Thin evidence produces a wide posterior, which lowers P(pass) automatically. You cannot reach a high number by answering six questions well.</li>';
 h+='</ul>';
 h+='<div class="call"><h3>What this number is not</h3><p>It is an estimate from your performance on this platform, not a validated real-world pass rate. No such validation exists for this system yet, because that requires outcome data from students who actually sat the exam. See the Coverage tab for the measurement plan.</p></div>';
 h+='</div>';
 return h;
}

 if(none){h+='<div class="call warnc"><span class="stamp">Open gap</span><h3>'+none+' element'+(none>1?"s":"")+' has no assessment item</h3><p>These are honestly listed rather than hidden. Each is a build task.</p><ul class="lst">';

 else h+='<div class="call okc"><span class="stamp">Audit passed</span><h3>Every tracked element has at least one assessment item</h3><p>Depth still varies. Depth by element is the next build target, not breadth.</p></div>';

 h+='<h2>Source audit, September 2026</h2>';
 var aud=0,unaud=0,k;
 for(k=0;k<QB.length;k++){if(QB[k][8])aud++;else unaud++}
 h+='<p><b>'+aud+'</b> of the '+QB.length+' written items were checked against FAA primary sources by an independent reviewer, who was handed the question and told to derive the answer themselves without trusting the explanation. This is what that audit found.</p>';
 h+='<div class="stats3"><div class="s3 g"><b>221</b><span>Passed unchanged</span></div><div class="s3 r"><b>2</b><span>Wrong answer keyed</span></div>';

 h+='<p>Most of the rest were explanations that overstated a rule: blanket claims like &quot;every charted altitude is MSL&quot; that have real exceptions, a $500 damage threshold stated as &quot;or more&quot; when the rule says &quot;exceeds&quot;, and several Subpart D items that said &quot;all three categories&quot; when there are four.</p>';
 h+='<p>The audit also caught a regulation that changed after this content was written: <b>14 CFR 107.5 is now [Reserved]</b>, and falsification of records moved to 14 CFR 3.403 in December 2025.</p></div>';
 h+='<div class="call okc"><span class="stamp">Added September 2026</span><h3>All 46 official FAA sample questions are now included</h3>';
 h+='<p>The FAA publishes 46 sample questions for this exam and <b>no answer key</b>. They are in here verbatim, in the FAA\'s published order, under Practice. They are kept out of every other mode so they stay clean as a calibration check, and 13 of them link to the free Airman Knowledge Testing Supplement for the chart figures they need.</p>';
 h+='<p>These are the only items on this site whose wording is not mine. The answers and explanations attached to them are mine, each carrying its own citation, because the FAA does not supply them.</p></div>';
 h+='<p>Each audited item carries the exact citation it was checked against, shown under the explanation when you answer it. Generated items are built from those verified rules but assembled fresh each time, so they are marked as generated rather than individually cited.</p>';
 if(unaud)h+='<div class="call slatec"><span class="stamp">Not yet verified</span><h3>'+unaud+' item'+(unaud>1?'s were':' was')+' written after the audit closed</h3><p>Added to keep ACS coverage complete after two items were recoded to their correct ACS elements. '+(unaud>1?'They have':'It has')+' not been through independent verification, and '+(unaud>1?'they say':'it says')+' so under the explanation. Treat '+(unaud>1?'them':'it')+' as the weakest content here until the next audit.</p></div>';
 h+='<h2>Source registry</h2><div class="tw"><table><thead><tr><th>Source</th><th>Version</th><th>Verified</th><th>Status</th></tr></thead><tbody>';
 for(var k in SOURCES){var s=SOURCES[k];
  h+='<tr><td><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.n)+'</a></td><td>'+esc(s.v)+'</td><td>'+esc(s.d)+'</td><td>'+(s.s.indexOf("CURRENT")===0?'<span class="tag g">'+esc(s.s)+'</span>':'<span class="tag w">'+esc(s.s)+'</span>')+'</td></tr>';}
 h+='</tbody></table></div>';

 h+='<h2>The 99.9% question, answered honestly</h2>';
 h+='<p>The engineering target is that real failure among certified-ready students becomes an outlier. The <b>claim</b> is a separate thing and requires evidence this system does not yet have.</p>';
 h+='<div class="tw"><table><thead><tr><th>Stage</th><th>What it requires</th><th>Status</th></tr></thead><tbody>';
 h+='<tr><td><b>Designed</b></td><td>Full ACS coverage, conservative gate, unseen validation, decay, anti-gaming</td><td><span class="tag g">Done</span></td></tr>';
 h+='<tr><td><b>Instrumented</b></td><td>Per-item and per-element outcome logging, consented exam-result capture</td><td><span class="tag w">Needs a backend</span></td></tr>';
 h+='<tr><td><b>Early validation</b></td><td>~50 qualifying students with real exam outcomes</td><td><span class="tag n">No data</span></td></tr>';
 h+='<tr><td><b>Validated</b></td><td>~300 qualifying students, measured relationship between gate and pass</td><td><span class="tag n">No data</span></td></tr>';
 h+='<tr><td><b>99.9% supportable</b></td><td><b>~3,000 qualifying students with zero failures</b> for a 95% lower bound (rule of three: 3/n)</td><td><span class="tag n">No data</span></td></tr>';
 h+='</tbody></table></div>';
 h+='<p>Until that evidence exists, this platform reports a <b>modelled</b> probability from your own performance and says so plainly. It does not print a pass rate.</p>';

 h+='<h2>How the claim would actually be earned</h2>';
 h+='<p>The target is that a real failure among students who cleared the gate becomes an outlier. Here is the measurement that would establish it, written down now so it cannot be quietly skipped later.</p>';
 h+='<h4>1. What gets collected</h4><ul class="lst">';
 h+='<li>Per item: ACS element, bank, difficulty, generated or static, correct or not, response time, stated confidence, timestamp.</li>';
 h+='<li>Per session: which mode, the set drawn, the score.</li>';
 h+='<li>At the gate: the full check vector and the modelled P(pass) at the moment the student was told they were ready.</li>';
 h+='<li>After the exam, and only with explicit consent: pass or fail, scaled score, and the ACS codes printed on the test report.</li>';
 h+='<li>Nothing else. No name, no address, no employer, no browsing behaviour. The outcome study needs a study id, a gate vector and a result.</li>';
 h+='</ul>';
 h+='<h4>2. The primary question</h4>';
 h+='<p>Among students who reached <b>High-Confidence Ready</b> and then sat the exam, what fraction passed on the first attempt? That single number is the product claim. Everything else is diagnostic.</p>';
 h+='<div class="tw"><table><thead><tr><th>n with zero failures</th><th>95% lower bound on pass rate</th><th>What may honestly be said</th></tr></thead><tbody>';
 h+='<tr><td>30</td><td>90.5%</td><td>Encouraging, not a claim</td></tr>';
 h+='<tr><td>60</td><td>95.1%</td><td>&quot;Above 95% in our first 60&quot;</td></tr>';
 h+='<tr><td>300</td><td>99.0%</td><td>&quot;Above 99%&quot;</td></tr>';
 h+='<tr><td>3,000</td><td>99.9%</td><td>&quot;Above 99.9%&quot;</td></tr>';
 h+='</tbody></table></div>';
 h+='<p class="mut">Rule of three: with zero observed failures in n trials, the 95% upper bound on the failure rate is about 3/n. A single failure resets the arithmetic, which is the point of writing it down in advance.</p>';
 h+='<h4>3. The error budget</h4>';
 h+='<p>A student who clears the gate and fails is the only error that matters commercially. A student held back who would have passed costs them time. The platform is tuned to prefer the second, on purpose.</p>';
 h+='<div class="tw"><table><thead><tr><th>Failure mode</th><th>Cause</th><th>Control in the build</th></tr></thead><tbody>';
 h+='<tr><td><b>False ready</b></td><td>Bank easier than the real exam</td><td>85% simulation bar against a 70% legal pass mark, plus a challenge simulation weighted to applied and trap items</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Memorized the bank</td><td>Protected validation bank never served in practice, weighted 2x, plus generators that rotate numbers and contexts</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Clicked through without thinking</td><td>Responses under 2.5 seconds are discarded as non-evidence</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Peaked weeks ago</td><td>45 day evidence half-life, spaced review keyed to concept</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Strong overall, blind in one area</td><td>Per-area floors that must each pass independently; an average cannot hide a hole</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Confidently wrong beliefs</td><td>Wrong while marked Certain opens a misconception that must be cleared before the gate</td></tr>';
 h+='<tr><td><b>False not ready</b></td><td>Thin evidence widens the posterior</td><td>Accepted deliberately. Answer more questions and it resolves.</td></tr>';
 h+='<tr><td><b>Content error</b></td><td>A regulation changed</td><td>Source registry with version and verified date on every source, shown above</td></tr>';
 h+='</tbody></table></div>';
 h+='<h4>4. What happens when someone fails</h4>';
 h+='<p>Every failure by a gate-cleared student gets a written postmortem, because that is the only data that improves the model:</p>';
 h+='<ul class="lst">';
 h+='<li>Pull the ACS codes from their test report and compare them against their per-element history here.</li>';
 h+='<li>Classify it: <b>gap</b> (element never assessed at sufficient depth), <b>decay</b> (mastered, then stale), <b>calibration</b> (bank easier than the real item), or <b>noise</b> (genuinely prepared, bad day).</li>';
 h+='<li>Gap fixes the bank. Decay tightens the half-life or the review schedule. Calibration raises the difficulty mix or a floor. Noise changes nothing, and pretending otherwise is how a model gets overfitted to one student.</li>';
 h+='<li>Log the change and the date, so the gate that certified a student is reconstructable later.</li>';
 h+='</ul>';
 h+='<h4>5. What this build honestly cannot do</h4>';
 h+='<p>This runs entirely in your browser. Progress is stored on this device and nothing is transmitted anywhere. That is good for privacy and fatal for measurement, so the following require a server that does not exist yet:</p>';
 h+='<ul class="lst">';
 h+='<li><b>Outcome collection.</b> Real pass and fail data across students. Without it, every number here stays modelled.</li>';
 h+='<li><b>Item calibration.</b> With enough responses, each item gets a measured difficulty and discrimination, and weak items get retired. Right now difficulty is assigned by hand.</li>';
 h+='<li><b>Adaptive item selection.</b> Choosing the item that most reduces uncertainty about you requires calibrated items first.</li>';
 h+='<li><b>Regulatory change monitoring.</b> An operator watching the eCFR and FAA advisories, updating the bank, and re-verifying the dates in the source registry above.</li>';
 h+='<li><b>Cross-device progress.</b> Clearing your browser data clears your evidence.</li>';
 h+='</ul>';
 h+='<div class="call slatec"><span class="stamp">The honest summary</span><h3>Engineered for it. Not yet proven at it.</h3><p>The aggressive part is the design: full ACS coverage, a gate far stricter than the legal pass mark, unseen validation, decay, and anti-gaming. The conservative part is the measurement: no pass rate is printed, P(pass) is labelled as modelled, and the number of students required before a 99.9% claim is defensible is stated above rather than hidden.</p></div>';
 h+='</div>';
 return h;
}

function chartLabBody(){

 h+='<p>From 27 October 2026 chart images are embedded in questions and cannot be previewed. So this teaches a <b>procedure</b> you can run on a chart you have never seen.</p></div>';
 h+='<h3>Every number on a chart is MSL</h3>';
 h+='<p>Your 400 ft limit is <b>AGL</b>. Every altitude printed on a sectional is <b>MSL</b>: airspace floors and ceilings, obstruction tops, Maximum Elevation Figures. Converting between them is the most tested skill and the most exploited distractor. The FAA writes questions where two of three answers carry the same number and differ only in datum.</p>';
 h+='<div class="keys"><dl><dt>AGL equals</dt><dd>MSL minus ground elevation</dd><dt>Ground elevation from</dt><dd>the airport data block, terrain contours, or an obstruction\'s MSL top minus its parenthetical AGL height</dd></dl></div>';
 h+='<h3>Boundary styles</h3><div class="svgwrap">'+chartSVG()+'<p class="svgcap">Solid means a hard edge with a controller. Dashed magenta is the one people miss: Class E surface area needs authorization exactly like Class D. Vignettes are soft floors above you and need nothing.</p></div>';
 h+='<h3>Altitude notation</h3><div class="keys"><dl>';
 h+='<dt>Class B and C sectors</dt><dd>ceiling over floor</dd><dt>Units</dt><dd>hundreds of ft MSL, last two zeros dropped</dd>';
 h+='<dt><code>100/30</code></dt><dd>10,000 MSL over 3,000 MSL</dd><dt><code>41/SFC</code></dt><dd>4,100 MSL down to the surface</dd>';
 h+='<dt>Class D <code>[25]</code></dt><dd>ceiling 2,500 ft MSL</dd><dt>Class D <code>[−13]</code></dt><dd>to but <b>not including</b> 1,300 ft MSL</dd></dl></div>';
 h+='<p><b>SFC in the denominator means the airspace touches the ground</b>, so authorization is required at any altitude inside that boundary. That is frequently the whole question.</p>';
 h+='<h3>Obstructions and the MEF</h3><div class="svgwrap">'+obstSVG()+'<p class="svgcap">MEF covers a 30 by 30 minute quadrangle, rounded up to the next 100 ft, last two digits dropped. It includes a vertical error allowance plus 200 ft for uncharted obstacles, so it is conservative and is not a specific object on the chart.</p></div>';
 h+='<h3>Airport data block, in order</h3><div class="codebox"><code>COEUR D\'ALENE (COE)\nCT − 119.1 *   ATIS 135.075\n2320  L  75  122.8 Ⓒ\nRP 06</code></div>';
 h+='<div class="tw"><table><thead><tr><th>Item</th><th>Meaning</th></tr></thead><tbody>';
 h+='<tr><td><b>Print colour</b></td><td><b>Blue is towered. Magenta is non-towered.</b> Read the colour before anything else.</td></tr>';
 h+='<tr><td><code>CT − 119.1 *</code></td><td>Tower frequency. Asterisk means <b>part-time</b>.</td></tr>';
 h+='<tr><td><code>ATIS 135.075</code></td><td>Recorded information. Not a CTAF.</td></tr>';
 h+='<tr><td><code>2320</code></td><td>Field elevation in feet MSL. Use this for AGL math.</td></tr>';
 h+='<tr><td><code>L</code> / <code>*L</code></td><td>Lighting. Asterisk means limited hours or on request.</td></tr>';
 h+='<tr><td><code>75</code></td><td>Longest runway in <b>hundreds of feet</b>, rounded using 70 as the division point. 8,070 ft charts as 81.</td></tr>';
 h+='<tr><td><code>122.8 Ⓒ</code></td><td>Circled C marks the <b>CTAF</b>.</td></tr>';
 h+='<tr><td><code>RP 06</code></td><td><b>Right traffic</b> for runway 06. Otherwise assume left.</td></tr>';
 h+='</tbody></table></div>';
 h+='<div class="call warnc"><span class="stamp">The classic trap</span><h3>When a part-time tower closes</h3><p>The <b>tower frequency becomes the CTAF</b>. The offered wrong answer is 122.95, generic UNICOM. This appears in the FAA official new-format sample set.</p></div>';
 h+='<h3>The nine-step procedure</h3><ol class="num">';
 h+='<li><b>Read the caption.</b> After Oct 2026 each image names the chart and its 56-day validity window.</li>';
 h+='<li><b>Find the point.</b> Named airport, area arrow, or coordinates. Latitude north or south of the equator, longitude east or west of the Prime Meridian, degrees then minutes.</li>';
 h+='<li><b>Identify the innermost boundary</b> enclosing it, by line style and colour.</li>';
 h+='<li><b>Read the ceiling over floor fraction.</b> Hundreds of feet MSL. SFC means the ground.</li>';
 h+='<li><b>Convert to AGL</b> if the question asks about your limit. Subtract field or terrain elevation.</li>';
 h+='<li><b>Check overlays.</b> MOA and restricted hatching, MTR lines (count digits: four means at or below 1,500 AGL), and remember a TFR is never charted.</li>';
 h+='<li><b>Scan obstructions</b> in your radius. Top MSL, parenthetical AGL.</li>';
 h+='<li><b>Sanity check against the quadrangle MEF.</b></li>';
 h+='<li><b>Apply the authorization rule.</b> B, C, D, surface E need ATC. Nothing else does.</li></ol>';
 return h;
}

 ["3 statute miles","Minimum flight visibility","107.51"],["500 / 2,000 ft","Below / horizontal from clouds","107.51"],["0.55 lb (250 g)","Registration threshold and Category 1","Part 48 · 107.110"],

 ["3 years","Registration validity","Part 48"],["10 calendar days","Accident report deadline","107.9"],["$500","Property damage threshold","107.9"],
 ["8 hours / 0.04","Alcohol timing / max BAC","107.27"],["11 / 25 ft-lb","Category 2 / 3 impact energy","107.115 · 107.125"],["3 statute miles","Anti-collision light visibility","107.29"],

 h+='</tbody></table></div>';
 h+='<h2>The seven traps</h2><ul class="lst">';
 h+='<li><b>AGL vs MSL.</b> Your limit is AGL. Every charted altitude is MSL. Two answers will carry the same number.</li>';

 h+='<li><b>mph vs knots.</b> 100 mph is 87 knots. The question may state one and answer in the other.</li>';
 h+='<li><b>True vs magnetic.</b> METAR and TAF winds are true. Tower and ATIS winds are magnetic. Runway numbers are magnetic.</li>';
 h+='<li><b>Statute vs nautical.</b> Visibility is statute miles. Wind is knots.</li>';
 h+='<li><b>Hundreds of feet.</b> <code>OVC007</code> is 700 ft. <code>41/13</code> is 4,100 over 1,300. Runway <code>75</code> is 7,500 ft.</li>';
 h+='<li><b>True but not responsive.</b> Some distractors are correct statements that do not answer the question asked.</li></ul>';

 h+='<div class="keys"><dl><dt><code>UA</code></dt><dd>Unmanned Aircraft Systems</dd><dt><code>I</code></dt><dd>Area of Operation</dd><dt><code>B</code></dt><dd>Task</dd><dt><code>K10</code></dt><dd>Knowledge element</dd></dl></div>';
 h+='<h2>The process</h2><ol class="num">';
 h+='<li><b>IACRA account</b> at <a href="https://iacra.faa.gov/IACRA/" target="_blank" rel="noopener">iacra.faa.gov</a>. Register as Applicant, name exactly as on your photo ID. You get an FTN.</li>';
 h+='<li><b>Book at</b> <a href="https://faa.psiexams.com/faa/login" target="_blank" rel="noopener">faa.psiexams.com</a> using your FTN. Exam code <b>UAG</b>, not UGR. $175.</li>';
 h+='<li><b>ID must establish</b> photo, date of birth, signature and physical residential address. Multiple documents may be combined. No PO boxes.</li>';
 h+='<li><b>Test day.</b> Arrive 30 minutes early. 60 questions, 2 hours, 42 to pass. Answer everything.</li>';
 h+='<li><b>Photograph the test report</b> before leaving. The 17-digit exam ID is what you need next. Valid 24 calendar months.</li>';
 h+='<li><b>File Form 8710-13</b> in IACRA. Application Type Pilot, Certification Remote Pilot. Exam ID appears within 48 hours.</li>';
 h+='<li><b>TSA vetting</b> 3 to 7 days, then print your temporary certificate. It is valid immediately.</li>';
 h+='<li><b>Register aircraft</b> over 0.55 lb at <a href="https://faadronezone-access.faa.gov/" target="_blank" rel="noopener">FAADroneZone</a>, $5 each.</li>';
 h+='<li><b>Recurrent training</b> every 24 calendar months, free, at <a href="https://www.faasafety.gov/" target="_blank" rel="noopener">faasafety.gov</a>.</li></ol>';

}

  st.i=0;st.picked=null;st.conf=null;st.answers=[];st.recorded=0;st.shownAt=Date.now();render();return;
 }
 if(t.dataset.pick!==undefined&&st.picked===null){
  var q=st.order[st.i],pick=parseInt(t.dataset.pick,10),ok=(pick===q.a);
  var ms=Date.now()-st.shownAt;
  st.picked=pick;st.answers[st.i]=ok;
  var key=conceptOf(q);
  var first=!st.seen[key+"#"+(q.gen?"g":q.idx)];
  st.seen[key+"#"+(q.gen?"g":q.idx)]=1;
  /* generated items always count as fresh evidence; static items only on first attempt */
  if(q.gen||first)st.log.push({at:Date.now(),t:q.t,ok:ok?1:0,val:q.val?1:0,ms:ms,c:key});
  srsUpdate(st,key,ok,st.conf||"unsure");
  if(!ok&&st.conf==="certain"&&st.misconceptions.indexOf(key)<0)st.misconceptions.push(key);
  if(ok){var mi=st.misconceptions.indexOf(key);if(mi>=0)st.misconceptions.splice(mi,1)}
  save();render();return;
 }
 if(t.id==="nx"){st.i++;st.picked=null;st.conf=null;st.shownAt=Date.now();render();return}
 if(t.id==="setdate"){var v=document.getElementById("ed").value;if(v){st.examDate=v;save()}render();return}
});
render();

})();
</script>
