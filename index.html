<style id="app-style">
/* ============================================================
   PART 107 GROUND SCHOOL · DESIGN SYSTEM
   Layout: app shell. Glass top bar, 1100px content column, bento
   dashboard, fixed bottom tab bar on phones. Every colour and
   type decision below derives from these tokens.
   ============================================================ */
:root{
  /* colour · light: clear sky and navy ink */
  --bg:#F2F5F9;          --bg2:#E8EDF4;
  --surface:#FFFFFF;     --surface2:#F7F9FC;   --surface3:#EEF2F7;
  --glass:rgba(255,255,255,1);
  --ink:#0E1A2B;         --ink2:#2F3F55;       --muted:#5B6B81;
  --line:#D3DBE6;        --line2:#E4EAF2;
  --accent:#B45309;      --accent-ink:#FFFFFF; --accent-soft:#FDEFD9;
  --cyan:#0B6E8A;        --cyan-soft:#DDF1F6;
  --ok:#1E7A4B;          --ok-soft:#DCF2E6;
  --no:#B8321F;          --no-soft:#FBE3DF;
  --warn:#955409;        --warn-soft:#FBEFD8;
  --mag:#B0176B;         --blu:#1F4E8C;
  --paper:var(--bg);     --card:var(--surface); --card2:var(--surface2); --card3:var(--surface3);
  --slate:var(--cyan);   --slate-soft:var(--cyan-soft);
  --sh1:0 1px 2px rgba(14,26,43,.06),0 1px 1px rgba(14,26,43,.04);
  --sh2:0 2px 6px rgba(14,26,43,.07),0 10px 28px rgba(14,26,43,.08);
  --sh3:0 12px 40px rgba(14,26,43,.14);
  --sh:var(--sh2);
  /* type */
  /* web fonts load without blocking first paint; these system stacks carry the page until they
     arrive (or if Google Fonts is unreachable) and sit close to their x-height and width */
  --f-display:"B612","Instrument Sans",Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:"Instrument Sans",Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --f-mono:"B612 Mono",ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  /* motion */
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t1:140ms; --t2:260ms; --t3:480ms;
  /* radii */
  --r1:8px; --r2:12px; --r3:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#070C16;          --bg2:#0B1221;
  --surface:#0F172A;     --surface2:#141E33;   --surface3:#1A2640;
  --glass:rgba(15,23,42,1);
  --ink:#E7EEF8;         --ink2:#B7C4D8;       --muted:#7F8EA6;
  --line:#22304A;        --line2:#1A2539;
  --accent:#F5A623;      --accent-ink:#0B1221; --accent-soft:#2E220C;
  --cyan:#3DC6E6;        --cyan-soft:#0D2B36;
  --ok:#3FD58B;          --ok-soft:#0D2A1C;
  --no:#FF7A6B;          --no-soft:#331512;
  --warn:#F5A623;        --warn-soft:#2E220C;
  --mag:#F06AB2;         --blu:#78B0F0;
  --sh1:0 1px 2px rgba(0,0,0,.5);
  --sh2:0 2px 8px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.45);
  --sh3:0 16px 48px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070C16;          --bg2:#0B1221;
  --surface:#0F172A;     --surface2:#141E33;   --surface3:#1A2640;
  --glass:rgba(15,23,42,1);
  --ink:#E7EEF8;         --ink2:#B7C4D8;       --muted:#7F8EA6;
  --line:#22304A;        --line2:#1A2539;
  --accent:#F5A623;      --accent-ink:#0B1221; --accent-soft:#2E220C;
  --cyan:#3DC6E6;        --cyan-soft:#0D2B36;
  --ok:#3FD58B;          --ok-soft:#0D2A1C;
  --no:#FF7A6B;          --no-soft:#331512;
  --warn:#F5A623;        --warn-soft:#2E220C;
  --mag:#F06AB2;         --blu:#78B0F0;
  --sh1:0 1px 2px rgba(0,0,0,.5);
  --sh2:0 2px 8px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.45);
  --sh3:0 16px 48px rgba(0,0,0,.6);
}

/* ---------- reset and base ---------- */
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--cyan) 7%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;color:var(--ink)}
.mono,code{font-family:var(--f-mono)}
a{color:var(--cyan);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.svgwrap svg [data-hot]:focus-visible{outline:none}
.svgwrap svg [data-hot]:focus-visible>*:first-child{filter:drop-shadow(0 0 0 2px var(--cyan)) drop-shadow(0 0 5px var(--cyan))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{left:12px}
p{margin:0 0 15px}
button{font-family:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

/* ---------- app shell ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line)
}
.tbin{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand em{font-style:normal;color:var(--accent)}
.brand .mark{width:26px;height:26px;color:var(--accent);flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav button{
  font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease)
}
.nav button:hover{color:var(--ink);background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}

.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:0 96px}
/* Prose stays at a reading measure; grids of cards run the full width. */
.col{min-width:0}
.col>p,.col>h1,.col>h2,.col>h3,.col>h4,.col>ul,.col>ol,.col>.call,.col>.rulebox,.col>.trapbox,.col>.keys,.col>.decode,.col>.installbox,.col>.pbox,.col>.checks,.col>.result,.col>.qcard,.col>.scorebar,.col>.tw,.col>.fcwrap,.col>.fcnav,.col>.nextbox,.col>.chiprow,.col>.exp,.col>.srcbtn,.col>.scene,.col>.wxstage,.col>.wxctl,.col>.metarline,.col>#wxpanel,.col>#apstage,.col>#cgstage,.col>.daily,.col>.stats3,.col>.svgwrap,.col>.klegend,.col>.row,.col>.mut,.col>input[type=range],.col>.anat,.col>.kmap{max-width:76ch}
.col>.modes,.col>.achs,.col>.facts,.col>.gwrap,.col>.bento{max-width:none}
.hero.col{max-width:76ch}
.hero{padding:40px 0 10px}
.hero.col{padding-bottom:8px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:500;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--cyan);border-radius:2px;flex:none}
h1{font-size:clamp(30px,5vw,46px);line-height:1.06;letter-spacing:-.022em;margin-bottom:12px;max-width:20ch}
h2{font-size:26px;margin-bottom:8px}
h3{font-size:20px;margin:28px 0 8px}
h4{font-size:16.5px;margin:20px 0 6px;font-family:var(--f-body);font-weight:700}
.lede{font-size:17.5px;color:var(--ink2);max-width:60ch;margin:0;line-height:1.5;text-wrap:pretty}
.sublede{color:var(--muted);margin:0 0 20px;font-size:16px}
section{margin-top:40px}

/* bottom tab bar, phones */
.tabbar{display:none}
@media(max-width:767px){
  .tbin{min-height:50px;padding:0 16px;gap:8px}
  .brand{font-size:15.5px}
  .nav{display:none}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none
  }
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{
    flex:1 1 0;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:none;background:transparent;cursor:pointer;padding:7px 4px;font-size:10.5px;font-weight:600;color:var(--muted);line-height:1;white-space:nowrap;
    position:relative;transition:color var(--t1) var(--ease)
  }
  .tabbar button .ic{height:22px;line-height:1;display:grid;place-items:center;transition:transform var(--t2) var(--ease-out)}
  .tabbar button .ic svg{display:block}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button[aria-current="page"] .ic{transform:translateY(-1px) scale(1.08)}
  .tabbar button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:0 0 3px 3px;background:var(--accent)}
  .wrap{padding-inline:16px;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  body{font-size:16px}
  .hero{padding:18px 0 2px}
  .lede{font-size:15.5px}
  .ring{width:108px;height:108px}.ring .rv{font-size:22px}
  .tile{padding:15px 15px}
  h1{font-size:clamp(24px,6.8vw,30px)}
  h2{font-size:22px}h3{font-size:18.5px}
  .lede{font-size:16.5px}
}


/* ---------- sub-navigation inside a section ---------- */
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:14px 0 2px;margin:0 -16px;padding-inline:16px;position:sticky;top:calc(50px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg)}
.subnav::-webkit-scrollbar{display:none}
@media(min-width:768px){.subnav{margin:0;padding-inline:0;top:calc(58px + env(safe-area-inset-top,0px))}}
.subnav button{flex:none;font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:background var(--t1) var(--ease),color var(--t1) var(--ease),border-color var(--t1) var(--ease)}
.subnav button:hover{color:var(--ink);border-color:var(--line2)}
.subnav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subnav + .hero{padding-top:22px}

/* bookmark flag on the question card */
.bmbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:8px;width:34px;height:30px;font-size:16px;cursor:pointer;line-height:1;display:grid;place-items:center;transition:color var(--t1) var(--ease),background var(--t1) var(--ease)}
.bmbtn.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.qmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* exam clock */
.scorebar .clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.scorebar .clock.low{color:var(--no);animation:blinkLow 1s ease-in-out infinite}
@keyframes blinkLow{50%{opacity:.45}}
.kbd-hint{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;margin-left:10px;align-self:center}
@media(max-width:767px){.kbd-hint{display:none}}
.nextrow{display:flex;align-items:center}
.mode.on{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}

/* ---------- surfaces ---------- */
.card,.qcard,.pbox,.nextbox,.mode,.s3,.chk,.result,.gate,.keys,.tw,.codebox,.svgwrap,.installbox,.rulebox,.srcbtn,.figbox{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh1)
}
.call{
  border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);
  box-shadow:var(--sh1);padding:18px 20px;margin:22px 0;border-radius:0 var(--r2) var(--r2) 0
}
.call.warnc{border-left-color:var(--warn);background:var(--warn-soft)}
.call.slatec{border-left-color:var(--cyan);background:var(--surface)}
.call.okc{border-left-color:var(--ok);background:var(--ok-soft)}
.call h3{font-size:18px;margin:0 0 6px}
.call p:last-child{margin-bottom:0}
.call .stamp,.stamp{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--warn);margin-bottom:7px;display:block}
.call.slatec .stamp{color:var(--cyan)}.call.okc .stamp{color:var(--ok)}
.installbox{border-left:4px solid var(--cyan);border-radius:0 var(--r2) var(--r2) 0;padding:15px 16px;margin:18px 0}
.installbox b{display:block;font-size:16px;margin-bottom:5px}
.installbox p{margin:0 0 7px;font-size:14.5px;color:var(--ink2);line-height:1.5}
.installbox p:last-child{margin-bottom:0}

/* ---------- pills, tags, labels ---------- */
.cite{display:inline-flex;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.pill{font-family:var(--f-mono);font-size:10.5px;padding:3px 9px;border-radius:5px;background:var(--surface3);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.pill.reg{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.acs{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.pill.gen{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.val{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.faa{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:500}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;display:inline-block}
.tag.g{background:var(--ok-soft);color:var(--ok)}.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.n{background:var(--surface3);color:var(--muted)}
.mut{color:var(--muted);font-size:15px}

/* ---------- buttons ---------- */
.btn{
  font-weight:700;font-size:15px;min-height:46px;padding:12px 22px;border-radius:10px;border:none;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset,var(--sh1);
  transition:transform var(--t1) var(--ease),filter var(--t1) var(--ease),box-shadow var(--t1) var(--ease)
}
.btn:hover{filter:brightness(1.06);box-shadow:var(--sh2)}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:var(--sh1)}
.btn.gh{background:transparent;border:1.5px solid var(--line);color:var(--ink2);box-shadow:none}
.btn.gh:hover{border-color:var(--cyan);color:var(--cyan);filter:none}
.btn.sm{font-size:13px;min-height:36px;padding:8px 14px;margin-left:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nextrow{display:flex;gap:9px;margin-top:14px}.nextrow .btn{flex:1 1 auto}
@media(max-width:767px){
  .btn{width:100%}.row .btn{flex:1 1 100%}.btn.sm{width:auto;flex:0 0 auto}
}
.cbtn,.chip{
  font-weight:600;font-size:13.5px;min-height:40px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink2);cursor:pointer;transition:background var(--t1) var(--ease),color var(--t1) var(--ease),border-color var(--t1) var(--ease)
}
.cbtn:hover,.chip:hover{border-color:var(--cyan);color:var(--cyan)}
.cbtn.on,.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px}
.inp{font-family:var(--f-body);font-size:16px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:170px}
.inp:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--cyan)}

/* ---------- dashboard ---------- */
.pbox{display:flex;gap:22px;align-items:center;padding:22px 24px;margin:24px 0;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--surface),var(--surface2));box-shadow:var(--sh2)}
.pnum{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,60px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none}
.pnum.g{color:var(--ok)}.pnum.m{color:var(--warn)}.pnum.r{color:var(--no)}
.pmeta{flex:1 1 240px;min-width:0}
.pmeta b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.pmeta span{display:block;font-size:14.5px;color:var(--ink2);line-height:1.5}
.nextbox{border-left:4px solid var(--accent);border-radius:0 var(--r2) var(--r2) 0;padding:20px 22px;margin:20px 0;box-shadow:var(--sh2)}
.nextbox .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 7px}
.nextbox h3{margin:0 0 6px;font-size:21px}
.nextbox p{margin:0;color:var(--ink2);font-size:16px}
.nextbox .row{margin-top:15px}
.stats3{display:grid;gap:10px;margin:20px 0;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.stats3{grid-template-columns:repeat(4,1fr)}}
.s3{padding:14px 15px;min-width:0}
.s3 b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;margin-bottom:5px;font-variant-numeric:tabular-nums}
.s3 span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.35;display:block}
.s3.g b{color:var(--ok)}.s3.r b{color:var(--no)}
.grid5{display:grid;gap:9px;margin-top:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid5{grid-template-columns:repeat(5,1fr)}}

}

/* ---------- question card ---------- */
.qcard{padding:20px 18px;box-shadow:var(--sh2)}

.bento>:nth-child(2),.modes>:nth-child(2){animation-delay:.04s}.bento>:nth-child(3),.modes>:nth-child(3){animation-delay:.08s}.bento>:nth-child(4),.modes>:nth-child(4){animation-delay:.12s}.bento>:nth-child(5),.modes>:nth-child(5){animation-delay:.16s}.bento>:nth-child(6),.modes>:nth-child(6){animation-delay:.2s}.bento>:nth-child(n+7),.modes>:nth-child(n+7){animation-delay:.24s}

  transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease),transform var(--t1) var(--ease)
}
.opt:hover:not(:disabled){border-color:var(--cyan);background:var(--surface)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt:disabled{cursor:default}
.opt .ltr{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;padding-top:2px;width:14px}
.opt .otext{flex:1 1 auto;min-width:0}
.opt .mk2{flex:none;font-family:var(--f-mono);font-size:14px;font-weight:500;padding-top:1px;width:16px;text-align:center}
.opt.ok{border-color:var(--ok);border-width:2px;background:var(--ok-soft);animation:okPulse var(--t3) var(--ease-out)}
.opt.ok .ltr,.opt.ok .mk2{color:var(--ok)}
.opt.bad{border-color:var(--no);border-width:2px;background:var(--no-soft);animation:badShake var(--t3) var(--ease)}
.opt.bad .ltr,.opt.bad .mk2{color:var(--no)}
@keyframes okPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes badShake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* scorebar */

  transition:transform var(--t1) var(--ease),box-shadow var(--t1) var(--ease),border-color var(--t1) var(--ease)}

.abar .ab .v{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.streakcal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.streakcal i{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface3);border:1px solid var(--line2)}
.streakcal i.on{background:var(--ok);border-color:var(--ok)}
.streakcal i.today{outline:2px solid var(--accent);outline-offset:1px}

/* flashcards */
.fcwrap{perspective:1200px;margin:18px 0}
.fc{position:relative;min-height:220px;border-radius:var(--r3);transform-style:preserve-3d;transition:transform var(--t3) var(--ease-out);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r3);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh2)}
.fc .face.back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--surface),var(--accent-soft));border-color:var(--accent)}
.fc .fq{font-family:var(--f-display);font-size:19px;line-height:1.4;font-weight:600}
.fc .fa{font-size:16px;line-height:1.55;color:var(--ink);font-weight:600}
.fc .fk{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fcnav{display:flex;gap:9px;margin-top:12px}
.fcnav .btn{flex:1 1 auto}

/* achievements */
.achs{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin:16px 0}
@media(min-width:640px){.achs{grid-template-columns:repeat(4,1fr)}}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh1)}
.ach .ai{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface3);border:1px solid var(--line2)}
.ach.on .ai{background:linear-gradient(145deg,var(--accent),var(--warn));color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.ach b{font-size:13.5px;line-height:1.3}
.ach span{font-size:11.5px;color:var(--muted);line-height:1.35}
.ach:not(.on){opacity:.55}

/* knowledge map */
.kmap{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));margin:14px 0}
.kmap i{display:block;aspect-ratio:1;border-radius:5px;background:var(--surface3);border:1px solid var(--line2);position:relative}
.kmap i.l1{background:color-mix(in srgb,var(--cyan) 35%,var(--surface3))}
.kmap i.l2{background:color-mix(in srgb,var(--cyan) 70%,var(--surface3))}
.kmap i.l3{background:var(--ok);border-color:var(--ok)}
.kmap i.weak{background:var(--no);border-color:var(--no)}
.klegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.klegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line2)}

/* missions */
.scene{border-radius:var(--r3);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh2);margin:16px 0;background:var(--surface)}
.scene svg{display:block;width:100%;height:auto}
.scene .sbody{padding:18px 20px}
.mhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mhead .mnum{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.xpbar{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.xpbar .t{flex:1 1 100px;height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;border:1px solid var(--line2)}
.xpbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width var(--t3) var(--ease-out)}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px;line-height:1.45;cursor:pointer;min-height:52px;margin-bottom:9px;transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease)}
.choice:hover:not(:disabled){border-color:var(--cyan);background:var(--surface)}
.choice:disabled{cursor:default}
.choice.good{border-color:var(--ok);border-width:2px;background:var(--ok-soft)}
.choice.bad{border-color:var(--no);border-width:2px;background:var(--no-soft)}
.choice.meh{border-color:var(--warn);border-width:2px;background:var(--warn-soft)}
.choice .cl2{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;width:14px}
.outcome{margin-top:14px;padding:16px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);animation:cardIn var(--t3) var(--ease-out) both}
.outcome.good{border-left:4px solid var(--ok)}.outcome.bad{border-left:4px solid var(--no)}.outcome.meh{border-left:4px solid var(--warn)}
.outcome .oh{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.outcome.good .oh{color:var(--ok)}.outcome.bad .oh{color:var(--no)}.outcome.meh .oh{color:var(--warn)}
.outcome p{margin:0 0 8px;font-size:15.5px;color:var(--ink2)}.outcome p:last-child{margin:0}
.complete{text-align:center;padding:34px 20px;border-radius:var(--r3);background:linear-gradient(160deg,var(--surface),var(--accent-soft));border:1px solid var(--accent);box-shadow:var(--sh3);animation:cardIn var(--t3) var(--ease-out) both;position:relative;overflow:hidden}
.complete .cbig{font-family:var(--f-display);font-size:48px;font-weight:700;line-height:1;margin:8px 0}
.complete .cxp{font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.complete::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 80%,color-mix(in srgb,var(--accent) 18%,transparent) 90%,transparent 100%);animation:spin 6s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.complete>*{position:relative}

/* lessons inside Learn */
.lesson{margin:26px 0;padding:18px 18px 16px;border-radius:var(--r3);border:1px solid var(--line);background:linear-gradient(160deg,var(--surface),var(--surface2));box-shadow:var(--sh2)}
.lshead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.lshead h3{margin:0}
.lstag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--cyan);color:#fff;padding:4px 8px;border-radius:4px;font-weight:700}
.lsrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lsscore{font-family:var(--f-mono);font-size:12px;color:var(--muted)}.lsscore b{color:var(--ink);font-size:14px}
.chiprow.big .chip{min-height:46px;font-size:15px;padding:10px 16px}
.chip.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}.chip.bad{border-color:var(--no);background:var(--no-soft);color:var(--ink)}
.lesson .daily{margin:16px 0 10px}
@media(max-width:520px){.lesson{padding:14px 12px 12px;margin-inline:-4px}}

/* go / no-go job card */
.jobcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh1);margin:12px 0}
.jobcard dl{display:grid;grid-template-columns:minmax(88px,max-content) minmax(0,1fr);gap:0 14px;margin:0}
.jobcard dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line2)}
.jobcard dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line2);font-size:15px;min-width:0}
.jobcard dd i{font-style:normal;font-weight:700;margin-right:8px}.jobcard dd i.g{color:var(--ok)}.jobcard dd i.w{color:var(--warn)}.jobcard dd i.n{color:var(--no)}
.jobcard dd small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.jobcard dl>:nth-last-child(-n+2){border-bottom:none}
@media(max-width:480px){.jobcard dl{grid-template-columns:1fr}.jobcard dt{padding-bottom:0;border-bottom:none}.jobcard dd{padding-top:2px}}


/* ---------- focused quiz mode ---------- */
.quizmode .topbar,.quizmode .tabbar{display:none}
.quizmode .wrap{padding-top:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.quizmode .foot{display:none}
.quiz{max-width:720px;margin:0 auto}
.quizbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:12px;padding:10px 0;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);margin-bottom:12px}
.quizbar .qx{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:14px;cursor:pointer;display:grid;place-items:center}
.quizbar .qx:hover{border-color:var(--no);color:var(--no)}
.qprog{flex:1;height:6px;border-radius:99px;background:var(--surface3);overflow:hidden;border:1px solid var(--line2)}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--accent));transition:width var(--t3) var(--ease-out)}
.quizbar .qn{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}.quizbar .qn b{color:var(--ink);font-size:15px}
.quizbar .qs{font-family:var(--f-mono);font-size:12.5px;color:var(--ok);flex:none;font-variant-numeric:tabular-nums}
.quizbar .clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink);font-weight:600;flex:none}
.quizbar .clock.low{color:var(--no);animation:blinkLow 1s ease-in-out infinite}
.fb{margin-top:14px;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);border-left-width:4px;animation:cardIn var(--t2) var(--ease-out) both}
.fb.ok{border-left-color:var(--ok)}.fb.no{border-left-color:var(--no)}
.fbh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fbv{font-family:var(--f-display);font-weight:700;font-size:16px}.fb.ok .fbv{color:var(--ok)}.fb.no .fbv{color:var(--no)}
.fbtag{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--no);background:var(--no-soft);padding:3px 8px;border-radius:4px}
.fbx{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink2)}.fbx b{color:var(--ink)}
.more{margin-top:10px;border-top:1px solid var(--line2);padding-top:8px}
.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--cyan);list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform var(--t1) var(--ease);flex:none;margin-left:2px}
.more[open] summary::before{transform:rotate(45deg)}
.more .why{margin-top:10px}
.more .rulebox,.more .trapbox{margin-top:10px}
.more .srcbtn{margin-top:10px}
.qact{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);transition:transform var(--t2) var(--ease-out);background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.qact.show{transform:none}
.qact .qin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.qact .btn{flex:1;min-height:50px;font-size:16px}
.qact .kbd-hint{margin-left:10px;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent);opacity:.8}
.qhint{font-size:13.5px;color:var(--muted)}
.rev{margin:12px 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.revopt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14.5px;margin:4px 0;border:1px solid transparent}
.revopt.ok{background:var(--ok-soft);border-color:var(--ok)}.revopt.bad{background:var(--no-soft);border-color:var(--no)}
.revopt .ltr{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;width:14px;padding-top:2px}
.revx{font-size:14.5px;color:var(--ink2);margin:8px 0}
@media(max-width:767px){
  .qcard{padding:16px 14px;border-radius:var(--r2)}
  .q{font-size:17px;margin-bottom:12px}
  .opt{padding:12px 13px;font-size:15.5px;min-height:48px}
  .confrow{margin-bottom:10px}.confrow .cl{font-size:10px}
  .cbtn{padding:7px 11px;font-size:13px;min-height:34px}
  .quizmode .wrap{padding-inline:12px}
  .quizbar{margin-bottom:8px}
  .fb{padding:12px 13px}
}
@media(max-height:620px){.q{font-size:16px}.opt{min-height:44px;padding:10px 12px}.qcard{padding:14px 12px}}

/* ---------- first screen ---------- */
.welcome{display:grid;gap:28px;align-items:center;padding:34px 0 10px}
@media(min-width:900px){.welcome{grid-template-columns:1.05fr .95fr;gap:40px;padding:48px 0 18px}}
.wh1{font-size:clamp(32px,5.2vw,54px);line-height:1.04;letter-spacing:-.025em;margin:0 0 16px;max-width:14ch}

.wcta{gap:10px}.btn.lg{min-height:52px;font-size:16px;padding:12px 22px}

@media(min-width:720px){.wstrip{grid-template-columns:repeat(3,1fr);gap:24px}}
.wstrip div{display:flex;flex-direction:column;gap:3px;min-width:0}
.wstrip b{font-family:var(--f-display);font-size:20px;color:var(--accent)}.wstrip span{font-size:13.5px;color:var(--muted)}
/* view transition: one fade and lift per navigation, none on in-place updates */

@media(prefers-reduced-motion:reduce){#app.vt>*{animation:none}.herosvg .craft,.herosvg .hud{animation:none}}

/* today plan and backup */

.todo li.done{opacity:.6}
.todo .tk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--surface3);color:var(--ink)}
.todo li.done .tk{background:var(--ok);color:#fff}
.todo .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.todo .tt b{font-size:14.5px}.todo .tt span{font-size:12.5px;color:var(--muted)}
.todo .btn{width:auto;flex:none}
.codearea{width:100%;min-height:96px;font-family:var(--f-mono);font-size:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:10px 0;resize:vertical;overflow-wrap:anywhere}
.inl{display:flex;align-items:center;gap:8px;font-size:14.5px}
@media(max-width:520px){.todo li{flex-wrap:wrap}.todo .btn{margin-left:40px}}

/* real FAA figures */
[hidden]{display:none!important}
.figcard{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh1)}
.figthumb{display:block;width:100%;border:none;padding:0;background:var(--surface2);cursor:zoom-in;max-height:420px;overflow:hidden}

.figtile:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.figtile img{width:100%;flex:1;object-fit:cover;object-position:top;min-height:0}
.figtile span{font-family:var(--f-mono);font-size:10.5px;padding:5px 6px;color:var(--ink);background:var(--surface2);border-top:1px solid var(--line2)}
.figmiss2{flex:1;display:grid;place-items:center;font-size:11px;color:var(--muted)}

.figbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.figbar .fz{display:flex;gap:4px}.figbar .figx{font-size:16px;width:40px}

/* mission 1 */
.sim{display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--warn);color:var(--accent-ink);padding:3px 8px;border-radius:4px;font-weight:700}

.m1steps li{position:relative;padding-top:8px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m1steps li::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:2px;background:var(--surface3)}
.m1steps li.done::before{background:var(--ok)}.m1steps li.cur::before{background:var(--accent)}
.m1steps li.cur{color:var(--ink);font-weight:700}
.brieftbl{display:grid;gap:8px;margin:12px 0 14px}
.brieftbl div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:14.5px;border-bottom:1px solid var(--line2);padding:8px 0}
.brieftbl b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.metarbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--sh1)}
.metarbox .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.metarbox .mt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.m1tok{display:flex;gap:4px;flex-wrap:wrap;white-space:normal;overflow:visible;padding:8px}
.m1tok .tok{font:inherit;font-family:var(--f-mono);font-size:14px;color:var(--bg);background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;cursor:pointer;min-height:40px;transition:background var(--t1) var(--ease)}
.m1tok .tok:hover{border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.m1tok .tok.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.laanc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;margin:8px 0 14px;box-shadow:var(--sh1)}
.laanc label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}.laanc label span{float:right;font-family:var(--f-mono);color:var(--accent)}
.chklist{display:grid;gap:8px;margin:14px 0}
.chk2{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;cursor:pointer;transition:border-color var(--t1) var(--ease),background var(--t1) var(--ease)}
.chk2 .bx{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-ink)}
.chk2.on{border-color:var(--accent);background:var(--accent-soft)}.chk2.on .bx{background:var(--accent);border-color:var(--accent)}
.chk2.req.on{border-color:var(--ok);background:var(--ok-soft)}.chk2.req.on .bx{background:var(--ok);border-color:var(--ok)}
.chk2.req:not(.on){border-color:var(--no);border-style:dashed}
.chk2.not.on{border-color:var(--no);background:var(--no-soft)}.chk2.not.on .bx{background:var(--no);border-color:var(--no)}
.chk2 .ct small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.chk2:disabled{cursor:default}
.m1timer{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--no);height:14px}
.m1timer i{display:block;flex:1;height:6px;border-radius:3px;background:var(--no);transition:width .1s linear}
.m1scene .heli{animation:heliX 6s linear -1.5s infinite}
@keyframes heliX{from{transform:translate(-60px,124px)}to{transform:translate(500px,108px)}}
.m1scene .drone .rise{animation:rise 1.8s var(--ease-out) both}
@keyframes rise{from{transform:translateY(170px)}to{transform:none}}
.stars{font-size:30px;letter-spacing:4px;color:var(--accent);margin:4px 0 10px}.stars span{color:var(--line2)}
.debrief{display:grid;gap:10px;margin:12px 0 18px}
.drow{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:var(--r2);padding:12px 14px}
.drow.good{border-left-color:var(--ok)}.drow.meh{border-left-color:var(--warn)}.drow.bad{border-left-color:var(--no)}
.drow .dh{display:flex;gap:10px;align-items:baseline;font-size:14.5px}.drow .dp{font-family:var(--f-mono);font-size:12px;font-weight:700;flex:none}
.drow.good .dp{color:var(--ok)}.drow.meh .dp{color:var(--warn)}.drow.bad .dp{color:var(--no)}
.drow p{margin:6px 0;font-size:14px;color:var(--ink2)}.drow a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.m1brief .sbody{padding:20px}
@media(max-width:520px){.m1steps li{font-size:9.5px}.brieftbl div{grid-template-columns:1fr}}

/* weather lab */
.wxstage{border-radius:var(--r3);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh2);margin:16px 0}
.wxstage svg{display:block;width:100%;height:auto}
.wxctl{display:grid;gap:12px;margin:14px 0}
@media(min-width:640px){.wxctl{grid-template-columns:1fr 1fr}}
.wxctl label{display:block;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.wxctl label span{float:right;font-family:var(--f-mono);font-weight:500;color:var(--accent);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;touch-action:pan-y}
.metarline{font-family:var(--f-mono);font-size:14px;padding:12px 14px;background:var(--ink);color:var(--bg);border-radius:10px;overflow-x:auto;white-space:nowrap;letter-spacing:.02em}

/* drone anatomy */
.frame{transform-box:fill-box;transform-origin:center}
.pose-yaw{animation:poseYaw .7s var(--ease-out) both}
.pose-pitch{animation:posePitch .7s var(--ease-out) both}
.pose-roll{animation:poseRoll .7s var(--ease-out) both}
.pose-pitchback{animation:posePitchB .7s var(--ease-out) both}.pose-rollleft{animation:poseRollL .7s var(--ease-out) both}.pose-yawright{animation:poseYawR .7s var(--ease-out) both}.pose-climb{animation:poseClimb .7s var(--ease-out) both}.pose-descend{animation:poseDesc .7s var(--ease-out) both}
@keyframes posePitchB{from{transform:none}to{transform:perspective(500px) rotateX(-38deg)}}
@keyframes poseRollL{from{transform:none}to{transform:perspective(500px) rotateY(-38deg)}}
@keyframes poseYawR{from{transform:rotate(0)}to{transform:rotate(22deg)}}
@keyframes poseClimb{from{transform:none}to{transform:scale(1.14)}}
@keyframes poseDesc{from{transform:none}to{transform:scale(.86)}}
@keyframes poseYaw{from{transform:rotate(0)}to{transform:rotate(-22deg)}}
/* virtual transmitter */
.tx{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0}
.stick{position:relative;aspect-ratio:1;max-width:190px;margin:0 auto;width:100%;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--surface2),var(--surface3));border:1px solid var(--line2);box-shadow:inset 0 2px 8px rgba(0,0,0,.08)}
.stick .knob{position:absolute;left:50%;top:50%;width:30%;height:30%;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);transition:transform var(--t2) var(--ease-out);box-shadow:var(--sh2)}
.stick .knob::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--accent)}
.stick button{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh1);transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.stick button:hover{background:var(--accent);color:var(--accent-ink)}
.stick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stick .u{left:50%;top:-6px;transform:translateX(-50%)}.stick .d{left:50%;bottom:-6px;transform:translateX(-50%)}.stick .l{top:50%;left:-6px;transform:translateY(-50%)}.stick .r{top:50%;right:-6px;transform:translateY(-50%)}
.stick .lbl{position:absolute;left:50%;bottom:-32px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.txwrap{padding-bottom:28px}
@media(max-width:420px){.stick{max-width:150px}.stick button{width:40px;height:40px}}
@keyframes posePitch{from{transform:none}to{transform:perspective(500px) rotateX(38deg)}}
@keyframes poseRoll{from{transform:none}to{transform:perspective(500px) rotateY(38deg)}}
.anat{display:grid;gap:14px}
@media(min-width:760px){.anat{grid-template-columns:1.2fr 1fr;align-items:start}}
.anat .svgwrap{padding:4px}

/* daily */
.daily{background:linear-gradient(135deg,var(--surface),var(--cyan-soft));border:1px solid var(--cyan);border-radius:var(--r3);padding:18px 20px;margin:18px 0;box-shadow:var(--sh2)}
.daily .dl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}

/* toasts for achievements */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:90;opacity:0;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--sh3);font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center;max-width:min(92vw,420px);
  transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease-out);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:768px){.toast{bottom:28px}}
.quizmode .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* motion preference */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fc{transition:none}}

/* ===== Phoenix WP1: shuffle, content, import ===== */
.confhint{font-size:13px;line-height:1.4;color:var(--muted);margin:-6px 0 12px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;cursor:pointer}
.linkbtn:hover{color:var(--accent)}

/* ===== Phoenix WP2: layout and quiz usability ===== */
/* Next bar is pinned to the viewport; nothing above it may carry a transform */
.quiz{transform:none}
.qact{bottom:0}
/* toasts sit at the top, under the header or the quiz bar, never over the Next bar or primary buttons */
.toast{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;transform:translateX(-50%) translateY(-12px);font-size:13px;padding:8px 14px;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(min-width:768px){.toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto}}
.quizmode .toast{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto}
/* reviewer additions for the mission screens */
.m1timer b{flex:none;min-width:5ch;text-align:right;font-weight:700}
.complete.notpassed .cxp{color:var(--warn)}
.complete .mvl{margin:8px 0 0}
.m1top h1.mnum{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0;font-weight:700;line-height:1.3}
@media(max-width:520px){.wxstage{position:sticky;z-index:3;background:var(--bg)}}
.toast.act{pointer-events:auto;cursor:pointer;border:0;font:inherit;font-weight:600;font-size:14.5px}
/* tables become stacked records on phones: label above (or before) each value, read left to right */
@media(max-width:640px){
  .tw{overflow-x:visible}
  .tw table{display:block;min-width:0;width:100%}
  .tw thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .tw tbody,.tw tr,.tw td{display:block;width:auto;min-width:0}
  .tw tr{padding:11px 14px;border-bottom:1px solid var(--line2)}
  .tw tbody tr:last-child{border-bottom:none}
  .tw td,.tw tbody tr:last-child td{padding:2px 0;border:0;text-align:left}
  .tw td[data-label]::before{content:attr(data-label);display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:7px 0 1px}
  .tw td:first-child[data-label]::before{margin-top:0}
  .tw td.tdi[data-label]::before{display:inline;margin:0 6px 0 0;content:attr(data-label) ":"}
  .tw td.tdi:not(:first-child){margin-top:4px}
  /* eyebrow-style labels: tighter tracking so a label never orphans one word per line */
  .eyebrow,.stamp,.call .stamp,.tile .tl,.mode .badge,.fk,.s3 span,.pmeta b,.nextbox .lbl,.rail .rl,.srcbtn .sl,.rulebox .rl2,.trapbox .rl2,.wrow .vb,.result .verdict,.confrow .cl,thead th{letter-spacing:.08em}
}
/* feedback: "Why each choice" stays reachable but closed on short screens */
.more summary{min-height:44px}
/* focus: confidence buttons get a visible ring like every other control */
.cbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* 44 px hit areas for the quiz close and bookmark controls; the drawn button stays the same size */
.quizbar .qx{position:relative}
.quizbar .qx::after,.bmbtn::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.bmbtn{position:relative}
/* quiz and results headings: small, for structure and screen readers */
.qh1{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;max-width:none;line-height:1.3}
.result .rh1{font-size:clamp(22px,5vw,28px);margin:0 0 10px;max-width:none}
/* figure questions on phones: a compact strip above the stem; full size lives in the viewer */
.figview{display:none}
@media(max-width:767px){
  .quiz .figcard{margin:0 0 12px}
  .quiz .figthumb{position:relative;max-height:120px;height:120px}
  .quiz .figthumb img{height:120px;max-height:120px;object-fit:cover;object-position:center 30%}
  .quiz .figview{display:flex;align-items:center;justify-content:center;position:absolute;right:8px;bottom:8px;min-height:46px;padding:0 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
  .quiz .figcard figcaption{padding:8px 12px;font-size:13px}
  .quiz .figcard figcaption span{display:none}
}
/* sub-navigation: fade the edge and let the next tab peek so hidden tabs are discoverable */
@media(max-width:767px){
  .subnav{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);padding-right:40px}
  .subnav.atend{-webkit-mask-image:none;mask-image:none}
  .subnav button{min-height:40px}
}
/* readiness ring when the evidence is thin */
.ring.muted .arc{stroke:var(--muted)!important;opacity:.55}
.ring.muted .rv{color:var(--muted)}
.ring .rv small{display:block;font-size:11px;font-family:var(--f-mono);font-weight:500;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.prov{display:inline-block;font-size:13px;font-weight:600;color:var(--warn);margin-top:6px}
.fastnote{font-size:13px;color:var(--muted);margin:8px 0 0}
/* quit confirmation inside the quiz bar */
.qconfirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;background:var(--warn-soft)}
.qconfirm p{margin:0;flex:1 1 180px;font-size:14px;color:var(--ink)}
.qconfirm .btn{min-height:44px;width:auto}
/* storage warning banner */
.storewarn{margin:12px 0 0}
.fbh h2.fbv{margin:0;line-height:1.3}
.fb>.rulebox{margin-top:10px}
.figoff{padding:16px;font-size:14px;line-height:1.45;color:var(--ink2);background:var(--warn-soft);text-align:left}
.figtile .figoff{padding:8px;font-size:11px}
.figpane .figoff{margin:16px;border-radius:10px}
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.fbrow .mut{font-size:13.5px;flex:1 1 220px;min-width:0}
.fbrow .chip{min-height:44px}
@media(max-width:380px){.ach{padding:12px 8px}.ach b{font-size:13px}}
.toast.act{padding:0}
.toastbtn{background:none;border:0;color:inherit;font:inherit;font-weight:600;padding:12px 18px;min-height:44px;cursor:pointer;border-radius:12px}
.ring .rv.rng{font-size:18px;line-height:1.1;text-align:center;padding:0 16px}
@media(max-width:767px){.ring .rv.rng{font-size:15.5px;padding:0 12px}}
.pnum.rng{font-size:clamp(32px,6.5vw,48px)}
.pnum.n{color:var(--muted)}
.pmeta .prov{display:block}
.buildline{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
/* programmatic focus targets (stem, verdict, results heading) are not controls: no ring */
#qstem:focus,#fbh:focus,#resh:focus{outline:none}
.qconfirm p{flex:1 1 100%}
.qconfirm .btn{flex:1 1 0}
.ring .rv.none{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);line-height:1.2;padding:0 14px}

/* ===== Phoenix WP7: question bank loads after first paint (site build) ===== */
.qbload{margin:18px 0;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r2);background:var(--surface2);font-size:14.5px;color:var(--ink2);max-width:76ch}
.qbload.warn{border-style:solid;border-left:4px solid var(--warn);background:var(--warn-soft)}
.qbload p{margin:0 0 10px}
.qbload .btn{margin-left:0}

/* ===== Phoenix WP6: premium visual system (targeted corrections) ===== */
/* small-text tokens: same hues as the palette, a step darker in light so 10 to 15 px text on the
   soft fills clears 4.5:1; dark keeps the main tokens, which already clear it */
:root{--accent-sm:#9C4507;--ok-sm:#1A6B42;--warn-sm:#955409;--no-sm:#A82D1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent-sm:var(--accent);--ok-sm:var(--ok);--warn-sm:var(--warn);--no-sm:var(--no)}}
:root[data-theme="dark"]{--accent-sm:var(--accent);--ok-sm:var(--ok);--warn-sm:var(--warn);--no-sm:var(--no)}

/* 1. brand mark: drawn navy tile, so only a hairline edge for the dark header */
.brand .mark{width:24px;height:24px;border-radius:6px;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}

/* 2. instrument language: numeric readouts in the mono face, tabular figures, units muted */
.ro{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap;letter-spacing:0}
.ro .u{font-size:.8em;font-weight:400;color:var(--muted);margin-left:.05em;white-space:pre}
.quizbar .qn.ro b{font-size:15px}
.quizbar .qs.ro .u{color:var(--ok);font-size:.9em}
.ring .rv{font-family:var(--f-mono);letter-spacing:-.03em}
.ring .rv.none{font-family:var(--f-body);letter-spacing:0}
.s3 b.ro{font-family:var(--f-mono);font-size:24px}
.tile .tv .ro .u{font-family:var(--f-body);font-size:14px}
.strip b.ro{font-size:14px}
.abar .ab .v{font-size:13px}
.xpbar{font-size:13px}
.m1score.ro b{font-size:15px;color:var(--ink)}
.wxctl label span .u{color:var(--muted)}
.tw td .ro{font-size:14px;font-weight:700}
.tw td .ro.g{color:var(--ok)}.tw td .ro.m{color:var(--warn)}.tw td .ro.r{color:var(--no)}

/* 3. results: label left, value right, one baseline, fixed value column at every width.
   The old misalignment: a red value carried class "r", so the row rule (.brk .r) also made the
   value a padded, bordered flex box. Rows are now matched as children and values say pass/miss. */
.brk>.r{display:grid;grid-template-columns:minmax(0,1fr) 6.5em;align-items:baseline;column-gap:12px}
.brk>.r>.n{min-width:0;text-align:left}
.brk>.r>.v{text-align:right;justify-self:end;font-size:15px}
.brk .v.pass{color:var(--ok)}.brk .v.miss{color:var(--no)}

/* 4. dashboard: one entrance motion (the readiness sweep); captions 13 px, tile labels 11 px */
.bento>.tile,.modes>.mode,.achs>.ach{animation:none}
.ring .arc{animation:ringSweep 1.1s var(--ease-out) .1s both}
@keyframes ringSweep{from{stroke-dashoffset:339.3}}
.tile .tl{font-size:11px}
.todo{gap:0}
.todo li{background:none;border:0;border-radius:0;border-top:1px solid var(--line2);padding:12px 2px}
.todo li:first-child{border-top:0;padding-top:4px}
.todo li:last-child{padding-bottom:2px}
.todo li.done{opacity:1}
.todo li.done .tt b{color:var(--muted)}
.todo .tt span{font-size:13px}
.ach span{font-size:13px}
.klegend{font-size:13px}
.fastnote,.prov{font-size:13px}

/* 5. welcome: on phones the illustration sits above the headline at 160 px; desktop unchanged */
@media(max-width:899px){
  .welcome{padding-top:14px;gap:14px}
  .welcome .wart{order:-1;display:flex;justify-content:center}
  .welcome .herosvg{height:160px;width:auto;max-width:100%}
}
.eyebrow{text-wrap:balance}
@media(max-width:640px){.eyebrow{letter-spacing:.08em}}

/* 6. one HUD strip: mono readouts pinned to the edges (missions, timed nodes, Weather Lab) */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;margin:12px 0;padding:9px 14px;border-radius:var(--r2);background:var(--ink);color:var(--bg);font-family:var(--f-mono)}
.hud .hc{display:flex;flex-direction:column;gap:2px;min-width:0}
.hud .hc:last-child{align-items:flex-end;text-align:right}
.hud .hc>i{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 72%,var(--ink));line-height:1.2}
.hud .ro{font-size:15px;font-weight:700;color:var(--bg);line-height:1.25}
.hud .ro .u{color:color-mix(in srgb,var(--bg) 72%,var(--ink))}
.hud .ro.low{color:var(--accent-soft)}
.scene>.hud{margin:0;border-radius:0}
.hudt{flex-wrap:nowrap;margin:10px 0 0}
.hudt .hc{flex:none}
.hudt .tbar{flex:1 1 auto;min-width:48px;height:6px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--bg) 22%,var(--ink))}
.hudt .tbar i{display:block;height:100%;background:var(--no);transition:width .1s linear}
.hudt #m1secs{min-width:5ch;text-align:right}
/* go / caution / no-go */
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.2;padding:4px 10px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.stat.ok{color:var(--ok-sm);background:var(--ok-soft)}
.stat.warn{color:var(--warn-sm);background:var(--warn-soft)}
.stat.no{color:var(--no-sm);background:var(--no-soft)}
.hud .stat{font-size:11px;padding:3px 9px}
/* readiness, per area */
.arows{margin:14px 0 26px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);box-shadow:var(--sh1);max-width:76ch}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:14px;padding:11px 16px;border-top:1px solid var(--line2)}
.arow:first-child{border-top:0}
.arow .n{min-width:0;font-weight:600;font-size:15px;line-height:1.3}
.arow .n small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.arow>.ro{font-size:15px;font-weight:700;text-align:right;min-width:4ch}
.arow .stat{justify-self:end}
@media(max-width:400px){.arow{padding:10px 12px;column-gap:10px}}
/* mission header: the title takes its own line so it never breaks word by word */
.m1top h1.mnum{flex:1 1 100%;max-width:none;letter-spacing:.1em}
.m1top .m1score{margin-right:auto}

/* 7. small-text contrast (axe) and heading structure */
.pill.reg,.pill.gen{color:var(--accent-sm)}
.rail button[aria-current="true"]{color:var(--accent-sm)}
.srcbtn .sl{opacity:1}
.qact .kbd-hint{opacity:1}
h2.h3{font-size:20px;margin:28px 0 8px}
.call h2.h3{font-size:18px;margin:0 0 6px}
@media(max-width:767px){h2.h3{font-size:18.5px}.call h2.h3{font-size:18px}}
/* phones: five readouts become a 3 x 2 grid, the call chip at the right edge; four go 2 x 2 under 360 px */
@media(max-width:520px){
  .hud.hud5{display:grid;grid-template-columns:repeat(3,minmax(0,auto));justify-content:space-between;row-gap:8px}
  .hud.hud5 .hc:nth-child(3n+2){align-items:center;text-align:center}
  .hud.hud5 .hc:nth-child(3n){align-items:flex-end;text-align:right}
  .hud.hud5 .hc:nth-child(5){grid-column:3;align-items:flex-end;text-align:right}
}
@media(max-width:360px){
  .hud.hud4{display:grid;grid-template-columns:repeat(2,minmax(0,auto));justify-content:space-between;row-gap:8px}
  .hud.hud4 .hc:nth-child(2n){align-items:flex-end;text-align:right}
}
/* slider readouts: only the outer readout floats right; its number and unit spans stay inline */
.wxctl label span span{float:none}
.ring .rv.rng{font-size:16px;letter-spacing:-.04em;padding:0 14px}
@media(max-width:767px){.ring .rv.rng{font-size:14.5px;padding:0 10px}}
.tile.lone .ringrow>div:last-child{max-width:60ch}
.col>.hud,.col>.choice{max-width:76ch}
.todo .tk{font-size:13px}
@media(max-width:400px){.result{padding:26px 16px}}
/* locked achievements: muted colours instead of a 55% fade, so their text keeps 4.5:1 */
.ach:not(.on){opacity:1}
.ach:not(.on) .ai{opacity:1;color:var(--muted)}
.ach:not(.on) b{color:var(--ink2)}
.ach:not(.on) span{color:var(--muted)}

/* ============================================================
   LAB KIT · stage, labels, controls, explain and predict cards
   The instrument stage is a deep-navy glass-cockpit panel in both
   themes: one consistent "screen" for every simulation. The paper
   stage is chart paper for sectional-style drawings and follows
   the theme. Sectional colours are literal on paper because on a
   real chart the colour is the information.
   ============================================================ */
:root{
  --lk-stage:#0B1524; --lk-stage2:#101D31; --lk-grid:rgba(120,160,210,.10);
  --lk-ink:#E8EEF7; --lk-dim:#9AACC4; --lk-line:rgba(160,190,230,.28);
  --lk-cyan:#3FC1E0; --lk-orange:#F5A623; --lk-ok:#3CCB7F; --lk-warn:#F2C14E; --lk-no:#FF6B5B;
  --lk-sky1:#13294A; --lk-sky2:#0D1B30; --lk-ground:#1A2A1E; --lk-ground2:#22382A;
  --lk-B:#5B9BFF; --lk-C:#E0559B; --lk-D:#5B9BFF; --lk-E:#D86AAE; --lk-G:#9AACC4;
  --lk-halo:#0B1524;
  /* paper */
  --lk-paper:#F6F3EA; --lk-pink:#E9DFE8; --lk-pink2:rgba(176,23,107,.10);
  --lk-pB:#1F4E8C; --lk-pC:#B0176B; --lk-pD:#1F4E8C; --lk-pE:#B0176B; --lk-pink-halo:#F6F3EA;
  --lk-pink-ink:#1B2433; --lk-paper-dim:#5D6675; --lk-paper-line:#C9C2B2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --lk-paper:#E9E4D6; --lk-pink-halo:#E9E4D6;
}}
:root[data-theme="dark"]{--lk-paper:#E9E4D6; --lk-pink-halo:#E9E4D6}

/* ---------- layout: stage beside panel on desktop, stacked on phones ---------- */
.lk{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start;margin:18px 0}
.lk.wide{grid-template-columns:minmax(0,1fr)}
.lk-main,.lk-side{min-width:0}
.lk-side{display:flex;flex-direction:column;gap:14px}
@media(min-width:961px){.lk:not(.wide) .lk-main{position:sticky;top:calc(118px + env(safe-area-inset-top,0px))}}
@media(max-width:960px){.lk{grid-template-columns:minmax(0,1fr);gap:14px}}
@media(max-width:640px){
  .lk.sticky .lk-main{position:sticky;top:calc(var(--lk-top,104px) + env(safe-area-inset-top,0px));z-index:6}
  .lk.sticky .lk-stage{box-shadow:0 10px 24px rgba(5,10,20,.35)}
}

/* ---------- the stage ---------- */
.lk-stage{margin:0;border-radius:var(--r3);background:var(--lk-stage);color:var(--lk-ink);overflow:hidden;
  border:1px solid rgba(120,160,210,.18);box-shadow:var(--sh2);position:relative}
.lk-stage.paper{background:var(--lk-paper);color:var(--lk-pink-ink);border-color:var(--lk-paper-line)}
.lk-bar{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid rgba(120,160,210,.16);background:var(--lk-stage2)}
.lk-stage.paper .lk-bar{background:#0E1A2B;color:#E8EEF7;border-bottom-color:transparent}
.lk-title{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lk-cyan);white-space:nowrap}
.lk-reads{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:flex-end}
.lk-read{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.lk-read i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--lk-dim)}
.lk-read b{font-size:15px;font-weight:700;color:var(--lk-ink)}
.lk-read b .u{color:var(--lk-dim)}
.lk-read.ok b{color:var(--lk-ok)} .lk-read.warn b{color:var(--lk-warn)} .lk-read.no b{color:var(--lk-no)} .lk-read.hi b{color:var(--lk-orange)}
.lk-view{position:relative}
.lk-svg{display:block;width:100%;height:auto;max-height:76vh}
.lk-badge{position:absolute;left:10px;bottom:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:rgba(11,21,36,.78);color:var(--lk-warn);border:1px solid rgba(242,193,78,.35);pointer-events:none}
.lk-stage.paper .lk-badge{background:rgba(246,243,234,.9);color:#7A4A06;border-color:#D9B97A}
.lk-foot{padding:10px 14px;font-size:13px;color:var(--lk-dim);border-top:1px solid rgba(120,160,210,.14)}
.lk-stage.paper .lk-foot{color:var(--lk-paper-dim);border-top-color:var(--lk-paper-line)}

/* ---------- svg vocabulary ---------- */
.lk-svg .lk-t{font-family:var(--f-body);font-size:13px;fill:var(--lk-ink);font-weight:600}
.lk-svg .lk-mono{font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.lk-svg .lk-dim{fill:var(--lk-dim);font-weight:500}
.lk-svg .lk-cy{fill:var(--lk-cyan)} .lk-svg .lk-or{fill:var(--lk-orange)} .lk-svg .lk-okf{fill:var(--lk-ok)} .lk-svg .lk-nof{fill:var(--lk-no)}
.lk-svg .lk-halo{paint-order:stroke;stroke:var(--lk-halo);stroke-width:4px;stroke-linejoin:round}
.lk-stage.paper .lk-svg .lk-t{fill:var(--lk-pink-ink)}
.lk-stage.paper .lk-svg .lk-dim{fill:var(--lk-paper-dim)}
.lk-stage.paper .lk-svg .lk-halo{stroke:var(--lk-pink-halo)}
.lk-svg .lk-leader{fill:none;stroke:var(--lk-dim);stroke-width:1;opacity:.8}
.lk-svg .lk-leaderdot{fill:var(--lk-dim)}
.lk-stage.paper .lk-svg .lk-leader{stroke:var(--lk-paper-dim)}
.lk-svg .lk-tapeline{stroke:var(--lk-line);stroke-width:1}
.lk-svg .lk-tapetick{stroke:var(--lk-dim);stroke-width:1}
.lk-svg .lk-gridbg{fill:url(#lk-grid)}
/* hotspots: dim the rest on selection, glow the chosen part */
.lk-svg .lk-hot{cursor:pointer;outline:none}
.lk-svg .lk-hot>*{transition:opacity var(--t2) var(--ease),filter var(--t2) var(--ease)}
.lk-svg:has(.lk-hot.on) .lk-hot:not(.on)>*:not([fill="transparent"]){opacity:.42}
.lk-svg .lk-hot.on>*:not([fill="transparent"]){filter:drop-shadow(0 0 6px rgba(63,193,224,.55))}
.lk-stage.paper .lk-svg .lk-hot.on>*:not([fill="transparent"]){filter:drop-shadow(0 0 5px rgba(180,83,9,.45))}
.lk-svg .lk-hot:focus-visible>*:not([fill="transparent"]){filter:drop-shadow(0 0 0 2px var(--lk-cyan)) drop-shadow(0 0 6px var(--lk-cyan))}
@media(hover:hover){.lk-svg .lk-hot:hover>*:not([fill="transparent"]){opacity:1}}
/* motion that teaches: transforms tween, nothing loops unless it is the subject */
.lk-svg .lk-tween{transition:transform var(--t3) var(--ease-out)}
@keyframes lk-dash{to{stroke-dashoffset:-24}}
.lk-svg .lk-flow{stroke-dasharray:6 6;animation:lk-dash 1.4s linear infinite}
@keyframes lk-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.lk-svg .lk-sway{animation:lk-sway 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
@media(prefers-reduced-motion:reduce){.lk-svg .lk-tween{transition:none}.lk-svg .lk-flow,.lk-svg .lk-sway{animation:none}}

/* ---------- panel ---------- */
.lk-panel{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r3);padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--sh1)}
.lk-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.lk-glabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lk-gval{font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lk-seg{display:flex;flex-wrap:wrap;gap:6px}
.lk-seg button{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);
  font:600 14.5px/1.2 var(--f-body);cursor:pointer;flex:1 1 auto;transition:background var(--t1),border-color var(--t1),color var(--t1)}
.lk-seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lk-seg button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lk-panel input[type=range]{width:100%;min-height:44px;accent-color:var(--accent)}
.lk-legend{display:flex;flex-wrap:wrap;gap:8px 14px;list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--ink2)}
.lk-legend li{display:flex;align-items:center;gap:7px}
.lk-legend .sw{width:22px;height:12px;border-radius:3px;flex:none;border:1.5px solid currentColor}
/* explanation card */
.lk-explain{background:var(--surface);border:1px solid var(--line2);border-left:4px solid var(--cyan);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;box-shadow:var(--sh1)}
.lk-explain.ok{border-left-color:var(--ok)} .lk-explain.no{border-left-color:var(--no)} .lk-explain.warn{border-left-color:var(--warn)} .lk-explain.acc{border-left-color:var(--accent)}
.lk-kick{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.lk-explain.ok .lk-kick{color:var(--ok)} .lk-explain.no .lk-kick{color:var(--no)} .lk-explain.acc .lk-kick{color:var(--accent)}
.lk-etitle{margin:0 0 6px;font-size:17px;line-height:1.3}
.lk-ebody{font-size:15px;line-height:1.55;color:var(--ink2)}
.lk-ebody p{margin:0 0 8px}.lk-ebody p:last-child{margin:0}
.lk-cite{display:inline-block;margin-top:10px;font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
/* tappable key list (the accessible twin of the hotspots) */
.lk-keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lk-keys button{min-height:44px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2);font:600 14px/1.25 var(--f-body);cursor:pointer;display:flex;align-items:center;gap:8px}
.lk-keys button .sw{width:12px;height:12px;border-radius:3px;flex:none}
.lk-keys button.on{border-color:var(--cyan);background:var(--cyan-soft);color:var(--ink)}
.lk-keys button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* predict card */
.lk-predict{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r2);padding:14px 16px}
.lk-predict.done{border-style:solid}
.lk-q{margin:0 0 10px;font-weight:600;font-size:15.5px;line-height:1.45}
.lk-popts{display:flex;flex-direction:column;gap:6px}
.lk-popt{min-height:44px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:500 15px/1.35 var(--f-body);cursor:pointer}
.lk-popt.ok{border-color:var(--ok);background:var(--ok-soft)} .lk-popt.no{border-color:var(--no);background:var(--no-soft)}
.lk-popt:disabled{cursor:default;opacity:1}
.lk-pwhy{margin:10px 0 6px;font-size:15px;line-height:1.5;color:var(--ink2)}
.lk-again{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink2);font:600 13.5px var(--f-body);cursor:pointer}
/* phone tightening */
@media(max-width:640px){
  .lk-bar{padding:8px 12px}.lk-read b{font-size:14px}
  .lk-panel{padding:14px;gap:14px}
  .lk-keys{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* the citation chip is 12 px text: darker ink on the light theme clears 4.5:1 (dark theme already passes) */
.lk-cite{color:#8A3F06}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk-cite{color:var(--accent)}}
:root[data-theme="dark"] .lk-cite{color:var(--accent)}

/* Lab module styles (a). Built on p107-lab.css tokens and components.
   Visual tab: landing grid, airspace explorer, where-am-I card, category stepper. */

/* ---------- landing grid: nine tiles with live thumbnails ---------- */
.lkA-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
@media(min-width:900px){.lkA-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.lkA-tile{display:flex;flex-direction:column;min-width:0;min-height:44px;padding:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r3);overflow:hidden;box-shadow:var(--sh1);
  transition:border-color var(--t1),box-shadow var(--t2),transform var(--t2)}
.lkA-tile:hover{border-color:var(--cyan);box-shadow:var(--sh2);transform:translateY(-1px)}
.lkA-tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lkA-thumb{display:block;width:100%;height:auto;aspect-ratio:160/90;border-bottom:1px solid var(--line2)}
.lkA-tt{display:flex;flex-direction:column;gap:4px;padding:11px 13px 13px}
.lkA-th{font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.25}
.lkA-tb{font-size:14px;line-height:1.4;color:var(--muted)}
@media(max-width:640px){.lkA-tt{padding:9px 11px 11px}.lkA-th{font-size:15px}.lkA-tb{font-size:13px}}
@media(prefers-reduced-motion:reduce){.lkA-tile{transition:none}.lkA-tile:hover{transform:none}}

/* ---------- airspace stage ---------- */
.lkA-air .lk-foot{font-size:12.5px;line-height:1.45}
.lkA-air .lk-read b{font-size:14px}
.lkA-air .lk-read{max-width:12em}
.lkA-air .lk-read b{white-space:normal;text-align:right}
@media(max-width:640px){.lkA-air .lk-reads{gap:4px 12px}.lkA-air .lk-read b{font-size:13px}}
.lkA-typ{font-size:13.5px;color:var(--muted)}
/* the Learn lesson injects its marker in app colours; on the navy stage use the stage inks */
.lk-stage .ymark line{stroke:var(--lk-ink)}
.lk-stage .ymark text,.lk-stage .ymark circle{fill:var(--lk-orange)}
.lk-stage .lk-svg rect[stroke="var(--mag)"]{stroke:var(--lk-E);fill:var(--lk-E)}
.lk-stage .lk-svg text[fill="var(--mag)"]{fill:var(--lk-E)}
.lkA-lesson{margin:14px 0}

/* where am I card */
.lkA-where{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);padding:14px 16px}
.lkA-where .lk-q{margin-bottom:12px}
.lkA-qhead{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lkA-score{color:var(--accent)}
.lkA-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}
.lkA-sub{margin:0 0 12px;font-size:15px;line-height:1.5;color:var(--ink2)}
.lkA-row{display:flex;gap:8px;flex-wrap:wrap}
.lkA-where .btn{min-height:44px}

/* markers and lights that blink only when motion is welcome */
@keyframes lkA-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.lk-svg .lkA-pulse{animation:lkA-pulse 1.6s ease-in-out infinite}
@keyframes lkA-blink{0%,70%,100%{opacity:.15}75%,90%{opacity:1}}
.lk-svg .lkA-blink{animation:lkA-blink 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){.lk-svg .lkA-pulse,.lk-svg .lkA-blink{animation:none}}

/* ---------- category stepper ---------- */
.lkA-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.lkA-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.lkA-step:last-child{padding-bottom:0}
.lkA-step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:var(--line)}
.lkA-step.done:not(:last-child)::before{background:var(--cyan)}
.lkA-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px;border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.lkA-step.done .lkA-n{border-color:var(--cyan);background:var(--cyan);color:#0B1524}

/* A generator can occasionally land on numbers that make two options identical
   (e.g. a floor exactly twice the terrain elevation makes the AGL answer equal
   one distractor). Rather than corrupt the wording, redraw the scenario. */
function distinct3(o){return o&&o.length===3&&o[0]!==o[1]&&o[1]!==o[2]&&o[0]!==o[2]}
function genItem(gi){var g=GEN[gi],it;
 for(var tries=0;tries<25;tries++){it=g.f();if(distinct3(it.o))break}
 it.gen=1;return it;
}
function genAny(area){
 var pool=[];for(var i=0;i<GEN.length;i++)if(!area||GEN[i].t===area)pool.push(i);
 if(!pool.length)return null;return genItem(pick(pool));
}

/* ============================================================
   READINESS ENGINE
   Posterior predictive P(exam score >= 42 of 60).
   Evidence rules that protect the estimate:
     - only FIRST attempt at a given item counts
     - generated items always count (novel instance each time)
     - validation-bank items are weighted higher
     - answers faster than MIN_MS are discarded as non-evidence
     - evidence decays with age (half-life HALFLIFE_D days)
   ============================================================ */
var MIN_MS=2500, HALFLIFE_D=45, VAL_WEIGHT=2.0;

function gammaSample(k){ /* Marsaglia-Tsang, k>=1 */
 if(k<1){return gammaSample(k+1)*Math.pow(Math.random(),1/k)}
 var d=k-1/3,c=1/Math.sqrt(9*d),x,v,u;
 for(;;){do{x=normSample();v=1+c*x}while(v<=0);v=v*v*v;u=Math.random();
  if(u<1-0.0331*x*x*x*x)return d*v;
  if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v}
}
var _spare=null;
function normSample(){
 if(_spare!==null){var s=_spare;_spare=null;return s}
 var u,v,s2;do{u=Math.random()*2-1;v=Math.random()*2-1;s2=u*u+v*v}while(s2>=1||s2===0);
 var m=Math.sqrt(-2*Math.log(s2)/s2);_spare=v*m;return u*m;
}
function betaSample(a,b){var x=gammaSample(a),y=gammaSample(b);return x/(x+y)}
function binomSample(n,p){var c=0;for(var i=0;i<n;i++)if(Math.random()<p)c++;return c}

/* evidence: {areaId:{r:effectiveCorrect, w:effectiveWrong, n:rawCount, nv:validationCount}} */
function decayedEvidence(log){
 var now=Date.now(), ev={};
 for(var i=0;i<AREAS.length;i++)ev[AREAS[i].id]={r:0,w:0,n:0,nv:0};
 for(var j=0;j<log.length;j++){
  var L=log[j];
  if(L.ms<MIN_MS)continue;                    /* anti-gaming: too fast to be reasoning */
  var days=(now-L.at)/86400000;
  var wgt=Math.pow(0.5,days/HALFLIFE_D)*(L.val?VAL_WEIGHT:1);
  var e=ev[L.t]; if(!e)continue;
  if(L.ok)e.r+=wgt; else e.w+=wgt;
  e.n++; if(L.val)e.nv++;
 }
 return ev;
}

/* Returns {p, lo, hi}. p is the posterior predictive chance of 42+ (the same sampled
   estimate as before, which the gate reads). lo and hi are the 10th and 90th percentiles
   of the chance of passing given each posterior draw of per-area accuracy, computed
   exactly from the binomial mix, so the display can say how settled the number is. */
function binomPmf(n,p){var o=[],q=1-p,c=1;for(var k=0;k<=n;k++){o.push(c*Math.pow(p,k)*Math.pow(q,n-k));c=c*(n-k)/(k+1)}return o}
function passGiven(ths){
 var dist=[1];
 for(var i=0;i<AREAS.length;i++){var pm=binomPmf(AREAS[i].n60,ths[i]),nd=[],j,k;
  for(j=0;j<dist.length+pm.length-1;j++)nd.push(0);
  for(j=0;j<dist.length;j++)if(dist[j])for(k=0;k<pm.length;k++)nd[j+k]+=dist[j]*pm[k];
  dist=nd}

}
function pPass(ev,draws){

 var pass=0,cond=[];
 for(var d=0;d<draws;d++){
  var score=0,ths=[];
  for(var i=0;i<AREAS.length;i++){
   var a=AREAS[i],e=ev[a.id];
   /* Beta(1,1) uniform prior: thin evidence widens the posterior and lowers P(pass) on its own */
   var p=betaSample(1+e.r,1+e.w);ths.push(p);
   score+=binomSample(a.n60,p);
  }
  if(score>=PASS_MARK)pass++;

}

   in 4,000 draws", which is not the same as certainty, and printing 100% would be
   the exact kind of unearned claim this platform is built to avoid. */
