["III","UA.III.B.K1d","A cold front typically produces what?",["Gradual change over many hours", "Rapid change, gusty wind, possible thunderstorms", "No change"],1,"<b>Rapid and violent.</b> Warm fronts bring gradual, widespread stratus and poor visibility.",0,2,"PHAK FAA-H-8083-25, Chapter 12 Weather Theory, p.12-20 to 12-21 (Cold Front / Warm Front)",""],
["III","UA.III.B.K1g","Why is icing hazardous to a small UA?",["Added weight and disrupted airflow over props and airframe", "It only affects the camera", "It improves stability"],0,"<b>Weight and disrupted airflow.</b> Even light icing can make a small UA unflyable quickly.",0,2,"AC 91-74B Pilot Guide: Flight in Icing Conditions, para 3-8 (Propeller Icing); PHAK p.12-15",""],
["III","UA.III.A.K2","METAR: 12008KT 10SM BKN012 22/21 A2998. What is the ceiling and is fog a concern?",["1,200 ft ceiling, fog likely given the 1 degree spread", "12,000 ft ceiling, no concern", "No ceiling reported"],0,"BKN012 is a <b>broken layer at 1,200 ft, which is a ceiling</b>. Temp 22 dewpoint 21 is a 1 degree spread, so fog or lowering cloud is likely.",1,3,"PHAK FAA-H-8083-25, Chapter 13 p.13-7 (cloud bases in hundreds of feet AGL) and Chapter 12 p.12-17 (ceiling definition)",""],
["III","UA.III.B.K1a","Field elevation 4,500 ft, temperature 35 C, humidity high. What performance effect should you expect?",["Improved climb", "Degraded lift, thrust and climb performance", "No measurable effect"],1,"Hot, high and humid all reduce air density. Expect <b>degraded performance</b> across the board.",1,2,"PHAK FAA-H-8083-25, Chapter 11 Aircraft Performance, p.11-2 and p.11-5",""],
["IV","UA.IV.A.K1a","A 33 lb aircraft in a 30 degree bank experiences approximately what load?",["34 lb", "47 lb", "38 lb"],2,"<b>38 lb.</b> Load factor at 30 degrees is about 1.15. 33 times 1.15 is 38.",0,2,"FAA-CT-8080-2H Airman Knowledge Testing Supplement, Load Factor Chart; PHAK FAA-H-8083-25 Ch.5 Fig. 5-39",""],
["IV","UA.IV.A.K1a","Load factor in a 60 degree banked turn is approximately what?",["1.15 G", "1.41 G", "2.0 G"],2,"<b>2.0 G.</b> Memorize the three: 30 is 1.15, 45 is 1.41, 60 is 2.0.",0,2,"FAA Remote Pilot Study Guide FAA-G-8082-22, Loading and Performance; FAA-CT-8080-2H Load Factor Chart",""],
["IV","UA.IV.A.K1a","What causes an aircraft to stall?",["Exceeding maximum airspeed", "Exceeding maximum gross weight", "Exceeding the critical angle of attack"],2,"<b>Exceeding the critical angle of attack.</b> Always. Any airspeed, any attitude, any weight.",0,1,"PHAK FAA-H-8083-25 Ch.5, Aerodynamics of Flight (Stalls)",""],
["IV","UA.IV.A.K1b","Where are CG limits for your small UAS found?",["The POH or UAS Flight Manual", "The AIM", "14 CFR part 107"],0,"<b>Manufacturer documentation.</b> Anything aircraft-specific lives there.",0,1,"PHAK FAA-H-8083-25 Weight and Balance chapter; FAA Remote Pilot Study Guide FAA-G-8082-22; 14 CFR part 107 (eCFR, current)",""],
["IV","UA.IV.A.K1a","Increasing the weight of a small UA does what?",["Extends flight time", "Shortens flight time and reduces maneuverability", "Nothing measurable"],1,"<b>Shortens endurance and degrades performance.</b>",0,1,"PHAK FAA-H-8083-25 Weight and Balance chapter, Effects of Weight on Flight Performance; FAA Remote Pilot Study Guide FAA-G-8082-22",""],
["IV","UA.IV.A.K1a","Load factor increases when?",["The CG shifts rearward", "During any maneuver other than straight and level unaccelerated flight", "Gross weight is reduced"],1,"<b>Any maneuver other than straight and level.</b> Turns, pull-ups and gusts all raise it.",0,2,"PHAK FAA-H-8083-25 Ch.5, Load Factors; FAA Remote Pilot Study Guide FAA-G-8082-22",""],
["IV","UA.IV.A.K2","Who determines aircraft performance before flight?",["The manufacturer", "The remote pilot in command", "The owner"],1,"<b>Remote PIC.</b>",0,1,"14 CFR 107.19(b) and 107.49(d) (eCFR, current); AC 107-2A para. 6.7.1; FAA Remote Pilot Study Guide FAA-G-8082-22",""],
["IV","UA.IV.A.K1b","Moving the CG outside its limits does what?",["Improves efficiency", "Degrades stability and controllability", "Only affects battery life"],1,"<b>Degrades stability and controllability.</b> An aft CG particularly reduces stability.",0,2,"PHAK FAA-H-8083-25 Weight and Balance chapter, Effects of Adverse Balance",""],
["IV","UA.IV.A.K1a","Why does a heavier aircraft need a higher angle of attack in level flight?",["More lift is required, and lift rises with angle of attack", "Heavier aircraft fly faster", "It does not"],0,"More weight demands more lift, so a higher angle of attack, which sits closer to the critical angle.",0,3,"FAA Remote Pilot Study Guide FAA-G-8082-22, Loading and Performance; PHAK FAA-H-8083-25 Ch.5",""],
["IV","UA.IV.A.K2","Performance data should be used to do what?",["Ignore it, it is marketing", "Calculate expected endurance, payload and environmental limits before flight", "Warranty claims only"],1,"Use it to decide whether the planned operation is within the aircraft's capability in the day's conditions.",0,2,"14 CFR 107.49(d) and 107.49(e) (eCFR, current); AC 107-2A, Preflight Planning",""],
["IV","UA.IV.A.K1a","A 20 lb aircraft is flown in a 45 degree banked turn. What load do the rotors carry?",["About 28 lb", "About 20 lb", "About 40 lb"],0,"Load factor at 45 degrees is about 1.41. 20 times 1.41 is about <b>28 lb</b>.",1,3,"FAA-CT-8080-2H Airman Knowledge Testing Supplement, Load Factor Chart; PHAK FAA-H-8083-25 Ch.5 Fig. 5-39",""],
["I","UA.I.A.K6","An accepted Declaration of Compliance lists your aircraft as eligible for both Category 2 and Category 3 operations over human beings. How may you operate it?",["Under either category, provided you meet that category's operating requirements for that flight", "Only under Category 3, the more restrictive of the two", "Only under Category 2, the less restrictive of the two"],0,"A small UAS can be eligible for more than one category. The remote PIC decides which category a given flight is conducted under and must then meet <b>that category's</b> limitations and the manufacturer's operating instructions.",0,2,"14 CFR 107.150; 14 CFR 107.105",""],
["I","UA.I.A.K7","An FAA inspector asks to see your remote pilot certificate and the documents required for your operation. What is required of you?",["Present them upon request", "Mail copies to the local FSDO within 10 days", "Nothing, the FAA can look them up in its own systems"],0,"<b>14 CFR 107.7, Inspection, testing, and demonstration of compliance.</b> The remote PIC, owner, or person manipulating the controls must make available on FAA request the certificate and any other document or record part 107 requires. Carry them.",0,1,"14 CFR 107.7(a)(1)-(a)(2)",""],
["I","UA.I.A.K8","Your aircraft was manufactured before the rule permitting routine operations over human beings took effect. Can it ever be flown over people?",["Yes, if a Declaration of Compliance has been accepted for it and it is labeled with its eligible category", "No, aircraft manufactured before the rule are permanently ineligible", "Yes, any aircraft under 55 lb may be flown over people"],0,"Eligibility comes from an <b>accepted Declaration of Compliance</b> and the required category label, not from a manufacture date. A previously manufactured aircraft can be brought into a category if someone obtains that acceptance for it.",0,3,"14 CFR 107.120(a); 14 CFR 107.115(a)(2)-(a)(3)",""],
["I","UA.I.B.K6","You plan to release a small package from your aircraft during a flight. Under part 107, this is:",["Permitted, provided it does not create an undue hazard to persons or property", "Prohibited under all circumstances", "Permitted only over property you own"],0,"<b>107.23</b> prohibits careless or reckless operation and prohibits allowing an object to be dropped in a manner that creates an <b>undue hazard</b>. Carrying and releasing is otherwise allowed. The hazard is what is regulated, not the act.",0,2,"14 CFR 107.23(b)",""],
["I","UA.I.B.K9","Under the current rule, when may a small UAS be operated at night?",["Any time, provided the aircraft has anti-collision lighting visible for at least 3 statute miles and the remote pilot has completed the required training or testing", "Never without a waiver", "Only during the 30 minutes of civil twilight either side of sunrise and sunset"],0,"Night operations no longer require a waiver. They require <b>anti-collision lighting visible for 3 statute miles</b> with a flash rate sufficient to avoid a collision, plus the updated initial knowledge test or recurrent training. Civil twilight, 30 minutes either side, is the boundary between day and night.",0,2,"14 CFR 107.29(a)(1)-(a)(2)",""],
["I","UA.I.B.K14a","A manned aircraft is converging with your small UA at a similar altitude. What must you do?",["Yield the right of way, giving way and not passing over, under or ahead of it unless well clear", "Hold your position and let the manned aircraft maneuver around you", "Climb so the other pilot can see you more easily"],0,"<b>107.37(a):</b> the small unmanned aircraft must yield the right of way to all aircraft, airborne vehicles, and launch and reentry vehicles. Yielding means giving way and <b>not passing over, under, or ahead of it unless well clear</b>. 107.37(b) separately prohibits operating so close to another aircraft as to create a collision hazard. Note 107.37(a) is waivable under 107.205; 107.37(b) is not.",0,2,"14 CFR 107.37(a)-(b)",""],
["I","UA.I.B.K15","Without meeting any Subpart D category, over which nonparticipating person may you fly?",["A person inside a stationary covered vehicle or under a covered structure that could protect them from a falling aircraft", "A person who verbally agreed to stand in the area", "Any person, provided the flight over them is brief"],0,"<b>107.39.</b> Absent category eligibility, the only nonparticipants you may fly over are those <b>under a covered structure or inside a stationary covered vehicle</b>. Agreeing to stand nearby does not make someone a participant; direct participation means they are part of the operation, such as a visual observer.",0,3,"14 CFR 107.39(b)",""],
["I","UA.I.B.K16","You need to operate inside Class D airspace. What is required before you fly?",["Prior authorization from ATC, normally through LAANC or a DroneZone request", "A radio call to the tower at the time of flight", "Nothing, part 107 permits it as long as you stay below 400 ft AGL"],0,"<b>107.41.</b> Class B, C, D and the surface area of Class E all require <b>prior</b> ATC authorization. LAANC returns most requests in seconds. A radio call is courtesy, not authorization.",0,1,"14 CFR 107.41",""],
["I","UA.I.B.K18","Your planned route crosses a charted restricted area. What is required?",["Permission from the using or controlling agency", "Nothing, restricted areas apply only to manned aircraft", "A part 107 waiver from the FAA"],0,"<b>107.45.</b> No operation in prohibited or restricted areas without permission from the <b>using or controlling agency</b>. A part 107 waiver does not substitute for that permission.",0,2,"14 CFR 107.45; 14 CFR 107.205 (107.45 absent from the waivable list)",""],
["I","UA.I.B.K22","A friend who holds no certificate wants to fly your aircraft on a part 107 job. Is that possible?",["Yes, under the direct supervision of a certificated remote PIC who has the ability to immediately take direct control", "No, only a certificated remote pilot may ever manipulate the controls", "Yes, if the remote PIC stays within 100 ft of them"],0,"<b>107.12.</b> An uncertificated person may manipulate the controls under the <b>direct supervision</b> of a remote PIC who can immediately take direct control. The remote PIC remains responsible for the flight.",0,2,"14 CFR 107.12(a)(2)",""],
["I","UA.I.B.K23","During a fully automated waypoint mission, who is responsible for the flight?",["The remote PIC, who must be able to take direct control or otherwise terminate the flight", "The software vendor that produced the flight planning application", "Nobody, automated flight is outside part 107"],0,"<b>107.19.</b> Automation does not transfer responsibility. The remote PIC must be able to direct the aircraft, take over, or end the flight at any point in the operation.",0,2,"14 CFR 107.19(b), (e)",""],
["I","UA.I.B.K28","May you operate your small UAS with ADS-B Out equipment transmitting?",["No, unless otherwise authorized by the Administrator", "Yes, it makes you more visible to manned aircraft", "Yes, and it is required above 200 ft AGL"],0,"<b>107.53, the ADS-B Out prohibition.</b> Large numbers of small UAS transmitting would clutter the displays manned pilots and controllers depend on. Receiving ADS-B In is fine. Transmitting Out is not, absent FAA authorization.",0,2,"14 CFR 107.53",""],
["I","UA.I.C.K1","You are convicted of violating a State statute relating to the possession of narcotic drugs. What effect can that have on your remote pilot certificate?",["It is grounds for denial of an application for up to 1 year, and grounds for suspension or revocation of a certificate you already hold", "No effect, it is not aviation related", "Automatic permanent disqualification from holding any certificate"],0,"<b>Denial for up to 1 year, or suspension or revocation.</b> 107.57(a) covers convictions under Federal or State narcotic, marijuana, or depressant or stimulant drug statutes. 107.57(b) covers committing an act prohibited by 91.17(a) or 91.19(a). 107.59 covers refusing an alcohol test or refusing to release the results. Note part 107 does <b>not</b> carry over the 61.15 motor vehicle action provisions that apply to part 61 pilots.",0,2,"14 CFR 107.57(a)-(b); 14 CFR 107.59",""],
["I","UA.I.E.K2","You intend to conduct a Category 2 operation over people at night. What does the aircraft need?",["Anti-collision lighting visible for at least 3 statute miles, in addition to meeting every Category 2 requirement", "Nothing beyond Category 2 eligibility", "A waiver, because operations over people at night are prohibited"],0,"Night rules and operations-over-people rules <b>stack</b>. The 3 statute mile anti-collision light applies to every night flight, and the Subpart D category requirements apply on top of it.",0,3,"14 CFR 107.29(a)(2); 14 CFR 107.105; 14 CFR 107.115",""],
["I","UA.I.E.K3b","What defines Category 2 eligibility for operations over human beings?",["Impact energy no greater than 11 ft-lb, no exposed rotating parts that would lacerate human skin, no safety defects, and an accepted Declaration of Compliance", "A takeoff weight of 0.55 lb or less", "Impact energy no greater than 25 ft-lb"],0,"<b>Category 2 is 11 ft-lb</b> under 107.120(a), plus no exposed rotating parts that would lacerate skin and <b>no safety defects</b> (an absolute test, not merely none the FAA has identified). Category 3 is the same test at <b>25 ft-lb</b>. Category 1 is <b>0.55 pounds or less</b>, note <i>or less</i>, so exactly 0.55 lb qualifies.",0,2,"14 CFR 107.120(a)(1)-(3); 14 CFR 107.110(a)(1)",""],
["I","UA.I.E.K4","Which operation is Category 3 unable to support?",["Sustained flight over an open-air assembly of people", "Flight over a closed set where everyone present has been notified", "Momentary transit over a person"],0,"<b>Category 3 may never operate over an open-air assembly.</b> It is limited to closed or restricted-access sites where those present have been notified, or to transiting flight that does not sustain over any person.",0,3,"14 CFR 107.125(b)-(c)",""],
["I","UA.I.E.K5","Under Category 3, when may you maintain sustained flight over a person?",["Only when that person is directly participating, is under a covered structure or inside a stationary covered vehicle, or is inside a closed or restricted-access site and has been notified", "Any time you remain above 100 ft AGL", "Never, under any circumstance"],0,"Category 3 forbids <b>sustained</b> flight over a nonparticipant outside those conditions. Momentary transit is permitted; loitering overhead is not.",0,3,"14 CFR 107.125(c)(1)-(c)(2)",""],
["I","UA.I.E.K7","You fit a third-party propeller guard to an aircraft that is Category 2 eligible. What happens to that eligibility?",["It is lost unless the modification is covered by the manufacturer's instructions or a new Declaration of Compliance is accepted", "Nothing, guards can only improve safety", "It automatically becomes Category 1"],0,"Category eligibility describes a <b>specific configuration</b>. Modify outside the manufacturer's instructions and you become the applicant, responsible for obtaining your own accepted declaration.",0,3,"14 CFR 107.120(a); 14 CFR 107.115(a)(2); 14 CFR 107.120(b)(2)",""],
["I","UA.I.E.K8","For a Category 3 operation at a closed or restricted-access site, what is required of the people present?",["Each must be notified that a small unmanned aircraft may fly over them", "Each must sign a liability waiver", "Each must wear head protection"],0,"The requirement is <b>notification</b>, not signatures or protective equipment. The site must also be closed or access-restricted so uninvolved people cannot wander into it.",0,2,"14 CFR 107.125(c)(1)",""],
["I","UA.I.E.K9","Where do you find the limitations that keep an aircraft within its category for operations over people?",["The manufacturer's remote pilot operating instructions supplied with the aircraft", "14 CFR part 107", "The Aeronautical Information Manual"],0,"Subpart D requires the manufacturer to supply <b>remote pilot operating instructions</b> and requires you to operate in accordance with them. Anything aircraft-specific always lives in manufacturer documentation.",0,2,"14 CFR 107.120(b)(2); 14 CFR 107.130(b)(2)",""],
["I","UA.I.E.K10","How do you confirm a small unmanned aircraft is eligible for Category 2 or Category 3 operations over people?",["A label on the aircraft indicating its eligible category or categories, backed by an accepted Declaration of Compliance", "The FAA registration certificate", "The takeoff weight printed in the sales listing"],0,"<b>A label plus a Declaration of Compliance.</b> 107.120(b)(1) and 107.130(b)(1) require a legible, prominent, permanently affixed English label showing Category 2 or 3 eligibility, backed by an FAA-accepted Declaration of Compliance under 107.160. 107.135 makes the remote PIC responsible for re-labeling if it is damaged or missing. Category 1 needs no label and no declaration, and Category 4 rests on a part 21 airworthiness certificate and its approved Flight Manual.",0,2,"14 CFR 107.120(b)(1); 14 CFR 107.130(b)(1); 14 CFR 107.135; 14 CFR 107.110; 14 CFR 107.140(b)(1)",""],
["I","UA.I.E.K11","Your aircraft is Category 2 eligible. You install an optional payload the manufacturer sells for it. What must be true?",["The Declaration of Compliance must cover the configuration you are actually flying", "Optional components sold by the manufacturer are always exempt", "Any payload under 1 lb is automatically covered"],0,"A declaration covers a <b>configuration</b>. If an optional component changes the aircraft in a way the declaration does not cover, the aircraft is not eligible while that component is fitted.",0,3,"14 CFR 107.120(a); 14 CFR 107.120(b)(2); 14 CFR 107.150; 14 CFR 107.115(a)(2)",""],
["I","UA.I.E.K12","You build your own aircraft and want to fly it over people under Category 2 or 3. What is your position under Subpart D?",["You are the applicant and must obtain your own accepted Declaration of Compliance using an FAA-accepted means of compliance", "Owner-built aircraft are exempt from Subpart D", "You must buy a commercially produced airframe instead"],0,"<b>You become the applicant.</b> You must obtain your own FAA-accepted Declaration of Compliance using an FAA-accepted means of compliance. Nothing prohibits it, the burden just moves to you. Note this path applies only to Categories 2 and 3: a self-built aircraft of 0.55 lb or less with no exposed rotating parts flies under Category 1 with no declaration at all, and Category 4 requires a part 21 airworthiness certificate instead.",0,3,"14 CFR 107.105; 14 CFR 107.110(a); 14 CFR 107.155(a); 14 CFR 107.160(a)",""],
["I","UA.I.E.K14","What maintenance standard applies to a Category 4 aircraft used for operations over human beings?",["Maintenance, preventive maintenance, alterations and inspections must follow the manufacturer's maintenance manual or Instructions for Continued Airworthiness, with records kept", "An annual inspection by a certificated mechanic", "No specific standard applies"],0,"<b>Category 4 only.</b> 107.140(c)(1) requires maintenance, preventive maintenance, alterations and inspections performed using the methods, techniques and practices in the manufacturer's current maintenance manual or Instructions for Continued Airworthiness, or other methods acceptable to the Administrator, with records kept. Categories 1, 2 and 3 carry <b>no</b> maintenance rule in part 107; instead 107.120(b)(2)(ii) and 107.130(b)(2)(ii) limit modifications to those that do not change category eligibility.",0,2,"14 CFR 107.140(b)(3) and (c)(1)(i), (iii); 14 CFR 107.110, 107.115, 107.120, 107.125, 107.130 (no maintenance provision)",""],
["I","UA.I.E.K15","What is a Means of Compliance in the context of operations over people?",["An FAA-accepted method for showing an aircraft meets a category's requirements, which a Declaration of Compliance then references", "A waiver issued to a specific operator", "A class of airspace authorization"],0,"For Categories 2 and 3 there are <b>two separate FAA acceptances</b>. First a means of compliance is accepted. Then the manufacturer declares the aircraft meets the requirements using that method.",0,3,"14 CFR 107.155(a), (c); 14 CFR 107.160(a)",""],
["I","UA.I.E.K17","What do Categories 1, 2 and 3 of operations over human beings have in common?",["The aircraft may not have exposed rotating parts that could lacerate human skin", "A maximum takeoff weight of 0.55 lb", "A requirement for anti-collision lighting"],0,"<b>No exposed rotating parts that would lacerate human skin</b> (107.110(a)(2), 107.120(a)(2), 107.130(a)(2)). They differ on weight and kinetic energy limits. Note there are <b>four</b> categories: Category 4 is a separate path based on a part 21 airworthiness certificate and has no exposed-rotating-parts test.",0,2,"14 CFR 107.105; 107.110(a)(2); 107.120(a)(2); 107.130(a)(2); 107.140(b)",""],
["I","UA.I.F.K3","An aircraft with no remote identification capability is operated outside an FAA-Recognized Identification Area. When is that permissible?",["When the operation is for aeronautical research or to show compliance with regulations and the FAA has authorized it", "Whenever the flight remains below 200 ft AGL", "Whenever the remote pilot files a flight plan"],0,"The remote ID rules carry a narrow exception for <b>aeronautical research or showing compliance with regulations</b>, and it requires FAA authorization. Otherwise no remote ID means flying only inside a FRIA.",0,3,"14 CFR 89.120; see also 89.105 and 89.115(b)",""],
["I","UA.I.F.K4","Does broadcasting ADS-B Out satisfy the remote identification requirement?",["No, and part 107 separately prohibits operating with ADS-B Out in transmit mode unless authorized", "Yes, ADS-B Out is an accepted alternative to remote ID", "Yes, but only in controlled airspace"],0,"Two separate points. Remote ID is met by a <b>standard remote ID aircraft</b>, a <b>broadcast module</b>, or operating inside a <b>FRIA</b>. ADS-B Out is none of those, and 107.53 prohibits transmitting it without authorization.",0,3,"14 CFR 107.53; 14 CFR 89.105, 89.110, 89.115",""],
["I","UA.I.F.K5","Before takeoff, what must the remote PIC confirm about remote identification?",["That the remote ID equipment is functioning and broadcasting, and it must broadcast from takeoff through shutdown", "Only that the aircraft is registered", "Nothing, the aircraft reports itself to the FAA automatically"],0,"Remote ID must broadcast <b>from takeoff to shutdown</b>. If you cannot confirm it is working before flight, the flight may not begin. If it fails in flight, end the flight as soon as practicable.",0,2,"14 CFR 89.110(a)(1), (a)(2), (b)(2); 14 CFR 89.115(a)(3), (a)(4)",""],
["II","UA.II.A.K4","What is air traffic control's primary function in the National Airspace System?",["Preventing collisions and organizing the flow of traffic", "Issuing and renewing pilot certificates", "Enforcing aircraft registration requirements"],0,"Separation and traffic flow. ATC authorization for a part 107 flight in controlled airspace is about <b>keeping you out of the way of manned traffic</b>, not about approving your work.",0,1,"FAA JO 7110.65, 2-1-1 ATC Service",""],
["II","UA.II.B.K1","What are the basic weather minimums for a part 107 operation?",["3 statute miles flight visibility from the control station, 500 ft below and 2,000 ft horizontally from clouds", "1 statute mile and clear of clouds", "3 nautical miles and 1,000 ft below clouds"],0,"<b>3 SM, 500 below, 2,000 horizontal.</b> Visibility is measured from the <b>control station</b>, not from the aircraft, and it is statute miles, not nautical.",0,1,"14 CFR 107.51(c) and (d)",""],
["II","UA.II.B.K3","You are operating in Class G airspace two miles from a non-towered airport. What does part 107 require?",["You must not interfere with operations and traffic patterns at the airport", "Nothing, Class G carries no airport-related restriction", "Written approval from the airport manager"],0,"<b>107.43.</b> No authorization is needed in Class G, but you may not interfere with airport operations or traffic patterns. Manned aircraft are lowest and slowest near airports, which is where your altitude band is.",0,2,"14 CFR 107.43",""],
["II","UA.II.B.K4c","Which of these should alert you that manned aircraft may be operating below 400 ft AGL?",["Agricultural spraying, firefighting, law enforcement, banner tow, external load, or emergency airborne inspection of another aircraft", "The presence of Class G airspace", "Nighttime"],0,"These operations routinely bring manned aircraft into your altitude band. Emergency airborne inspection means one aircraft visually inspecting another in flight. See and avoid, and <b>you</b> are the one who yields.",0,3,"AC 107-2A, 5.13 (See and Avoid / Right-of-Way) with 14 CFR 91.119(a), (c), (d)",""],
["II","UA.II.B.K6","What should the remote pilot arrange at the control station for a night operation?",["Lighting adequate to read the controls and displays, chosen so it does not destroy night vision", "Nothing, the aircraft's own lights are sufficient", "Floodlights aimed at the aircraft throughout the flight"],0,"You still have to read your controller. Use lighting that lets you work while preserving <b>dark adaptation</b>, which takes roughly 30 minutes to build and seconds to lose.",0,2,"AIM 8-1-6 Vision in Flight (dark adaptation); UAS ACS code UA.II.B.K6 'Operator equipment for night flight'",""],
["II","UA.II.B.K7","Why survey a night operating site during daylight first?",["Towers, wires, antennas and similar obstacles are far harder to see at night and many are unlit", "Because night operations require a daytime authorization", "Because GPS accuracy degrades after dark"],0,"Wires are close to invisible at night and often hard to see in daylight. <b>Survey while you can see</b>, and note every obstacle and its position relative to your launch point.",0,2,"14 CFR 107.49(a); FAA Aeronautical Chart User's Guide, VFR chapter, OBSTRUCTIONS; AC 70/7460-1N para. Application; ACS UA.II.B.K7 \"Ground structures and ground structure lighting\"",""],
["II","UA.II.B.K8","An obstruction near your night operating site is neither lit nor charted. What does that mean for you?",["Nothing relieves you of responsibility for obstacle clearance; charts and obstruction lighting are both incomplete", "If it is not charted it is not a hazard", "You may assume it is below 200 ft AGL"],0,"Charts show obstacles above certain heights and lighting requirements do not reach every structure. <b>Your own site survey is the authority</b>, not the chart.",0,3,"FAA Aeronautical Chart User's Guide, VFR chapter, OBSTRUCTIONS; AC 70/7460-1N, Application; 14 CFR 107.49(a)(4)",""],
["II","UA.II.B.K9","At night you see a green light on your left and a red light on your right on another aircraft. What is it doing?",["Flying toward you", "Flying away from you", "Flying from your left to your right"],0,"Position lights are <b>red on the aircraft's left wingtip, green on its right</b>. An aircraft pointed at you presents its left wing to your right side, so you see green on your left and red on your right. Reverse them and it is heading away.",0,3,"FAA Airplane Flying Handbook FAA-H-8083-3C, Chapter 11, Night Operations (Airplane Lighting); ACS UA.II.B.K9 \"Manned aircraft lighting\"",""],
["II","UA.II.B.K10","What lighting must a small unmanned aircraft carry for night operations?",["Anti-collision lighting visible for at least 3 statute miles with a flash rate sufficient to avoid a collision", "A steady white light visible for 1 statute mile", "Red and green navigation lights only"],0,"<b>3 statute miles, flashing.</b> Steady lights do not satisfy the rule. The remote PIC may reduce intensity only where operating conditions make that the safer choice.",0,2,"14 CFR 107.29(a)(2); ACS UA.II.B.K10 \"sUAS lighting requirements\"",""],
["III","UA.III.A.K1","Which is an official source of aviation weather for preflight planning?",["Flight Service at 1800wxbrief.com or the FAA's Aviation Weather Center at aviationweather.gov", "A consumer smartphone weather application", "A local television forecast"],0,"Use <b>aviation</b> weather sources. Consumer forecasts do not give you METARs, TAFs, ceilings, density altitude, or AIRMET and SIGMET information.",0,1,"AIM para 7-1-2 FAA Weather Services and 7-1-3 Use of Aviation Weather Products; Remote Pilot Study Guide p.14",""],
["III","UA.III.A.K4","What does a surface analysis chart give you that a METAR does not?",["Pressure systems, fronts and observations across a wide area, so you can see what is moving toward your site", "The exact cloud height over your launch point right now", "Airspace class boundaries"],0,"Charts give you the <b>big picture and the trend</b>. A METAR gives you a point observation. You need both: the METAR tells you now, the chart tells you what is coming.",0,2,"PHAK FAA-H-8083-25, Chapter 13 Aviation Weather Services, p.13-13 (Surface Analysis Chart)",""],
["III","UA.III.B.K1b","You are flying on the downwind side of a large building in a 15 knot wind. What should you expect?",["Mechanical turbulence and sinking air that can exceed the aircraft's ability to climb", "Smoother air than on the upwind side", "No measurable effect below 400 ft AGL"],0,"Wind striking an obstruction breaks into <b>mechanical turbulence</b> and rolls downward on the lee side. Small aircraft are easily overpowered by it. Plan to approach obstacles from upwind.",0,3,"PHAK FAA-H-8083-25, Chapter 12 Weather Theory, p.12-9 to 12-10 (Effect of Obstructions on Wind); same wording in Remote Pilot Study Guide p.23",""],
["III","UA.III.B.K1f","A tornado is reported near your operating area. What is the correct response?",["Do not fly; the parent thunderstorm produces violent wind and turbulence well beyond the visible funnel", "Fly, but remain below 100 ft AGL", "Fly, staying upwind of the funnel"],0,"A tornado indicates an intense thunderstorm and the hazard extends far beyond what you can see. This is a <b>do not fly</b> condition, not a distance to be managed.",0,2,"AC 00-24C Thunderstorms, para 7.a(2) and 7.a(3)",""],
["III","UA.III.B.K1h","Where can hail be encountered relative to a thunderstorm?",["Well outside the storm, including in apparently clear air several miles from the cloud", "Only directly beneath the cloud base", "Only above the freezing level inside the cloud"],0,"Hail can be thrown from the top of a cell and carried <b>miles</b> downwind, falling through clear air. Distance from the visible cloud is not the same as safety.",0,3,"AC 00-24C Thunderstorms, para 7.d(1)",""],
["III","UA.III.B.K1j","What is a ceiling?",["The height above ground of the lowest broken or overcast layer, or the vertical visibility into an obscuration", "The height of the highest reported cloud layer", "The maximum altitude you are permitted to fly"],0,"<b>Lowest BKN or OVC.</b> FEW and SCT are never ceilings. METAR cloud heights are in <b>hundreds of feet AGL</b>, so OVC008 is an 800 ft ceiling.",0,1,"FAA Remote Pilot - sUAS Study Guide (FAA-G-8082-22), Ch. 3a, Weather Reports/METAR; corroborated by FAA Pilot/Controller Glossary, entry CEILING",""],
["III","UA.III.B.K1k","You see lightning in the distance during a planned operation. What does that tell you?",["A thunderstorm is present, and its gust front, turbulence and downdrafts can reach you long before any rain does", "Nothing, unless rain is falling at your site", "That conditions are improving"],0,"Lightning means a thunderstorm, and a thunderstorm's <b>gust front can arrive well ahead of the cell itself</b>. Land and secure the aircraft rather than trying to finish the flight.",0,2,"FAA Aviation Weather Handbook FAA-H-8083-28, Ch. 22 Thunderstorms; corroborated by AC 00-24C, Thunderstorms",""],
["V","UA.V.A.K1","What is the practical difference between a towered and a non-towered airport?",["At a towered airport ATC sequences traffic; at a non-towered airport pilots self-announce on a common frequency and separate themselves", "A non-towered airport has no traffic pattern", "A towered airport requires no ATC authorization for part 107 operations"],0,"Non-towered means <b>nobody is coordinating</b>. Traffic can arrive from any direction and not every pilot is on the radio. It is often the harder environment to predict.",0,2,"AIM 4-1-9 Traffic Advisory Practices at Airports Without Operating Control Towers",""],
["V","UA.V.A.K3","What is CTAF used for?",["Pilots at a non-towered airport self-announcing their position and intentions on a common frequency", "Requesting part 107 airspace authorization", "Filing and closing flight plans"],0,"<b>Common Traffic Advisory Frequency.</b> Monitoring it during an operation near a non-towered airport tells you what is inbound. It is not an authorization channel.",0,1,"AIM 4-1-9(g)(1); FAA-G-8082-22 Remote Pilot Study Guide",""],
["V","UA.V.A.K6","How is a civil aircraft identified in radio communication?",["By its registration number, the N-number, often with the manufacturer or type spoken in place of the leading N", "By the pilot's certificate number", "By the identifier of its departure airport"],0,"An N-number such as N1234A becomes \"Cessna one two three four alpha\" on the radio. Registration numbers identify <b>aircraft</b>, not pilots.",0,1,"AIM 4-2-4(c) Aircraft Call Signs",""],
["V","UA.V.A.K8","A METAR is stamped 1430Z. How is that time referenced?",["Coordinated Universal Time, the single reference used across all time zones", "Local time at the reporting station", "The pilot's home time zone"],0,"Aviation runs on <b>UTC, spoken as Zulu</b>. METARs, TAFs, NOTAMs and clearances all use it so an operation spanning time zones has one unambiguous clock.",0,1,"AIM 4-2-12(a) Time",""],
["V","UA.V.B.K1","Which of these appear on a sectional chart and should be accounted for in planning?",["Heliports, seaplane bases and private-use fields, alongside public-use runways", "Only public-use paved runways", "Only airports with an operating control tower"],0,"Sectionals chart <b>heliports, seaplane bases, private fields and ultralight areas</b>. Any of them can put a manned aircraft at low altitude beside your site.",0,2,"AIM 9-1-5 (Sectional Aeronautical Charts); FAA Aeronautical Chart Users' Guide / Sectional Chart Legend (FAA-CT-8080-2 Legend 1), which depicts Seaplane Base, Heliport, Ultralight Flight Park and '(R)' private non-public-use airports",""],
["V","UA.V.B.K2","You monitor the tower frequency during an operation near a towered airport. What does that give you?",["Situational awareness about arriving and departing traffic; it is not itself an authorization", "It replaces the need for an airspace authorization", "It permits you to request a higher operating altitude"],0,"Listening is useful and encouraged. <b>Authorization is a separate, prior act</b> through LAANC or DroneZone, and monitoring does not create it.",0,2,"14 CFR 107.41",""],
["V","UA.V.B.K5","What is a Security Identification Display Area?",["A controlled portion of an airport where personnel must display identification and access is restricted", "A class of charted airspace", "A section of the sectional chart legend"],0,"A <b>SIDA</b> is an airport security area. Operating on airport property can put you inside one, which brings badging and escort requirements that have nothing to do with part 107 but will stop the job.",0,2,"49 CFR 1540.5 (definition); identification-display requirement at 49 CFR 1542.211 - a TSA requirement, not an FAA/part 107 one",""],
["V","UA.V.B.K6a","What is the VFR sectional chart primarily used for in part 107 planning?",["Identifying airspace class and boundaries, airports, obstructions and terrain around the operating site", "Determining the current weather at the site", "Confirming aircraft registration status"],0,"The sectional answers <b>where you are and what is around you</b>. Weather comes from METARs and TAFs, and airport specifics from the Chart Supplement.",0,1,"AIM 9-1-5 Sectional Aeronautical Charts",""],
["V","UA.V.B.K7","Where are bird strike hazards most concentrated, and what is expected after a strike?",["Near water, landfills and wildlife refuges, especially during migration seasons; report the strike to the FAA", "Only above 400 ft AGL, and no report is expected", "Only at towered airports, and the report goes to the tower"],0,"Birds concentrate around <b>water, waste sites and refuges</b>, and migration raises the risk sharply. The FAA maintains a wildlife strike database and asks that strikes be reported.",0,2,"AIM 7-5-2 (Reducing Bird Strike Risks) and AIM 7-5-3 (Reporting Bird Strikes); wildlife attractants incl. waste disposal operations per AC 150/5200-33",""],
["V","UA.V.B.K8","An airport rotating beacon shows alternating white and green. What does that identify?",["A lighted civil land airport", "A military airport", "A water airport or seaplane base"],0,"<b>White and green is a lighted civil land airport.</b> White and yellow is a water airport. Two quick whites and a green is military. A beacon running in daylight can indicate the field is below basic VFR minimums.",0,2,"AIM 2-1-9 Airport/Heliport Beacons",""],
["V","UA.V.C.K2c","A lithium battery pack in your aircraft is visibly swollen. What should you do?",["Remove it from service and dispose of it per the manufacturer's instructions; do not fly it and do not charge it", "Fly it until it no longer holds a charge, then discard it", "Puncture it to relieve the internal pressure"],0,"Swelling indicates internal damage. A damaged lithium cell can enter <b>thermal runaway</b>, which is self-sustaining and burns intensely. Never puncture a pack and never charge a damaged one.",0,2,"14 CFR 107.15(a) and (b)",""],
["V","UA.V.C.K6","What belongs in the plan for an operation over people?",["Confirming category eligibility for the aircraft's actual configuration, and briefing an abort path that does not lead over the crowd", "Checking the weather and nothing further", "Nothing beyond a valid registration"],0,"Two things fail people here. The <b>configuration</b> must match the accepted declaration, and there must be a planned direction to go if control degrades that does not point at people.",0,3,"14 CFR 107.49(f); 14 CFR 107.150 (variable mode and variable configuration)",""],
["V","UA.V.C.K7","What is a sound procedure for a first night operation at a new site?",["Survey the site in daylight, mark obstacles, verify the anti-collision light is visible at 3 statute miles, and brief any visual observers", "Rely on the aircraft's obstacle avoidance sensors", "Operate above 400 ft AGL to clear unknown obstacles"],0,"Night removes your ability to discover what you did not already know about, so the preparation moves to daylight. And 400 ft AGL remains the ceiling at night.",0,2,"14 CFR 107.29(a)(2) and 14 CFR 107.51(b)",""],
["V","UA.V.E.K6","How should you look at a dim object at night to see it best?",["Slightly off to one side of it, because the center of vision is nearly blind in low light", "Directly at it, holding your gaze steady", "Through a bright light source to increase contrast"],0,"<b>Off-center viewing.</b> The cones at the center of the retina need light; the rods off-center work in the dark. Full dark adaptation takes about <b>30 minutes</b> and one bright light resets it.",0,2,"FAA Pilot Vision brochure (CAMI) / Airplane Flying Handbook FAA-H-8083-3C Ch.11 Night Operations",""],
["V","UA.V.E.K7","What does the IMSAFE checklist assess?",["Illness, medication, stress, alcohol, fatigue and emotion, as a self-assessment before flight", "The airworthiness of the aircraft", "The weather at the operating site"],0,"<b>IMSAFE is about you.</b> Illness, Medication, Stress, Alcohol, Fatigue, Emotion. Part 107 also sets hard limits: 8 hours from bottle to throttle and a blood alcohol concentration below 0.04.",0,1,"PHAK FAA-H-8083-25 Ch.2 (IMSAFE); 14 CFR 107.27 incorporating 14 CFR 91.17(a)",""],
["V","UA.V.F.K3","What most effectively reduces the chance of an in-flight mechanical failure?",["A scheduled maintenance and preflight inspection program following the manufacturer's instructions, replacing components at their service life", "Flying more slowly", "Carrying a spare aircraft to the site"],0,"Most failures are <b>predictable</b>: propellers, arms, motor bearings and battery cycles all have service lives. The scheduled program prevents them and the preflight catches what it missed.",0,2,"14 CFR 107.15(a); AC 107-2A Ch.7 (Small UAS Maintenance and Inspection) and App. C (Maintenance and Inspection Best Practices)",""],
["V","UA.V.F.K7","What is a Declaration of Compliance?",["A statement submitted to and accepted by the FAA that a specific aircraft configuration meets the requirements of a category of operations over human beings", "A maintenance logbook entry made by the remote pilot", "A registration document issued by FAADroneZone"],0,"It is the document that makes an aircraft <b>eligible</b>, and it applies to a configuration rather than a model name. The aircraft must also be labeled with its category and accompanied by remote pilot operating instructions.",0,2,"14 CFR 107.160 (Declaration of compliance); 107.150; 107.120(b)/107.130(b) labeling and remote pilot operating instructions",""],
["I","UA.I.B.K18","A charted prohibited area lies along your route at 300 ft AGL. What permits you to operate inside it?",["Nothing under part 107 alone; you need permission from the using or controlling agency", "A part 107 waiver from the FAA", "Remaining below 400 ft AGL"],0,"Permission comes from the <b>using or controlling agency</b>, not from a waiver and not from staying low.",1,3,"14 CFR 107.45; 14 CFR 107.205 (waivable-sections list, which omits 107.45)",""],
["I","UA.I.E.K17","An aircraft weighs 0.9 lb and has fully exposed propellers. Which category of operations over people can it meet?",["None of Categories 1, 2 or 3; exposed rotating parts able to lacerate skin disqualify it from each, and at 0.9 lb it also busts the 0.55 lb Category 1 limit", "Category 1, because of its light weight", "Category 3, because it is well under 55 lb"],0,"The exposed-rotating-parts requirement applies to <b>Categories 1, 2 and 3</b>. Weight alone never makes an aircraft eligible, and at 0.9 lb it independently exceeds the 0.55 lb Category 1 limit. Category 4 is a separate path requiring a part 21 airworthiness certificate and approved Flight Manual limitations, not a weight or rotating-parts test.",1,3,"14 CFR 107.105; 107.110(a); 107.120(a)(2); 107.130(a)(2); 107.140(b)",""],
["I","UA.I.C.K1","You refuse a test for drugs or alcohol requested in connection with an operation. What may follow?",["Denial of an application for up to 1 year, or suspension or revocation of your certificate", "Nothing, refusal is your right", "A civil penalty only, with no effect on the certificate"],0,"<b>107.59</b> makes refusal itself grounds for denial for up to one year and for suspension or revocation.",1,2,"14 CFR 107.59; 14 CFR 91.17(c), (d)",""],
["II","UA.II.B.K9","At night another aircraft shows you a red light on your left and a green light on your right. What is it doing?",["Flying away from you", "Flying toward you", "Hovering in place"],0,"Red is the aircraft's left wingtip, green its right. Seeing red on <b>your</b> left means you are looking at the aircraft's left wing from behind, so it is heading away.",1,3,"FAA Airplane Flying Handbook FAA-H-8083-3C, Chapter 11, Night Operations (Airplane Lighting); ACS UA.II.B.K9 \"Manned aircraft lighting\"",""],
["II","UA.II.B.K3","You are one mile from a non-towered airport in Class G at 200 ft AGL when you hear an aircraft announce a three mile final. What is correct?",["Move clear of the final approach path or land, because you must not interfere with airport operations", "Continue, because Class G imposes no requirement", "Climb to 400 ft AGL so the pilot can see you"],0,"<b>107.43.</b> Not interfering is an active obligation. Climbing puts you closer to the traffic, not further from it.",1,3,"14 CFR 107.43; 14 CFR 107.41 (no ATC authorization needed in Class G); ACS UA.II.B.K3 \"Operations near airports\"",""],
["III","UA.III.B.K1j","A METAR reports SCT015 BKN030 OVC080. What is the ceiling?",["3,000 ft", "1,500 ft", "8,000 ft"],0,"The ceiling is the <b>lowest broken or overcast layer</b>. SCT015 is scattered and does not count, so BKN030, meaning 3,000 ft, is the ceiling.",1,3,"FAA Remote Pilot - sUAS Study Guide (FAA-G-8082-22), Ch. 3a: ceiling definition plus sky cover table (FEW 1/8-2/8, SCT 3/8-4/8, BKN 5/8-7/8, OVC 8/8) and height convention",""],
["III","UA.III.B.K1h","A thunderstorm cell sits eight miles from your site and the sky overhead is clear. Which hazard can still reach you?",["Hail thrown from the top of the cell, and the storm's gust front", "None at that distance", "Only reduced visibility from blowing dust"],0,"Hail is carried well downwind and gust fronts run out ahead of the cell. <b>Clear sky overhead is not clearance</b>.",1,3,"FAA AC 00-24C, Thunderstorms; corroborated by FAA Aviation Weather Handbook FAA-H-8083-28, Ch. 22",""],
["V","UA.V.E.K6","You look directly at a distant object at night and it disappears. Why?",["The center of your vision has few rods and is nearly blind in low light, so off-center viewing is needed", "Your eyes have not yet adjusted to the controller screen", "The object moved out of your field of view"],0,"This is the <b>night blind spot</b>. Scan slightly to the side of what you want to see.",1,3,"FAA Pilot Vision brochure (CAMI) / Airplane Flying Handbook FAA-H-8083-3C Ch.11",""],
["V","UA.V.B.K8","An airport rotating beacon is operating at ten in the morning in Class D airspace. What does that suggest?",["Weather at the field may be below basic VFR minimums", "The control tower is closed", "The airport is a military field"],0,"In Class D a beacon running in daylight commonly indicates the field is IFR. Note that it does not change <b>your</b> part 107 minimums, which remain 3 statute miles and 500 below, 2,000 horizontal.",1,3,"AIM 2-1-9(b) Airport/Heliport Beacons; 14 CFR 107.51(c)-(d)",""],
["V","UA.V.C.K2b","Which practice reduces lithium battery fire risk?",["Charge on a non-combustible surface, never unattended, and never charge a swollen or damaged pack", "Charge at the highest available current to shorten charge time", "Store packs fully charged in a hot vehicle"],0,"Lithium-polymer fires start from <b>heat, physical damage, and overcharge</b>. Charging on a non-combustible surface contains a failure, staying with the pack lets you intervene early, and a swollen or crash-damaged cell is already compromised and must never be recharged. Charging at the highest available current adds heat and thermal-runaway risk, and storing a fully charged pack in a hot vehicle combines the two worst stressors.",1,2,"FAA-S-ACS-10B (Remote Pilot sUAS ACS, eff. April 6, 2021), Area V, Task C, UA.V.C.K2b/K2c; MTSU Remote Pilot sUAS Knowledge Test Study Guide, Task C. Emergency Procedures (lithium battery section). FAA Remote Pilot Study Guide (FAA-G-8082-22) and AC 107-2A contain no lithium-battery charging text.",""],
["V","UA.V.D.K1b","During a complex operation your workload spikes at the worst moment. What does task management ask you to do?",["Plan and prioritize the tasks of the flight in advance, and shed low-priority tasks when workload rises", "Delegate the preflight inspection to a visual observer", "Work faster so every task still gets done"],0,"<b>Workload, planned in advance.</b> Task saturation and channelized attention are how a remote pilot loses situational awareness. Sequence the tasks before you launch, brief the crew on who does what, and when workload spikes drop the things that can wait rather than trying to do everything at once.",0,2,"",""],
["II","UA.II.B.K4a","What is the leading causal factor in aviation accidents?",["Human error, including poor decision making and loss of situational awareness", "Mechanical failure of the airframe", "Unforecast weather"],0,"<b>Human error.</b> FAA training material consistently treats human factors, not mechanical failure, as the leading contributor to accidents. That is precisely why aeronautical decision making, crew resource management and the five hazardous attitudes are tested at all.",0,2,"",""],
["III","UA.III.B.K1d","What are characteristics of a moist, unstable air mass?",["Turbulence and showery precipitation.", "Poor visibility and smooth air.", "Haze and smoke."],0,"Unstable air lets a parcel keep rising once displaced, so moisture builds cumuliform clouds, which produce vertical currents (turbulence) and showery, intermittent rain. Poor visibility with smooth air is the signature of a STABLE moist air mass (stratus, fog, drizzle), and haze and smoke are stable-air traits too because stagnant air traps pollutants. The trap is that both wrong options are real air-mass descriptions, just for stable air.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 12 (Weather Theory), atmospheric stability; FAA-G-8082-22 Remote Pilot Study Guide, weather section",""],
["I","UA.I.B.K16","According to 14 CFR part 107, how may a remote pilot operate an unmanned aircraft in Class C airspace?",["The remote pilot must have prior authorization from the Air Traffic Control (ATC) facility having jurisdiction over that airspace.", "The remote pilot must monitor the Air Traffic Control (ATC) frequency from launch to recovery.", "The remote pilot must contact the Air Traffic Control (ATC) facility after launching the unmanned aircraft."],0,"14 CFR 107.41 says no person may operate a small UA in Class B, C, or D airspace, or within the lateral boundaries of the surface area of Class E designated for an airport, unless that person has PRIOR authorization from ATC. The word that decides this question is \"prior\" — authorization has to exist before the flight, normally via LAANC or a DroneZone request. Part 107 imposes no radio-monitoring requirement, and calling ATC after launch is exactly backwards.",2,3,"14 CFR 107.41",""],
["II","UA.II.A.K1b","According to 14 CFR part 107 the remote pilot in command (PIC) of a small unmanned aircraft planning to operate within Class C airspace",["must use a visual observer.", "is required to file a flight plan.", "is required to receive ATC authorization."],2,"Same rule as question 2: 107.41 requires ATC authorization for Class C. A visual observer is optional under part 107 (107.33 permits one but never requires one; the remote PIC only needs to maintain visual line of sight themselves). Flight plans are an instrument/VFR manned-aviation concept and part 107 has no flight-plan requirement at all.",2,3,"14 CFR 107.41; 14 CFR 107.31; 14 CFR 107.33",""],
["III","UA.III.B.K1a","What effect does high density altitude have on the efficiency of a UA propeller?",["Propeller efficiency is increased.", "Propeller efficiency is decreased.", "Density altitude does not affect propeller efficiency."],1,"A propeller is an airfoil that produces thrust by accelerating a mass of air rearward. High density altitude means thin air, so each revolution moves less mass and generates less thrust, and engine power drops at the same time. The common trap is thinking thin air means less drag on the blades and therefore better performance — the loss of air mass to work on dominates, so efficiency and thrust both fall.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 4/11 (density altitude and performance)",""],
["V","UA.V.B.K6a","(Refer to FAA-CT-8080-2H, Figure 22, area 2.) At Coeur D'Alene which frequency should be used as a Common Traffic Advisory Frequency (CTAF) to monitor airport traffic?",["122.05 MHz.", "135.075 MHz.", "122.8 MHz."],2,"Coeur d'Alene (COE, Pappy Boyington Field) is non-towered and its charted CTAF/UNICOM is 122.8 MHz, printed on the sectional next to a solid magenta circled \"C\". The two distractors are the other frequencies printed in that same area of the chart: 135.075 is the AWOS-3 weather broadcast, and 122.05 is a Boise Radio (Flight Service) remote outlet, neither of which carries airport traffic advisories. The trap is grabbing any nearby number instead of the one flagged by the circled C.",2,3,"FAA Aeronautical Chart User's Guide (airport data block, CTAF circled-C symbol); FAA Chart Supplement / airport facility data for KCOE (CTAF/UNICOM 122.8, AWOS-3 135.075, Boise Radio 122.05)","Figure 22, area 2"],
["I","UA.I.B.K14a","Which technique should a remote pilot use to scan for traffic? A remote pilot should",["systematically focus on different segments of the sky for short intervals.", "concentrate on relative movement detected in the peripheral vision area.", "continuously scan the sky from right to left."],0,"The eye can only resolve detail in the narrow foveal region and needs roughly a second of fixation to focus, so effective scanning means dividing the sky into small blocks and pausing on each one in a systematic sequence. Peripheral vision detects movement but cannot identify or resolve an aircraft, and a continuous sweep never lets the eye stop and focus, so distant traffic simply never registers. The trap is that a smooth continuous sweep feels more thorough while actually seeing less.",2,3,"AIM 8-1-6 (Vision in Flight, scanning for other aircraft); FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 14 (collision avoidance)",""],
["IV","UA.IV.A.K1a","(Refer to FAA-CT-8080-2H, Figure 2.) If an unmanned airplane weighs 33 pounds, what approximate weight would the airplane structure be required to support during a 30° banked turn while maintaining altitude?",["34 pounds.", "47 pounds.", "38 pounds."],2,"In a level turn, load factor equals 1/cos(bank angle); at 30° that is 1.154 G, which the Figure 2 load-factor chart shows as about 1.15. 33 lb x 1.154 = 38.1 lb, so 38 pounds. 47 pounds corresponds to roughly a 45° bank (1.41 G) and 34 pounds to about a 15° bank — the trap is misreading the steeply curving chart or assuming load factor rises linearly with bank angle, when it actually stays nearly flat to 30° and then climbs sharply.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 5 (load factor vs. bank angle chart)","Figure 2"],
["II","UA.II.A.K1b","(Refer to FAA-CT-8080-2H, Figure 23, area 3.) What is the floor of the Savannah Class C airspace at the shelf area (outer circle)?",["1,300 feet AGL.", "1,300 feet MSL.", "1,700 feet MSL."],1,"Class C airspace is charted with a magenta pair of numbers (here 41/13) where the top figure is the ceiling and the bottom is the floor, both in hundreds of feet MSL — so 13 means 1,300 feet MSL. Every charted airspace altitude on a sectional is MSL unless it is explicitly suffixed AGL, which makes option A wrong on the units alone. 1,700 feet MSL is a plausible-looking number that does not match the shelf value. The trap is the AGL/MSL swap, not the digits.",2,3,"FAA Aeronautical Chart User's Guide (Class C airspace depiction); AIM 3-2-4 (Class C Airspace)","Figure 23, area 3"],
["V","UA.V.B.K6a","(Refer to FAA-CT-8080-2H, Figure 20, area 3.) With ATC authorization, you are operating your small unmanned aircraft approximately 4 SM southeast of Elizabeth City Regional Airport (ECG). What hazard is indicated to be in that area?",["High density military operations in the vicinity.", "Unmarked balloon on a cable up to 3,008 feet AGL.", "Unmarked balloon on a cable up to 3,008 feet MSL."],2,"The sectional carries a blue dashed CAUTION box southeast of Elizabeth City warning of an unmarked tethered balloon on a cable to 3,008 feet MSL. As with all charted obstruction and airspace altitudes, the figure is referenced to mean sea level, because a pilot's altimeter reads MSL and has no direct AGL readout. There are no high-density military operations charted at that spot, so the whole question reduces to the AGL-versus-MSL trap between options B and C.",2,3,"FAA Aeronautical Chart User's Guide (caution boxes and obstruction altitudes charted in MSL)","Figure 20, area 3"],
["II","UA.II.A.K2","(Refer to FAA-CT-8080-2H, Figure 21.) You have been hired by a farmer to use your small UA to inspect his crops. The area that you are to survey is in the Devil's Lake West MOA, east of area 2. How would you find out if the MOA is active?",["Refer to the chart legend.", "This information is available in the Small UAS database.", "Refer to the Military Operations Directory."],0,"Military Operations Areas are outlined in magenta hatching on the sectional and their times of use, affected altitudes, and controlling agency are tabulated in the Special Use Airspace panel on the chart legend (the back/margin of the sectional). The FAA Remote Pilot Study Guide states the MOA is further defined on the back of the sectional charts with times of operation, altitudes affected, and the controlling agency. There is no \"Small UAS database\" or \"Military Operations Directory\" — both are invented names, which is the giveaway.",2,3,"FAA-G-8082-22 Remote Pilot Study Guide (MOA depiction and Special Use Airspace panel); FAA Aeronautical Chart User's Guide, Special Use Airspace legend; AIM 3-4-5","Figure 21"],
["V","UA.V.B.K6b","The most comprehensive information on a given airport is provided by",["the Chart Supplements U.S. (formerly Airport Facility Directory).", "Notices to Airmen (NOTAMS).", "Terminal Area Chart (TAC)."],0,"The Chart Supplement U.S. is the FAA's directory of airport data: runway dimensions and surface, lighting, all communication and navaid frequencies, services, traffic pattern altitudes, remarks and special procedures. NOTAMs only report temporary changes to what is already published, so they are supplemental rather than comprehensive. A Terminal Area Chart is a graphic product showing airspace and landmarks around busy airports, not a data reference for one airport.",2,3,"AIM 9-1-4 (Chart Supplement U.S.); FAA Aeronautical Chart User's Guide",""],
["V","UA.V.D.K4","Identify the hazardous attitude or characteristic a remote pilot displays while taking risks in order to impress others?",["Impulsivity.", "Invulnerability.", "Macho."],2,"Macho is the hazardous attitude defined by \"I can do it\" — trying to prove oneself by taking risks, often for an audience; its antidote is \"Taking chances is foolish.\" Impulsivity is \"Do something quickly,\" the urge to act without thinking it through, and Invulnerability is \"It won't happen to me,\" underestimating personal exposure to an accident. The phrase \"to impress others\" is the exact tell for Macho.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 2 (Aeronautical Decision-Making, five hazardous attitudes and antidotes)",""],
["V","UA.V.B.K6a","(Refer to FAA-CT-8080-2H, Figure 26, area 4.) You have been hired to inspect the tower under construction at 46.9N and 98.6W, near Jamestown Regional (JMS). What must you receive prior to flying your unmanned aircraft in this area?",["Authorization from the military.", "Authorization from ATC.", "Authorization from the National Park Service."],1,"Jamestown Regional is enclosed by a dashed magenta circle, which depicts a Class E surface area designated for an airport, and 107.41 requires prior ATC authorization before operating inside the lateral boundaries of that surface area. Neither of the other two answers is an aviation authority for airspace: the military does not issue part 107 airspace authorizations, and the National Park Service manages land use, not airspace. Note that even without reading the chart, ATC is the only body that grants part 107 airspace authorization.",2,3,"14 CFR 107.41; FAA Aeronautical Chart User's Guide (dashed magenta = Class E surface area)","Figure 26, area 4"],
["II","UA.II.B.K5","(Refer to FAA-CT-8080-2H, Figure 20, area 5.) How would a remote PIC \"CHECK NOTAMS\" as noted in the CAUTION box regarding the unmarked balloon?",["By utilizing the B4UFLY mobile application.", "By contacting the FAA district office.", "By obtaining a briefing via an online source such as: 1800WXBrief.com."],2,"NOTAMs are obtained through Flight Service, either by phone at 1-800-WX-BRIEF or online at 1800wxbrief.com, which is the standard pre-flight briefing channel. B4UFLY is an airspace awareness app that tells a recreational or part 107 flyer what airspace they are in; it is not a NOTAM source and does not deliver a briefing. A Flight Standards District Office handles certification and enforcement, not NOTAM distribution.",2,3,"AIM 5-1-3 (Notice to Air Missions System) and AIM 5-1-1/5-1-2 (Preflight Preparation and Flight Service briefings); FAA-G-8082-22 Remote Pilot Study Guide","Figure 20, area 5"],
["V","UA.V.D.K2","When adapting crew resource management (CRM) concepts to the operation of a small UA, CRM must be integrated into",["the flight portion only.", "all phases of the operation.", "the communications only."],1,"CRM is the effective use of all available resources — people, hardware and information — and the FAA applies it across planning, preflight inspection, launch, flight, recovery and post-flight, not just the time the aircraft is airborne. Limiting it to the flight portion ignores that most accident chains start during planning and preflight. Restricting it to communications confuses one element of CRM with the whole discipline.",2,3,"AC 107-2A, Ch. 5 (ADM and CRM); FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 2",""],
["V","UA.V.D.K4","You have been hired as a remote pilot by a local TV news station to film breaking news with a small UA. You expressed a safety concern and the station manager has instructed you to \"fly first, ask questions later.\" What type of hazardous attitude does this attitude represent?",["Machismo.", "Invulnerability.", "Impulsivity."],2,"Impulsivity is the \"Do something quickly\" attitude — acting on the first impulse without stopping to think or to resolve a known concern; \"fly first, ask questions later\" is almost a definition of it. Machismo is risk-taking to prove ability or impress others, and Invulnerability is believing an accident will not happen to you; neither is what the manager expressed. The trap is that a pushy manager feels macho, but the substance of the instruction is haste, not showing off.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 2 (five hazardous attitudes; Impulsivity antidote: \"Not so fast. Think first.\")",""],
["V","UA.V.D.K1","A local TV station has hired a remote pilot to operate their small UA to cover news stories. The remote pilot has had multiple near misses with obstacles on the ground and two small UAS accidents. What would be a solution for the news station to improve their operating safety culture?",["The news station should implement a policy of no more than five crashes/incidents within 6 months.", "The news station does not need to make any changes; there are times that an accident is unavoidable.", "The news station should recognize hazardous attitudes and situations and develop standard operating procedures that emphasize safety."],2,"A safety culture is built by identifying hazards and hazardous attitudes and then writing standard operating procedures that make the safe action the default, which is exactly what the pattern of near misses and accidents calls for. Setting a tolerated crash quota institutionalizes the hazard instead of removing it, and declaring accidents unavoidable is the Resignation attitude dressed up as policy. The trap is that option A looks like a rule and therefore like action, but a limit on accidents is not a control on causes.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 2 (risk management, hazardous attitudes); AC 107-2A, Ch. 5",""],
["V","UA.V.A.K3","(Refer to FAA-CT-8080-2H, Figure 26, area 2.) While monitoring the Cooperstown CTAF you hear an aircraft announce that they are midfield left downwind to RWY 13. Where would the aircraft be relative to the runway?",["The aircraft is East.", "The aircraft is South.", "The aircraft is West."],0,"Runway 13 means a landing heading of about 130 degrees, so downwind is flown on the reciprocal, about 310 degrees. \"Left downwind\" means the runway lies off the aircraft's left wing, which at a 310-degree heading is a bearing of about 220 degrees from the aircraft — putting the aircraft roughly northeast of the runway, and East is the only option in that half of the compass. The trap is reading left and right from the ground observer's point of view instead of from the cockpit.",2,3,"AIM 4-3-3 (Traffic Patterns) and AIM 4-1-9 (Traffic Advisory Practices at Airports Without Operating Control Towers)","Figure 26, area 2"],
["V","UA.V.C.K1","To avoid a possible collision with a manned airplane, you estimate that your small UA climbed to an altitude greater than 600 feet AGL. To whom must you report the deviation?",["Air Traffic Control.", "The National Transportation Safety Board.", "Upon request of the Federal Aviation Administration."],2,"Climbing above the 400-foot AGL limit of 107.51 to avoid a collision is an in-flight emergency deviation, and 107.21(b) says the remote PIC must, upon request of the Administrator, send a written report of that deviation to the Administrator. So the report is owed to the FAA and only if the FAA asks — nothing is required proactively. The NTSB handles accidents under 49 CFR 830, which this was not, and there is no part 107 duty to report a deviation to ATC. The trap is assuming a deviation must be self-reported immediately.",2,3,"14 CFR 107.21(b); 14 CFR 107.51(b); 14 CFR 107.9",""],
["IV","UA.IV.A.K1a","When operating an unmanned airplane, the remote pilot should consider that the load factor on the wings may be increased any time",["the CG is shifted rearward to the aft CG limit.", "the airplane is subjected to maneuvers other than straight-and-level flight.", "the gross weight is reduced."],1,"Load factor is the ratio of lift to weight, and it exceeds 1 G whenever the wings must produce more lift than weight — which happens in turns, pull-ups and abrupt maneuvers, that is, anything other than unaccelerated straight-and-level flight. Moving the CG aft changes stability and elevator effectiveness but does not by itself increase load factor. Reducing gross weight lowers the actual load the structure carries, so it works against the premise, not for it.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 5 (Load Factors)",""],
["IV","UA.IV.A.K1b","A stall occurs when the smooth airflow over the unmanned airplane's wing is disrupted and the lift degenerates rapidly. This is caused when the wing",["exceeds the maximum speed.", "exceeds maximum allowable operating weight.", "exceeds its critical angle of attack."],2,"A stall is purely a function of angle of attack: past the critical angle, roughly 15 to 20 degrees for most airfoils, the airflow separates from the upper surface and lift drops off sharply. That is why a wing can stall at any airspeed, any weight and any attitude — the trap in this question. Exceeding maximum speed causes structural or flutter problems, and exceeding maximum weight raises stall speed but is not itself the cause of the stall.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 5 (Aerodynamics of Flight, stalls and critical angle of attack)",""],
["V","UA.V.D.K1","Safety is an important element for a remote pilot to consider prior to operating an unmanned aircraft system. To prevent the final \"link\" in the accident chain, a remote pilot must consider which methodology?",["Crew Resource Management.", "Safety Management System.", "Risk Management."],2,"Risk management is the FAA's decision-making methodology — relying on situational awareness, problem recognition and good judgment to identify hazards and reduce the risk of each flight — and it is what an individual remote pilot applies to break a link before the chain ends in an accident. CRM is one component of ADM about using available resources effectively, narrower than what the question asks. A Safety Management System is an organization-level formal program, not a methodology an individual pilot applies before a flight. The trap is that SMS sounds the most official.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 2 (Aeronautical Decision-Making: risk management, the chain of events); FAA-H-8083-2 Risk Management Handbook",""],
["V","UA.V.E.K5","You are a remote pilot for a co-op energy service provider. You are to use your UA to inspect power lines in a remote area 15 hours away from your home office. After the drive, fatigue impacts your abilities to complete your assignment on time. Fatigue can be recognized",["easily by an experienced pilot.", "as being in an impaired state.", "by an ability to overcome sleep deprivation."],1,"The FAA treats fatigue as an impairment comparable to alcohol or illness: it degrades attention, reaction time and judgment, and the correct recognition is simply to identify yourself as impaired and not fly. Fatigue is insidious precisely because it is NOT easily recognized — experience offers no protection and often masks it, so option A is the trap. Option C inverts the concept entirely; sleep deprivation cannot be willed away, only slept off.",2,3,"FAA-H-8083-25 Pilot's Handbook of Aeronautical Knowledge, Ch. 17 (Aeromedical Factors, fatigue); AIM 8-1-1",""],
["V","UA.V.B.K6a","(Refer to FAA-CT-8080-2H, Figure 21.) What airport is located approximately 47 (degrees) 40 (minutes) N latitude and 101 (degrees) 26 (minutes) W longitude?",["Mercer County Regional Airport.", "Semshenko Airport.", "Garrison Airport."],2,"Garrison Municipal Airport (D05) sits at 47°39'21\"N / 101°26'12\"W, which rounds to the 47°40'N 101°26'W given in the stem. Mercer County Regional (HZE) is far to the south and west at 47°17'N / 101°35'W, so it fails on both coordinates. The trap is reading only the longitude, which is nearly identical for both fields — latitude is what separates them, so always check both halves of the coordinate pair.",2,3,"FAA airport data: Garrison Municipal (D05) 47°39'21.76\"N 101°26'12.49\"W; Mercer County Regional (HZE) 47°17'23.77\"N 101°34'51.52\"W. Chart: FAA-CT-8080-2H Figure 21.","(Refer to FAA-CT-8080-2H, Figure 21.)"],
["III","UA.III.A.K2","(Refer to FAA-CT-8080-2H, Figure 12.) What are the current conditions for Chicago Midway Airport (KMDW)?",["Sky 700 feet overcast, visibility 1-1/2SM, rain.", "Sky 7,000 feet overcast, visibility 1-1/2SM, heavy rain.", "Sky 700 feet overcast, visibility 11, occasionally 2SM, with rain."],0,"The report reads SPECI KMDW 121856Z 32005KT 1 1/2SM RA OVC007 17/16 A2980. Cloud heights in a METAR are three digits in hundreds of feet AGL, so OVC007 is 700 feet overcast, and bare 'RA' is moderate rain. Choice B makes two errors at once — it slides the decimal to read 7,000 feet and upgrades RA to heavy rain, which would have to be coded '+RA'. Choice C garbles the visibility group, which is plainly '1 1/2SM'.",2,3,"FAA-CT-8080-2H Figure 12 METAR; AIM 7-1-29 (METAR sky condition coded in hundreds of feet; '+' denotes heavy, no prefix denotes moderate).","(Refer to FAA-CT-8080-2H, Figure 12.)"],
["III","UA.III.A.K2","(Refer to FAA-CT-8080-2H, Figure 12.) The wind direction and velocity at KJFK is from",["180° true at 4 knots.", "180° magnetic at 4 knots.", "040° true at 18 knots."],0,"The KJFK group is 18004KT: the first three digits are direction and the last two are speed, giving 180 degrees at 4 knots. Winds in a written/coded report such as a METAR are always referenced to TRUE north; only winds spoken to you over the radio by ATC, tower, or ATIS are magnetic. That true-versus-magnetic distinction is the whole point of the question, since A and B agree on the numbers. Choice C simply transposes the digits.",2,3,"FAA-CT-8080-2H Figure 12 (KJFK 121853Z 18004KT); AIM 7-1-29 and PHAK — coded reports use true north, radio-transmitted winds use magnetic.","(Refer to FAA-CT-8080-2H, Figure 12.)"],
["I","UA.I.B.K9","According to 14 CFR part 107, what is required to operate a small UA within 30 minutes after official sunset?",["Use of anti-collision lights.", "Must be operated in a rural area.", "Use of a transponder."],0,"The 30 minutes after official sunset is civil twilight, defined at 14 CFR 107.29(c)(2). Section 107.29(b) forbids operating during civil twilight unless the aircraft has lighted anti-collision lighting visible for at least 3 statute miles. Part 107 imposes no rural-area restriction and no transponder requirement on small UAS, so B and C are inventions. Note the rule covers intensity too: the RPIC may dim the lights for safety but may never extinguish them.",2,3,"14 CFR 107.29(b) and 107.29(c)(2) (eCFR).",""],
["IV","UA.IV.A.K1b","To ensure that the unmanned aircraft center of gravity (CG) limits are not exceeded, follow the aircraft loading instructions specified in the",["Pilot's Operating Handbook or UAS Flight Manual.", "Aeronautical Information Manual (AIM).", "Aircraft Weight and Balance Handbook."],0,"CG and loading limits are specific to one make and model, so they can only come from that aircraft's own documentation — the Pilot's Operating Handbook or UAS Flight Manual supplied by the manufacturer. The AIM is a general airspace and procedures publication and contains no aircraft-specific loading data. The Aircraft Weight and Balance Handbook teaches the method of computing weight and balance but carries no limits for your particular aircraft, which is the trap in choice C.",2,3,"FAA Remote Pilot – sUAS Study Guide (FAA-G-8082-22), Loading and Performance; AC 107-2A ch. 5.",""],
["I","UA.I.B.K20","According to 14 CFR part 107, who is responsible for determining the performance of a small unmanned aircraft?",["Remote pilot-in-command.", "Manufacturer.", "Owner or operator."],0,"14 CFR 107.19 makes the remote pilot in command directly responsible for and the final authority as to the operation of the small UAS, and 107.49 requires the RPIC to assess the operating environment and the aircraft before every flight. The manufacturer publishes performance data, but publishing data is not the same as determining whether the aircraft can perform the intended flight in today's conditions. The owner may never touch the controls; part 107 assigns operational responsibility to the RPIC, not to ownership.",2,3,"14 CFR 107.19 and 107.49 (eCFR).",""],
["II","UA.II.A.K2","(Refer to FAA-CT-8080-2H, Figure 59, area 2.) The chart shows a gray line with \"VR1667, VR1617, VR1638, and VR1668.\" Could this area present a hazard to the operations of a small UA?",["No, all operations will be above 400 feet.", "Yes, this is a Military Training Route from the surface to 1,500 feet AGL.", "Yes, the defined route provides traffic separation to manned aircraft."],1,"'VR' identifies a VFR Military Training Route, and the digit count encodes the altitude: four number characters (VR1667) means no segment of the route goes above 1,500 feet AGL, while three characters (VR667) would mean at least one segment is above it. So this route puts fast military traffic in the same surface-to-1,500-foot band a small UA flies in. Choice C states the opposite of the truth — MTRs provide no traffic separation at all; nonparticipating aircraft are not excluded and must simply stay vigilant. You can answer this without seeing the chart, because the route designators are quoted in the stem.",2,3,"AIM 3-5-2 (MTRs with no segment above 1,500 ft AGL are identified by four number characters; three characters if any segment is above; nonparticipating aircraft are not prohibited and no separation is provided).","(Refer to FAA-CT-8080-2H, Figure 59, area 2.)"],
["V","UA.V.B.K6a","(Refer to FAA-CT-8080-2H, Figure 26.) What does the line of latitude at area 4 measure?",["The degrees of latitude east and west of the Prime Meridian.", "The degrees of latitude north and south of the equator.", "The degrees of latitude east and west of the line that passes through Greenwich, England."],1,"Lines of latitude (parallels) run east-west around the globe and measure angular distance north or south of the equator, which is the zero-degree reference. Both wrong answers describe LONGITUDE while using the word 'latitude' — and choices A and C are actually the same statement twice, since the Prime Meridian is the line through Greenwich, England. That duplication is the giveaway: two identical options cannot both be correct, so the odd one out is the answer. No chart reading is needed here.",2,3,"FAA Aeronautical Chart User's Guide, Latitude and Longitude; PHAK ch. 16 (Navigation).","(Refer to FAA-CT-8080-2H, Figure 26.)"],
["V","UA.V.F.K1","Under what condition should the operator of a small UA establish scheduled maintenance protocol?",["When the manufacturer does not provide a maintenance schedule.", "UAS does not need a required maintenance schedule.", "When the FAA requires you to, following an accident."],0,"FAA guidance says that when the manufacturer supplies no scheduled maintenance instructions, the operator should establish their own scheduled maintenance protocol and document every repair, modification, overhaul, or replacement, building a reliable schedule from accumulated time-in-service data. Choice B is false because 14 CFR 107.15 requires the aircraft be kept in a condition for safe operation regardless. Choice C inverts the logic — maintenance is preventive and proactive, not something the FAA imposes after you have already had an accident.",2,3,"AC 107-2A ch. 7 (Small UAS Maintenance and Inspection); 14 CFR 107.15.",""],
["V","UA.V.F.K2","According to 14 CFR part 107, the responsibility to inspect the small UAS to ensure it is in a safe operating condition rests with the",["remote pilot-in-command.", "visual observer.", "owner of the small UAS."],0,"14 CFR 107.15(b) requires the remote pilot in command to check the small UAS before each flight to determine it is in a condition for safe operation, and 107.49 sets out that preflight inspection duty. The visual observer's only job is to see and avoid — maintaining visual line of sight and scanning for traffic — not to airworthy the aircraft. The owner may have no role in the flight at all; part 107 attaches this duty to the operating role, not to the title.",2,3,"14 CFR 107.15(b) and 107.49 (eCFR).",""],
