/* Readiness levels and the gate. Deliberately harder than the legal pass mark. */
var LEVELS=["Foundation","Developing","Proficient","Nearly Ready","Exam Ready","High-Confidence Ready"];

function assess(state){
 var ev=decayedEvidence(state.log);
 var pp=pPass(ev),p=pp.p;
 var checks=[],ok=true;

 /* 1. per-area floors and minimum evidence */
 for(var i=0;i<AREAS.length;i++){
  var a=AREAS[i],e=ev[a.id],pc=areaPct(e);
  var need=Math.max(15,a.n60);
  var passArea=(pc!==null&&pc>=a.floor&&e.n>=need);
  checks.push({k:a.name,ok:passArea,
   d:pc===null?("no evidence yet, need "+need+" answers"):
     (pc+"% correct vs "+a.floor+"% floor · "+e.n+" answers logged, "+need+" needed")});
  if(!passArea)ok=false;
 }
 /* 2. validation-bank performance, computed separately */
 var vr=0,vw=0;
 for(var j=0;j<state.log.length;j++){var L=state.log[j];if(L.val&&L.ms>=MIN_MS){if(L.ok)vr++;else vw++}}
 var vt=vr+vw, vpc=vt?Math.round(vr/vt*100):null;
 var vOK=(vt>=20&&vpc>=90);
 checks.push({k:"Protected validation bank",ok:vOK,d:vt?(vpc+"% over "+vt+" unseen items, need 90% over 20"):"not attempted"});
 if(!vOK)ok=false;

 /* 3. two full simulations at 85%+ */
 var good=0;for(var m=0;m<state.exams.length;m++)if(state.exams[m].mode==="full"&&state.exams[m].pct>=85)good++;
 var eOK=good>=2;
 checks.push({k:"Full simulations at 85%+",ok:eOK,d:good+" of 2"});
 if(!eOK)ok=false;

 /* 4. one challenge simulation passed */
 var ch=0;for(var n=0;n<state.exams.length;n++)if(state.exams[n].mode==="challenge"&&state.exams[n].pct>=80)ch++;
 var cOK=ch>=1;
 checks.push({k:"Challenge simulation at 80%+",ok:cOK,d:ch+" of 1"});
 if(!cOK)ok=false;

 /* 5. no unresolved confident-wrong misconceptions */
 var mis=state.misconceptions.length;
 var mOK=mis===0;
 checks.push({k:"Unresolved misconceptions",ok:mOK,d:mis?(mis+" concept"+(mis>1?"s":"")+" answered wrong while marked certain"):"none"});
 if(!mOK)ok=false;

 /* 6. evidence spread over at least 3 distinct days */
 var days={};for(var q=0;q<state.log.length;q++)days[new Date(state.log[q].at).toDateString()]=1;
 var nd=Object.keys(days).length, dOK=nd>=3;
 checks.push({k:"Study spread across days",ok:dOK,d:nd+" of 3 distinct days"});
 if(!dOK)ok=false;

 /* 7. model must itself be confident */
 var pOK=p>=0.97;
 checks.push({k:"Modelled P(pass) at or above 97%",ok:pOK,d:pStr(p)});
 if(!pOK)ok=false;

 /* level */
 var lvl=0, passed=0;
 for(var z=0;z<checks.length;z++)if(checks[z].ok)passed++;
 var frac=passed/checks.length;
 if(ok)lvl=5; else if(frac>=0.85)lvl=4; else if(frac>=0.65)lvl=3; else if(frac>=0.4)lvl=2; else if(frac>0)lvl=1;

 /* areas whose answers are still short of the minimum for their floor make the number provisional */
 var thin=0;for(var t2=0;t2<AREAS.length;t2++){if(ev[AREAS[t2].id].n<Math.max(15,AREAS[t2].n60))thin++}
 return {ev:ev,p:p,lo:pp.lo,hi:pp.hi,thin:thin,checks:checks,ready:ok,level:lvl,valPct:vpc,valN:vt,goodExams:good,challenge:ch};
}

/* Study-to-pass: what to do next, in priority order */
function nextAction(state,A){
 var ev=A.ev;
 /* 0. nothing logged yet: the 21 question diagnostic is the designed entry point */
 if(!state.log.length)return {label:"Take the diagnostic",why:"21 weighted questions across all five areas. Twenty minutes, and every number on this page becomes about you instead of a placeholder.",drill:"diag"};
 /* 1. unresolved misconception */
 if(state.misconceptions.length)return {label:"Resolve a misconception",why:"You answered this while marked Certain and got it wrong. That is a wrong belief, not a gap.",drill:"mis"};
 /* 2. overdue spaced review */
 var due=dueCount(state);
 if(due>=8)return {label:"Clear "+due+" overdue reviews",why:"Knowledge decays. These concepts are past their review date.",drill:"srs"};
 /* 3. weakest area below floor */
 var worst=null;
 for(var i=0;i<AREAS.length;i++){var a=AREAS[i],e=ev[a.id],pc=areaPct(e);
  var need=Math.max(15,a.n60);
  if(pc===null||e.n<need||pc<a.floor){var deficit=(pc===null?100:a.floor-pc)*a.wt;
   if(!worst||deficit>worst.d)worst={a:a,d:deficit,pc:pc,n:e.n,need:need}}}
 if(worst)return {label:"Drill "+worst.a.name,
  why:worst.pc===null?("No evidence yet in an area worth "+worst.a.wt+"% of the exam."):
   ("At "+worst.pc+"% against a "+worst.a.floor+"% floor, in an area worth "+worst.a.wt+"% of the exam."),
  drill:worst.a.id};
 /* 4. exams */
 if(A.goodExams<2)return {label:"Take a full simulation",why:"You need two 60-question simulations at 85% or better.",drill:"full"};
 if(A.challenge<1)return {label:"Take the challenge simulation",why:"Harder than the real exam. Passing it is the last gate.",drill:"challenge"};
 if(A.valN<20)return {label:"Take the validation exam",why:"Unseen items are the only honest measure of whether you understand or merely remember.",drill:"validation"};
 return {label:"Maintain with mixed review",why:"You are at standard. Keep evidence fresh until test day.",drill:"mixed"};
}

/* ============================================================
   LAB KIT · the shared visual language of every Lab module
   One stage frame, one label system, one control set, one
   explanation card, one predict-then-reveal card. Modules build
   their SVG with these helpers so the whole Lab reads as one
   instrument suite.

   Stages
     lkStage({title, readouts, svg, badge, paper, foot})
       "instrument" stage: deep navy glass-cockpit panel (both themes)
       paper:true  : chart-paper stage for sectional-style drawings
   SVG geometry
     lkDims(desktopW, desktopH, phoneW, phoneH) picks the viewBox for
     the current screen. Phone viewBoxes are about 340 units wide so
     1 unit ~ 1 CSS px on a 390 px phone; 12 units of type = 12 px.
   Text in SVG
     Always horizontal. lkText() paints a halo (paint-order stroke) so
     labels stay readable over lines and fills. lkLabel() adds an
     optional leader line from the label to the thing it names.
   Interaction
     lkHot(key, inner, hit, label, on): a <g data-hot> with a
     transparent hit area of at least 44x44 px, role=button,
     aria-label. The app's click and keyboard routers handle it.
     lkSeg(): segmented control (44 px tall buttons).
     lkPredict(): observe, predict, reveal. State lives in st.lkp.
   ============================================================ */

 h+='<p class="lede">Nine interactive diagrams covering the parts of this exam that are genuinely hard to learn from a paragraph. Tap anything.</p></div><div class="col lkA-page">';

 if(!cur){
  h+='<div class="lkA-grid">';
  for(i=0;i<VIS.length;i++){
   h+='<button type="button" class="lkA-tile" data-vis="'+VIS[i].id+'">'+lkAThumb(VIS[i].id)+'<span class="lkA-tt"><span class="lkA-th">'+esc(VIS[i].t)+'</span><span class="lkA-tb">'+esc(VIS[i].b)+'</span></span></button>';
  }
  h+='</div>';
  h+='<div class="call slatec"><span class="stamp">Why this exists</span><h3>Charts are now the part you cannot memorize</h3>';
  h+='<p>From 26 October the exam puts chart images on screen that are not in the printed supplement. That means the skill being tested is reading a sectional you have never seen, which is a visual skill, not a recall one. The first four diagrams here are the ones that matter most for that.</p></div>';
  h+='</div>';
  return h;
 }

 var m=null;
 for(i=0;i<VIS.length;i++)if(VIS[i].id===cur)m=VIS[i];
 if(!m){st.visMod=null;return vVisual();}

 h+='<div class="row" style="margin-top:0"><button class="btn gh" data-vis="">All diagrams</button></div>';
 h+='<h2 style="margin-top:18px">'+esc(m.t)+'</h2><p class="mut">'+esc(m.b)+'</p>';

 else{

  var p='<div class="lk-panel">'+(m.controls?m.controls(c):'')+lkGroup(m.id==="metar"?"Report groups":"Parts of the drawing",lkAKeys(m.hot,c,m.t))+'</div>';

var ACSREF={};

/* WP7: the site ships the question bank as qb.json (assemble.py), fetched once the first view
   has painted, so the welcome screen and dashboard never wait for it. The artifact keeps QB
   inline. Anything that needs a question goes through onQB(); views that list questions show
   qbWaitCard() until the bank is in. The array is filled in place: QB stays the same object. */
var QB_OK=QB.length>0,QB_ERR="",_qbWait=[],_qbBusy=0;
function onQB(fn){if(QB_OK)fn();else{_qbWait.push(fn);qbLoad()}}
function qbLoad(){
 if(QB_OK||_qbBusy||typeof __QB_URL==="undefined")return;
 _qbBusy=1;QB_ERR="";
 var ok=function(rows){
  _qbBusy=0;if(!Array.isArray(rows)||!rows.length){bad(new Error("the file was empty"));return}
  QB.length=0;Array.prototype.push.apply(QB,rows);QB_OK=true;buildAcsRef();
  if(window.performance)window.__qbAt=performance.now();
  var w=_qbWait;_qbWait=[];for(var i=0;i<w.length;i++)try{w[i]()}catch(e){if(window.console)console.error(e)}
  if(st.qbGate){st.qbGate=0;st.keepScroll=1;render()}
 };
 var bad=function(e){_qbBusy=0;QB_ERR=String((e&&e.message)||e||"network error");

  if(st.qbRunWait){st.qbRunWait=0;if(st.run)st.run.paused=1}
  if(st.qbGate){st.keepScroll=1;render()}};
 /* fetch() over http(s); a page opened from disk can only use XHR */
 if(location.protocol!=="file:"&&window.fetch)fetch(__QB_URL).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(ok,bad);
 else{var x=new XMLHttpRequest();x.open("GET",__QB_URL);
  x.onload=function(){if(x.status&&x.status!==200){bad(new Error("HTTP "+x.status));return}var rows;try{rows=JSON.parse(x.responseText)}catch(e){bad(e);return}ok(rows)};
  x.onerror=function(){bad(new Error("could not read qb.json"))};x.send()}
}

function refFor(q){
 if(q.cite&&q.url)return {cite:q.cite,url:q.url};
 if(!q.acs)return null;

 /* parent codes such as UA.I.B.K21 resolve to the first child, UA.I.B.K21a */

}

function trainPool(area){var o=[];for(var i=0;i<QB.length;i++)if(QB[i][6]===0&&(!area||QB[i][0]===area))o.push(i);return o}
function valPool(area){var o=[];for(var i=0;i<QB.length;i++)if(QB[i][6]===1&&(!area||QB[i][0]===area))o.push(i);return o}

/* Low-variety generators (a limit that rotates through five values, say) can emit
   the same stem twice inside one 60-question set. A repeat is not extra evidence
   and it looks broken, so any duplicate is swapped for a fresh generated instance
   or an unused static item from the same area. */
function itemKey(q){return q.gen?("g:"+q.g+":"+q.q):("s:"+q.idx)}
function dedupe(out){
 var seen={},res=[],i,j,t;
 for(i=0;i<out.length;i++){
  var q=out[i],key=itemKey(q);
  if(!seen[key]){seen[key]=1;res.push(q);continue}
  var fixed=null;
  for(t=0;t<12&&!fixed;t++){var g=genAny(q.t);if(g){var k2=itemKey(g);if(!seen[k2]){seen[k2]=1;fixed=g}}}
  if(!fixed){var pool=shuf(trainPool(q.t));
   for(j=0;j<pool.length;j++){if(!seen["s:"+pool[j]]){seen["s:"+pool[j]]=1;fixed=qItem(pool[j]);break}}}
  if(fixed)res.push(fixed);

}

function docPool(){
 /* UA.I.E.* is Operations Over Human Beings. The FAA reports UA.I.E.K13,
    Declaration of Compliance, as the most-missed code on the UAG exam. */
 var o=[];for(var i=0;i<QB.length;i++)if(QB[i][1].indexOf("UA.I.E.")===0&&QB[i][6]!==1)o.push(i);

}
/* Final 72 hours. Highest yield first: things you have actually got wrong,
   confident errors, overdue reviews, the most-missed topic, then the numeric
   rules and chart items that decide the marginal questions. Capped at 40. */
function cramSet(){
 var out=[],seen={},i,k,idx;
 function add(q){var key=itemKey(q);if(seen[key])return;seen[key]=1;out.push(q)}
 /* 1. every static item you have ever missed */
 var missed={};for(i=0;i<st.log.length;i++){var L=st.log[i];if(!L.ok&&L.c&&L.c.indexOf("A:")===0)missed[L.c.slice(2)]=1}
 for(i=0;i<QB.length;i++)if(missed[QB[i][1]]&&QB[i][6]===0)add(qItem(i));
 /* 2. open misconceptions */
 for(i=0;i<st.misconceptions.length;i++){var m=st.misconceptions[i];
  if(m.indexOf("A:")===0){var code=m.slice(2);for(k=0;k<QB.length;k++)if(QB[k][1]===code&&QB[k][6]===0)add(qItem(k))}}
 /* 3. overdue reviews */
 var now=Date.now();for(var key in st.srs)if(st.srs[key].due<=now&&key.indexOf("A:")===0){
  var c2=key.slice(2);for(k=0;k<QB.length;k++)if(QB[k][1]===c2&&QB[k][6]===0){add(qItem(k));break}}
 /* 4. the most-missed topic on the real exam, Subpart D */
 var dp=shuf(docPool());for(i=0;i<dp.length&&i<8;i++)add(qItem(dp[i]));
 /* 5. numeric rules and chart reading, generated so they are fresh */
 var gens=["g-limits","g-cloud","g-agl","g-obst","g-sector","g-mef","g-report","g-currency","g-cat","g-metar","g-load"];
 for(i=0;i<gens.length;i++){for(k=0;k<GEN.length;k++)if(GEN[k].id===gens[i]){add(genItem(k));break}}
 /* 6. fill from Regulations, the 48% area, then Airspace */
 var fill=shuf(trainPool("I")).concat(shuf(trainPool("II")));
 for(i=0;i<fill.length&&out.length<40;i++)add(qItem(fill[i]));
 return shuf(out).slice(0,40);
}
function buildSet(mode){
 var out=[],i,k;
 if(mode==="cram")return cramSet();
 if(mode==="figs"){for(i=0;i<QB.length;i++)if(QB[i][6]===0&&QB[i][9])out.push(qItem(i));return shuf(out)}
 if(mode==="daily")return dailySet();
 if(mode==="missed"){var mp=shuf(missedPool());for(i=0;i<mp.length&&i<30;i++)out.push(qItem(mp[i]));return out}
 if(mode==="bm"){var bp=shuf(st.bookmarks.slice());for(i=0;i<bp.length;i++)if(QB[bp[i]])out.push(qItem(bp[i]));return out}
 if(mode==="weak"){
  var cells=kmapData(),codes={};for(i=0;i<cells.length;i++)if(cells[i].weak)codes[cells[i].code]=1;
  for(i=0;i<QB.length;i++)if(codes[QB[i][1]]&&QB[i][6]!==1)out.push(qItem(i));
  return shuf(out).slice(0,30);
 }
 if(mode==="doc"){
  var dp=shuf(docPool());
  for(i=0;i<dp.length;i++)out.push(qItem(dp[i]));
  return out;
 }
 /* The 46 official FAA sample questions, in the FAA's published order, never
    padded and never mixed into practice. They are the only items here whose
    wording is not mine. */
 if(mode==="faa"){
  var fp=faaPool(null);
  for(i=0;i<fp.length;i++)out.push(qItem(fp[i]));
  return out;
 }
 /* The validation exam is every protected item, once. It is never padded to 60
    and never repeats an item, because a repeat would not be unseen evidence. */
 if(mode==="validation"){
  var vp=shuf(valPool(null));
  for(i=0;i<vp.length;i++)out.push(qItem(vp[i]));
  return out;
 }
 if(mode==="full"||mode==="challenge"||mode==="diag"){
  var scale=mode==="diag"?(20/60):1;
  for(k=0;k<AREAS.length;k++){
   var a=AREAS[k],want=Math.max(1,Math.round(a.n60*scale));
   var pool=shuf(trainPool(a.id));
   for(i=0;i<want;i++){
    if(mode==="challenge"){ /* harder: prefer diff 3 and generated variants */
     if(Math.random()<0.5){var g=genAny(a.id);if(g){out.push(g);continue}}
     var hard=pool.filter(function(x){return QB[x][7]>=2});
     out.push(qItem((hard.length?hard:pool)[i%(hard.length||pool.length)]));
    } else {
     /* full exam: mix static and generated so it cannot be memorized */
     if(Math.random()<0.35){var gg=genAny(a.id);if(gg){out.push(gg);continue}}
     if(pool.length)out.push(qItem(pool[i%pool.length]));
    }
   }
  }
  return dedupe(shuf(out));
 }
 if(mode==="mis"){
  for(i=0;i<st.misconceptions.length;i++){
   var m=st.misconceptions[i];
   if(m.indexOf("G:")===0){var gi=-1;for(k=0;k<GEN.length;k++)if("G:"+GEN[k].f().g===m||("G:"+GEN[k].id.replace("g-",""))===m)gi=k;
    var it=genAny(null);if(it)out.push(it)}
   else{var code=m.slice(2);for(k=0;k<QB.length;k++)if(QB[k][1]===code&&QB[k][6]===0)out.push(qItem(k))}
  }
  return shuf(out).slice(0,20);
 }
 if(mode==="srs"){
  var now=Date.now(),due=[];
  for(var key in st.srs)if(st.srs[key].due<=now)due.push(key);
  for(i=0;i<due.length&&i<25;i++){
   if(due[i].indexOf("G:")===0){var g2=genAny(null);if(g2)out.push(g2)}
   else{var c2=due[i].slice(2);for(k=0;k<QB.length;k++)if(QB[k][1]===c2&&QB[k][6]===0){out.push(qItem(k));break}}
  }
  return shuf(out);
 }
 if(mode==="mixed"){
  var tp=shuf(trainPool(null)).slice(0,15);
  for(i=0;i<tp.length;i++)out.push(qItem(tp[i]));
  for(i=0;i<10;i++){var gm=genAny(null);if(gm)out.push(gm)}
  return dedupe(shuf(out));
 }
 /* area drill: static + generated */
 var p2=shuf(trainPool(mode));
 for(i=0;i<p2.length;i++)out.push(qItem(p2[i]));
 for(i=0;i<Math.max(6,Math.round(p2.length*0.5));i++){var ga=genAny(mode);if(ga)out.push(ga)}
 return dedupe(shuf(out));
}
/* Option order. Written items store the key in a fixed slot, so each item in a set
   gets its own permutation when the set is built (item.perm[displayPos]=storedIdx).
   FAA official items keep the FAA's order (their explanations name letters);
   generated items are already shuffled by opts3, so they keep identity. The daily
   challenge seeds from the day so everyone sees the same order that day. */
function assignPerms(order,mode){
 var r=(mode==="daily"&&typeof seededRng==="function"&&typeof dayKey==="function")?seededRng("p107-perm-"+dayKey()):Math.random;
 for(var i=0;i<order.length;i++){var q=order[i];if(!q||q.perm)continue;
  var n=q.o.length,p=[],j;for(j=0;j<n;j++)p.push(j);
  if(!q.faa&&!q.gen)for(j=n-1;j>0;j--){var k=Math.floor(r()*(j+1)),t=p[j];p[j]=p[k];p[k]=t}
  q.perm=p}
 return order;
}
function dOrd(q){if(q.perm&&q.perm.length===q.o.length)return q.perm;var p=[];for(var j=0;j<q.o.length;j++)p.push(j);return p}
function dLtr(q,stored){return "ABC".charAt(dOrd(q).indexOf(stored))}

 h+='<tr><td><b>False ready</b></td><td>Peaked weeks ago</td><td>45 day evidence half-life, spaced review keyed to concept</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Strong overall, blind in one area</td><td>Per-area floors that must each pass independently; an average cannot hide a hole</td></tr>';
 h+='<tr><td><b>False ready</b></td><td>Confidently wrong beliefs</td><td>Wrong while marked Certain opens a misconception that must be cleared before the gate</td></tr>';
 h+='<tr><td><b>False not ready</b></td><td>Thin evidence widens the posterior</td><td>Accepted deliberately. Answer more questions and it resolves.</td></tr>';
 h+='<tr><td><b>Content error</b></td><td>A regulation changed</td><td>Source registry with version and verified date on every source, shown above</td></tr>';
 h+='</tbody></table></div>';
 h+='<h4>4. What happens when someone fails</h4>';
 h+='<p>Every failure by a gate-cleared student gets a written postmortem, because that is the only data that improves the model:</p>';
 h+='<ul class="lst">';
 h+='<li>Pull the ACS codes from their test report and compare them against their per-element history here.</li>';
 h+='<li>Classify it: <b>gap</b> (element never assessed at sufficient depth), <b>decay</b> (mastered, then stale), <b>calibration</b> (bank easier than the real item), or <b>noise</b> (genuinely prepared, bad day).</li>';
 h+='<li>Gap fixes the bank. Decay tightens the half-life or the review schedule. Calibration raises the difficulty mix or a floor. Noise changes nothing, and pretending otherwise is how a model gets overfitted to one student.</li>';
 h+='<li>Log the change and the date, so the gate that certified a student is reconstructable later.</li>';
 h+='</ul>';
 h+='<h4>5. What this build honestly cannot do</h4>';
 h+='<p>This runs entirely in your browser. Progress is stored on this device and nothing is transmitted anywhere. That is good for privacy and fatal for measurement, so the following require a server that does not exist yet:</p>';
 h+='<ul class="lst">';
 h+='<li><b>Outcome collection.</b> Real pass and fail data across students. Without it, every number here stays modelled.</li>';
 h+='<li><b>Item calibration.</b> With enough responses, each item gets a measured difficulty and discrimination, and weak items get retired. Right now difficulty is assigned by hand.</li>';
 h+='<li><b>Adaptive item selection.</b> Choosing the item that most reduces uncertainty about you requires calibrated items first.</li>';
 h+='<li><b>Regulatory change monitoring.</b> An operator watching the eCFR and FAA advisories, updating the bank, and re-verifying the dates in the source registry above.</li>';
 h+='<li><b>Cross-device progress.</b> Clearing your browser data clears your evidence.</li>';
 h+='</ul>';
 h+='<div class="call slatec"><span class="stamp">The honest summary</span><h3>Engineered for it. Not yet proven at it.</h3><p>The aggressive part is the design: full ACS coverage, a gate far stricter than the legal pass mark, unseen validation, decay, and anti-gaming. The conservative part is the measurement: no pass rate is printed, P(pass) is labelled as modelled, and the number of students required before a 99.9% claim is defensible is stated above rather than hidden.</p></div>';
 h+='</div>';
 return h;
}

function dayKey(t){var d=new Date(t||Date.now());return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function daysStudied(){var m={};for(var i=0;i<st.log.length;i++)m[dayKey(st.log[i].at)]=1;for(var k in st.daily)if(st.daily[k]!=null)m[k]=1;return m}
function streak(){
 var m=daysStudied(), n=0, t=Date.now();
 if(!m[dayKey(t)])t-=86400000;           /* a streak survives until the day ends */

}
function longestStreak(){
 var m=daysStudied(), keys=Object.keys(m).sort(), best=0, run=0, prev=null;
 for(var i=0;i<keys.length;i++){
  var d=new Date(keys[i]+"T12:00:00").getTime();
  run=(prev!==null&&d-prev===86400000)?run+1:1;
  if(run>best)best=run;prev=d;

}

function lkBReduced(){try{return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)}catch(e){return false}}
function lkBKeys(label,items,cur){

 for(var i=0;i<items.length;i++){var it=items[i],on=it.k===cur;
  h+='<button type="button" class="'+(on?'on':'')+'" data-hot="'+it.k+'" aria-pressed="'+on+'">'+(it.sw?'<span class="sw" style="background:'+it.sw+'"></span>':'')+lkEsc(it.n)+'</button>'}

}
function lkBInset(x,y,w,h){return '<rect class="lkb-inset" x="'+lkBf(x)+'" y="'+lkBf(y)+'" width="'+lkBf(w)+'" height="'+lkBf(h)+'" rx="8"/>'}
/* a 2-line readout in a stage inset: small dim key over a value */
function lkBNum(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}

/* ------------------------------------------------------------
   1. WEATHER STUDIO
   One instrument stage: sky, cloud layer at its reported height,
   the drone parked at the legal ceiling with the 500 ft bracket,
   the 400 ft line, a visibility ruler from the control station,
   a windsock and compass, and the temperature / dew point gauge.
   The METAR under it is a row of buttons; each one lights the
   part of the drawing it describes.
   ------------------------------------------------------------ */
var WX_COV={FEW:"few",SCT:"scattered",BKN:"broken",OVC:"overcast"};
var WX_OCT={FEW:"1 to 2 eighths of the sky",SCT:"3 to 4 eighths of the sky",BKN:"5 to 7 eighths of the sky",OVC:"all 8 eighths of the sky"};
function wxIsCeiling(cov){return cov==="BKN"||cov==="OVC"}
/* § 107.51(d): 500 ft below ANY cloud. The cap applies to every reported layer, ceiling or not. */
function cloudCap(base){return Math.max(0,base-500)}
function wxVisStr(v){
 var F={0.25:"1/4",0.5:"1/2",0.75:"3/4"};
 if(v<1)return (F[v]||v)+"SM";
 if(v>=10)return "10SM";
 var whole=Math.floor(v),fr=Math.round((v-whole)*100)/100;
 return (fr?whole+" "+(F[fr]||fr):whole)+"SM";
}
function wxDirStr(d){d=Math.round(d/10)*10;if(d<=0)d=360;return ("00"+d).slice(-3)}
function wxWxCode(w){var spread=w.temp-w.dew;if(w.vis<=0.5)return "FG";if(w.vis<3&&spread<=2)return "BR";if(w.vis<=3)return "HZ";return ""}
/* the METAR as tokens; wxMetar joins them, so the strip and the string can never disagree */
function wxTokens(w){
 var d=new Date();var day=("0"+d.getUTCDate()).slice(-2),hh=("0"+d.getUTCHours()).slice(-2);
 var wind=(w.spd===0?"00000KT":wxDirStr(w.dir)+("0"+w.spd).slice(-2)+(w.gst>w.spd?"G"+("0"+w.gst).slice(-2):"")+"KT");
 var sky=w.ceil===0?"CLR":(w.cov||"BKN")+("00"+Math.round(w.ceil/100)).slice(-3);
 var t=[{k:"stn",t:"KOCF"},{k:"time",t:day+hh+"53Z"},{k:"wind",t:wind},{k:"vis",t:wxVisStr(w.vis)}];
 var wx=wxWxCode(w);if(wx)t.push({k:"wx",t:wx});
 t.push({k:"sky",t:sky},{k:"tmp",t:("0"+w.temp).slice(-2)+"/"+("0"+w.dew).slice(-2)},{k:"alt",t:"A2992"});
 return t;
}
function wxMetar(w){var t=wxTokens(w),o=[];for(var i=0;i<t.length;i++)o.push(t[i].t);return o.join(" ")}
function wxVerdict(w){
 var out=[],ok=true;
 if(w.vis<3){ok=false;out.push({bad:1,t:"Visibility "+wxVisStr(w.vis)+" is below the 3 statute mile minimum from the control station. § 107.51(c)."})}
 else out.push({bad:0,t:"Visibility "+wxVisStr(w.vis)+" meets the 3 SM minimum. § 107.51(c)."});
 if(w.ceil>0){
  var cov=w.cov||"BKN",room=cloudCap(w.ceil),lay=WX_COV[cov]+" layer ("+cov+") at "+w.ceil+" ft AGL"+(wxIsCeiling(cov)?", which is a ceiling":", which is not a ceiling but is still cloud")+". ";
  if(room<=0){ok=false;out.push({bad:1,t:"Lowest cloud: "+lay+"You must stay 500 ft below any cloud, which leaves no usable altitude. § 107.51(d)."})}
  else if(room<400)out.push({bad:2,t:"Lowest cloud: "+lay+"Staying 500 ft below it caps you at "+room+" ft AGL, lower than the usual 400 ft limit. § 107.51(d)."});
  else out.push({bad:0,t:"Lowest cloud: "+lay+"500 ft below it is "+room+" ft, so the full 400 ft AGL is available. § 107.51(d)."});
 } else out.push({bad:0,t:"Sky clear. No cloud clearance problem, but remember 2,000 ft horizontal from any cloud that drifts in."});
 var g=Math.max(w.spd,w.gst);
 if(g>=25)out.push({bad:2,t:"Wind "+w.spd+(w.gst>w.spd?" gusting "+w.gst:"")+" kt. Part 107 sets no wind limit; your aircraft's manual does. Most small quads list 20 to 25 kt. Gusts also mean low level wind shear."});
 else if(w.gst-w.spd>=8)out.push({bad:2,t:"Gust spread of "+(w.gst-w.spd)+" kt. Gusty wind is mechanical turbulence near the ground and a sign of an unstable, convective air mass."});
 else out.push({bad:0,t:"Wind "+w.spd+" kt is within what most small UAS handle. Fly the upwind leg first so the return home is downwind."});
 var sp=w.temp-w.dew;
 if(sp<=2)out.push({bad:2,t:"Temperature and dew point are "+sp+"°C apart. When they converge, fog or low cloud forms. Expect visibility to fall, especially near dawn."});
 else out.push({bad:0,t:"Temperature and dew point spread is "+sp+"°C. Fog is unlikely right now."});
 if(w.temp>=32)out.push({bad:2,t:"Hot air is thin air. High density altitude cuts rotor thrust and shortens battery endurance."});
 return {ok:ok,rows:out};
}
function wxCap(w){return w.ceil>0?Math.max(0,Math.min(400,cloudCap(w.ceil))):400}
function wxCall(w){var v=wxVerdict(w);if(!v.ok)return "no";for(var j=0;j<v.rows.length;j++)if(v.rows[j].bad===2)return "warn";return "ok"}
/* which drawing parts each METAR token lights up */
var WX_PART={stn:"station",time:"station",wind:"wind",vis:"vis",wx:"vis",sky:"clouds",tmp:"spread",alt:"tape"};

/* soft cumulus / stratus shapes on a flat base yb. cov sets how much of the sky they cover */
function wxClouds(cov,yb,W,x0,ph,top){
 var s='',L={FEW:[[.34,.13,26],[.80,.10,20]],SCT:[[.14,.17,30],[.44,.15,36],[.70,.15,28],[.93,.10,22]],
  BKN:[[.08,.21,40],[.33,.21,48],[.59,.19,42],[.86,.23,46]]}[cov];
 var span=W-x0,k=ph?0.8:1;
 s+='<g clip-path="url(#lkb-cb)" filter="url(#lkb-soft)">';
 if(cov==="OVC"){
  /* stratus: a solid deck from the base up out of the frame, lumpy texture on its belly */
  s+='<rect x="0" y="'+lkBf(top-20)+'" width="'+W+'" height="'+lkBf(yb-top+20)+'" fill="url(#lkb-cld)"/>';
  for(var xo=-10;xo<W+30;xo+=46){s+='<ellipse cx="'+xo+'" cy="'+lkBf(yb-7)+'" rx="34" ry="9" fill="#8E9DB2" opacity=".45"/>'}
  s+='<rect x="0" y="'+lkBf(yb-3)+'" width="'+W+'" height="3" fill="#7D8CA3" opacity=".7"/>';
 } else {
  for(var i=0;i<L.length;i++){var cx=x0+span*L[i][0],w=span*L[i][1],h=L[i][2]*k,n=Math.max(3,Math.round(w/(h*0.85)));
   s+='<g>';
   s+='<rect x="'+lkBf(cx-w/2)+'" y="'+lkBf(yb-h*0.42)+'" width="'+lkBf(w)+'" height="'+lkBf(h*0.42+4)+'" rx="'+lkBf(h*0.2)+'" fill="url(#lkb-cld)"/>';
   for(var j=0;j<n;j++){var px=cx-w/2+w*(j+0.5)/n,r=h*(0.42+0.22*Math.sin((j+1)*2.1+i)*Math.sin((j+1)*2.1+i)),mid=1-Math.abs((j+0.5)/n-0.5)*1.2;
    r*=0.75+0.45*mid;s+='<circle cx="'+lkBf(px)+'" cy="'+lkBf(yb-r*0.78)+'" r="'+lkBf(r)+'" fill="url(#lkb-cld)"/>'}
   s+='<rect x="'+lkBf(cx-w/2+4)+'" y="'+lkBf(yb-4)+'" width="'+lkBf(w-8)+'" height="4" fill="#7D8CA3" opacity=".6"/>';
   s+='</g>'}
 }
 return s+'</g>';
}
/* side-view quad for the stage, centred on (0,0), about 44 units wide */
function wxDroneIcon(sc){
 var s='<g transform="scale('+sc+')">';
 s+='<path d="M-20 -3 h40" stroke="#9AACC4" stroke-width="2.4" stroke-linecap="round"/>';
 s+='<rect x="-9" y="-6" width="18" height="9" rx="3" fill="#E8EEF7"/><rect x="-6" y="3" width="12" height="3" rx="1.5" fill="#9AACC4"/>';
 s+='<path d="M-7 6 l-4 6 M7 6 l4 6" stroke="#9AACC4" stroke-width="1.6" stroke-linecap="round"/>';
 s+='<rect x="-22" y="-8" width="4" height="5" rx="1" fill="#C9D4E3"/><rect x="18" y="-8" width="4" height="5" rx="1" fill="#C9D4E3"/>';
 s+='<ellipse cx="-20" cy="-9.5" rx="13" ry="2" fill="#BFD3EA" opacity=".55"/><ellipse cx="20" cy="-9.5" rx="13" ry="2" fill="#BFD3EA" opacity=".55"/>';
 s+='<circle cx="9" cy="-1.5" r="1.4" fill="#F5A623"/>';
 return s+'</g>';
}
/* control station: a pilot holding a transmitter, feet at (0,0) */
function wxPilot(sc){
 var s='<g transform="scale('+sc+')" fill="#C9D4E3">';
 s+='<circle cx="0" cy="-25" r="4.2"/>';
 s+='<path d="M-5 -19 h10 a3 3 0 0 1 3 3 v10 h-3.4 v16 h-3.2 v-12 h-0.8 v12 h-3.2 v-16 h-3.4 v-10 a3 3 0 0 1 3 -3z"/>';
 s+='<rect x="2" y="-15" width="9" height="6" rx="1.5" fill="#3FC1E0"/><path d="M9 -15 l3 -6" stroke="#3FC1E0" stroke-width="1.2"/>';
 return s+'</g>';
}
function svgWeather(w,d,tok){
 var W=d.w,H=d.h,ph=d.phone;
 var G=ph?212:310,TOP=ph?10:14,FT=1750,X0=ph?46:58;
 function y(ft){return G-ft/FT*(G-TOP)}
 var fs=ph?12.5:12.5,cov=w.cov||"BKN",cap=wxCap(w),v=wxVerdict(w),call=wxCall(w),wxc=wxWxCode(w);
 var rx0=X0+(ph?16:20),rx1=W-(ph?14:20),per=(rx1-rx0)/10,xv=rx0+Math.min(10,w.vis)*per;
 var dx=ph?200:330,bx=dx+(ph?36:52),mx=W-(ph?42:66),mh=ph?44:62;
 var part=tok?WX_PART[tok]:null;

 s+='<linearGradient id="lkb-cld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset=".65" stop-color="#D5DEEA"/><stop offset="1" stop-color="#A9B7CA"/></linearGradient>';
 s+='<linearGradient id="lkb-gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23402E"/><stop offset="1" stop-color="#132219"/></linearGradient>';
 s+='<filter id="lkb-soft" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation=".7"/></filter>';
 var yb=w.ceil>0?y(Math.min(1500,w.ceil)):0;
 s+='<clipPath id="lkb-cb"><rect x="0" y="0" width="'+W+'" height="'+lkBf(yb)+'"/></clipPath>';

 s+='<linearGradient id="lkb-fog" gradientUnits="userSpaceOnUse" x1="'+rx0+'" y1="0" x2="'+W+'" y2="0"><stop offset="0" stop-color="'+fogc+'" stop-opacity="0"/><stop offset="'+Math.max(0,f*0.5).toFixed(3)+'" stop-color="'+fogc+'" stop-opacity="'+(dens*0.25).toFixed(2)+'"/><stop offset="'+Math.min(1,f).toFixed(3)+'" stop-color="'+fogc+'" stop-opacity="'+(dens*0.72).toFixed(2)+'"/><stop offset="1" stop-color="'+fogc+'" stop-opacity="'+(dens*0.88).toFixed(2)+'"/></linearGradient>';
 s+='</defs>';
 s+='<g class="lkb-scene'+(part?' lkb-focus':'')+'">';
 /* sky and distant terrain */
 s+='<rect width="'+W+'" height="'+G+'" fill="url(#lkb-wxsky)"/>';
 s+='<path d="M0 '+(G-6)+' Q'+lkBf(W*.12)+' '+(G-16)+' '+lkBf(W*.25)+' '+(G-8)+' T'+lkBf(W*.52)+' '+(G-10)+' T'+lkBf(W*.78)+' '+(G-7)+' T'+W+' '+(G-12)+' V'+G+' H0z" fill="#15283F"/>';
 /* ground */
 s+='<rect x="0" y="'+G+'" width="'+W+'" height="'+(H-G)+'" fill="url(#lkb-gnd)"/><line x1="0" y1="'+G+'" x2="'+W+'" y2="'+G+'" stroke="rgba(160,190,230,.25)"/>';
 /* guide lines every 500 ft */
 for(var a=500;a<=1500;a+=500)s+='<line x1="'+X0+'" y1="'+lkBf(y(a))+'" x2="'+W+'" y2="'+lkBf(y(a))+'" stroke="rgba(160,190,230,.14)" stroke-dasharray="2 6"/>';
 /* wind streaks drift downwind (east is right; the view looks north) */
 var hx=-Math.sin(w.dir*Math.PI/180),sx=hx>=0?1:-1;
 var streak='';
 if(w.spd>0){var n=Math.min(6,2+Math.floor(w.spd/6)),op=(0.35+0.4*Math.abs(hx)).toFixed(2),sl=(ph?16:22)*(0.4+0.6*Math.abs(hx)),dur=Math.max(1.6,6-w.spd/8).toFixed(1);
  for(var si=0;si<n;si++){var sy=y(180+((si*397)%1150)),sxp=X0+30+((si*173)%Math.max(60,W-X0-120));
   streak+='<g class="lkb-drift" style="--lkdx:'+(sx*(ph?36:56))+'px;animation-duration:'+dur+'s;animation-delay:-'+(si*0.7).toFixed(1)+'s"><line x1="'+lkBf(sxp-sx*sl/2)+'" y1="'+lkBf(sy)+'" x2="'+lkBf(sxp+sx*sl/2)+'" y2="'+lkBf(sy)+'" stroke="#3FC1E0" stroke-width="1.6" stroke-linecap="round" opacity="'+op+'" marker-end="url(#lk-arc)"/></g>'}}
 s+=P("wind",streak);
 /* cloud layer */
 var cl='';
 if(w.ceil>0){cl+=wxClouds(cov,yb,W,X0,ph,TOP)}
 s+=P("clouds",cl);
 /* haze veil and distance fog */
 if(dens>0)s+='<g pointer-events="none"><rect width="'+W+'" height="'+G+'" fill="'+fogc+'" opacity="'+(dens*0.16).toFixed(2)+'"/><rect width="'+W+'" height="'+(G+6)+'" fill="url(#lkb-fog)"/></g>';
 /* altitude tape */
 var ticks=[];for(var t=0;t<=1500;t+=100)ticks.push({v:t,major:t%500===0,label:t%500===0?lkBNum(t):""});
 s+=P("tape",'<rect x="0" y="0" width="'+(X0-2)+'" height="'+G+'" fill="rgba(6,14,28,.55)"/>'+lkTape(X0,y,ticks,{left:1,size:ph?12.5:12})+lkText(X0-6,TOP+(ph?12.5:14),ph?"AGL":"FT AGL",{mono:1,cls:"lk-dim",size:ph?12.5:11.5,anchor:"end"}));
 /* the 400 ft line */
 var y4=y(400);
 s+='<line x1="'+X0+'" y1="'+lkBf(y4)+'" x2="'+W+'" y2="'+lkBf(y4)+'" stroke="#F5A623" stroke-width="1.6" stroke-dasharray="7 5"/>';

 if(w.ceil>0){var ly=yb+(ph?15:17);if(Math.abs(ly-(y4-6))<16||ly>G-6)ly=yb-7;
  s+=lkText(X0+8,ly,cov+" "+lkBNum(w.ceil)+" ft AGL · "+(wxIsCeiling(cov)?"ceiling":"not a ceiling"),{size:fs,weight:700,fill:"#F7FAFD"})}
 /* clearance bracket: 500 ft under the base */
 if(w.ceil>0){var ylo=y(Math.max(0,w.ceil-500)),bad=w.ceil-500<=0,col=bad?"#FF6B5B":(cap<400?"#F2C14E":"#9AACC4"),tw=ph?5:7;
  s+='<g class="lkb-bracket"><path d="M'+(bx-tw)+' '+lkBf(yb)+' H'+(bx+tw)+' M'+bx+' '+lkBf(yb)+' V'+lkBf(ylo)+' M'+(bx-tw)+' '+lkBf(ylo)+' H'+(bx+tw)+'" stroke="'+col+'" stroke-width="1.8" fill="none"/>';
  var my=(yb+ylo)/2+4;s+=lkText(bx+tw+4,my-(ph?7:0),bad?"needs 500 ft":"500 ft",{size:fs,weight:700,fill:col})+(ph?lkText(bx+tw+4,my+7,"below cloud",{size:12.5,fill:col}):lkText(bx+tw+4,my+15,"below cloud",{size:11.5,fill:col}));
  s+='</g>'}
 /* drone at the legal maximum, or grounded */
 var dy=v.ok?y(cap):G-14;
 s+='<g transform="translate('+dx+' '+lkBf(dy)+')">'+wxDroneIcon(ph?0.9:1.1)+'</g>';
 if(v.ok)s+=lkText(dx,dy-(ph?17:20),cap+" ft",{size:fs,weight:700,anchor:"middle",mono:1,fill:cap<400?"#F2C14E":"#3CCB7F"});
 else s+=lkText(dx,dy-(ph?20:24),"GROUNDED",{size:fs,weight:700,anchor:"middle",mono:1,fill:"#FF6B5B"});
 /* ground */
 /* control station */
 s+=P("station",'<g transform="translate('+rx0+' '+G+')">'+wxPilot(ph?0.9:1.05)+'</g>');
 /* windsock: points downwind, fills out with speed (full at 15 kt), flutters in gusts */
 var fill=Math.min(1,Math.max(w.spd,w.gst)/15),droop=w.spd===0?82:(1-fill)*72,Ls=(ph?36:50)*(0.38+0.62*Math.abs(hx)),r0=ph?6:7.5,r1=ph?3.4:4.2;
 var sock='',nb=5;for(var b=0;b<nb;b++){var xa2=Ls*b/nb,xb2=Ls*(b+1)/nb,ra=r0-(r0-r1)*b/nb,rb=r0-(r0-r1)*(b+1)/nb;
  sock+='<path d="M'+lkBf(xa2)+' '+lkBf(-ra)+' L'+lkBf(xb2)+' '+lkBf(-rb)+' L'+lkBf(xb2)+' '+lkBf(rb)+' L'+lkBf(xa2)+' '+lkBf(ra)+'z" fill="'+(b%2?"#F4F1EA":"#FF7A1A")+'"/>'}
 sock='<ellipse cx="0" cy="0" rx="1.6" ry="'+r0+'" fill="#C2410C"/>'+sock;
 var ws='<line x1="'+mx+'" y1="'+G+'" x2="'+mx+'" y2="'+(G-mh)+'" stroke="#C9D4E3" stroke-width="2"/><circle cx="'+mx+'" cy="'+(G-mh)+'" r="2" fill="#C9D4E3"/>';
 ws+='<g transform="translate('+mx+' '+(G-mh+2)+') scale('+sx+' 1) rotate('+lkBf(droop)+')"><g class="lk-sway'+(w.gst>w.spd?' lkb-flutter':'')+'">'+sock+'</g></g>';
 /* compass inset: arrow flies in from the bearing the wind blows from */

 var comp=lkBInset(ix,ccy-cr-6,W-ix-(ph?4:6),cr*2+12);
 comp+='<circle cx="'+ccx+'" cy="'+ccy+'" r="'+cr+'" fill="rgba(255,255,255,.03)" stroke="rgba(160,190,230,.35)"/>';
 for(var c=0;c<360;c+=30){var ca=c*Math.PI/180,r2=c%90===0?cr-6:cr-3;comp+='<line x1="'+lkBf(ccx+Math.sin(ca)*r2)+'" y1="'+lkBf(ccy-Math.cos(ca)*r2)+'" x2="'+lkBf(ccx+Math.sin(ca)*cr)+'" y2="'+lkBf(ccy-Math.cos(ca)*cr)+'" stroke="#9AACC4" stroke-width="1"/>'}

 if(w.spd>0){var wa=w.dir*Math.PI/180;comp+='<line x1="'+lkBf(ccx+Math.sin(wa)*(cr+2))+'" y1="'+lkBf(ccy-Math.cos(wa)*(cr+2))+'" x2="'+lkBf(ccx-Math.sin(wa)*(cr-8))+'" y2="'+lkBf(ccy+Math.cos(wa)*(cr-8))+'" stroke="#3FC1E0" stroke-width="2.4" marker-end="url(#lk-arc)"/>'}
 else comp+='<circle cx="'+ccx+'" cy="'+ccy+'" r="3" fill="#3FC1E0"/>';
 comp+=lkText(ix+8,ccy-4,"WIND",{size:ph?12.5:11.5,mono:1,cls:"lk-dim",halo:false});
 comp+=lkText(ix+8,ccy+(ph?11:13),w.spd===0?"Calm":wxDirStr(w.dir)+"° "+w.spd+(w.gst>w.spd?"G"+w.gst:"")+" kt",{size:ph?12.5:13,mono:1,weight:700,fill:"#E8EEF7",halo:false});
 s+=P("wind",ws+comp);
 /* temperature / dew point spread gauge, amber at 2 °C or less */
 var sp=w.temp-w.dew,risk=sp<=2,gx=X0+(ph?6:12),gw=ph?112:158,gy=ph?8:12,gh=ph?40:46,gc=risk?"#F2C14E":"#3CCB7F";

 if(!ph)gg+=lkText(gx+gw-8,gy+17,w.temp+"/"+w.dew,{size:11.5,mono:1,cls:"lk-dim",anchor:"end",halo:false});

   2. DRONE ENGINEERING
   Anatomy (top view, every part a hotspot), flight (a Mode 2
   transmitter driving attitude and per-motor RPM), and centre
   of gravity (battery slider, thrust split, balance gauge).
   Motor layout, X frame, nose up the screen:
     FL counter-clockwise   FR clockwise
     RL clockwise           RR counter-clockwise
   Diagonal pairs spin the same way, so torques cancel in a hover.
   ------------------------------------------------------------ */
var DRONE_PARTS=[
 {k:"fc",n:"Flight controller",d:"The computer. Reads the gyros, accelerometers, barometer and compass hundreds of times a second and adjusts each motor to hold the attitude you command. A compass that was calibrated near steel, or a GPS lock lost mid-flight, shows up here first. § 107.49 preflight includes checking that control links and the aircraft are working."},
 {k:"gps",n:"GPS module",d:"Position hold, return to home and geofencing depend on it. Expect weak signal under bridges, beside tall buildings and in steel-framed structures. Loss of GPS usually drops the aircraft into attitude mode, where it drifts with the wind."},
 {k:"bat",n:"Battery (LiPo)",d:"Lithium polymer cells deliver high current and hate three things: being flown to empty, cold, and physical damage. A puffed or dented pack is a fire risk and fails a § 107.15 condition-for-safe-operation check. Cold cells sag under load, so endurance in winter is shorter than the spec sheet."},
 {k:"esc",n:"ESC",d:"Electronic speed controllers, one per motor, turn the controller's commands into three-phase power. They are the part that heats up on a hot day with a heavy payload: high density altitude means more power for the same thrust."},
 {k:"mot",n:"Motors and propellers",d:"Diagonal pairs spin the same direction. Front-left and rear-right spin one way, front-right and rear-left the other, so their torques cancel and the aircraft does not spin on its own. A chipped prop vibrates, and vibration confuses the gyros. Inspect every one before every flight."},
 {k:"cam",n:"Camera and gimbal",d:"The payload. It is also weight behind or ahead of the centre of gravity. Anything attached must be secure and must not adversely affect flight characteristics, § 107.49(a)(5)."},
 {k:"rid",n:"Remote ID",d:"Standard Remote ID broadcasts the aircraft's identity, location, altitude, velocity, control station location and emergency status. A broadcast module can be added instead, but then the aircraft must stay in visual line of sight. Part 89."},
 {k:"reg",n:"Registration marking",d:"The registration number must be on an external surface, legible, and visible on inspection. Under part 107 every aircraft is registered, even one under 0.55 lb. The $5 registration lasts three years. Part 48."}
];
var DR_SW={fc:"#3CCB7F",gps:"#E8EEF7",bat:"#F2C14E",esc:"#E0559B",mot:"#9AACC4",cam:"#3FC1E0",rid:"#F5A623",reg:"#F4F1EA"};
/* motors: key, x sign, y sign, spin (1 = clockwise seen from above) */
var DR_MOT=[{k:"FL",sx:-1,sy:-1,cw:0},{k:"FR",sx:1,sy:-1,cw:1},{k:"RR",sx:1,sy:1,cw:0},{k:"RL",sx:-1,sy:1,cw:1}];
var DR_POSE_STK={level:{t:0,y:0,p:0,r:0},pitch:{t:0,y:0,p:1,r:0},roll:{t:0,y:0,p:0,r:1},yaw:{t:0,y:-1,p:0,r:0},climb:{t:1,y:0,p:0,r:0}};
function drStk(){var d=st.dr;if(!d.stk||typeof d.stk!=="object")d.stk=JSON.parse(JSON.stringify(DR_POSE_STK[d.pose]||DR_POSE_STK.level));

/* the mixer. t throttle up, y yaw right, p pitch forward (nose down), r roll right; each -1..1.
   Pitch forward: rear pair faster. Roll right: left pair faster. Yaw left: the clockwise pair
   faster, so the body turns counter-clockwise, opposite to the faster props. Climb: all faster. */
function drMix(s){
 var o={};
 for(var i=0;i<DR_MOT.length;i++){var m=DR_MOT[i];
  var v=60+24*s.t+18*s.p*(m.sy>0?1:-1)+18*s.r*(m.sx<0?1:-1)+18*s.y*(m.cw?-1:1);
  o[m.k]=Math.round(Math.max(8,Math.min(100,v)))}

var DR_AXN={level:"Level",pitch:"Pitch forward",pitchback:"Pitch back",roll:"Roll right",rollleft:"Roll left",yaw:"Yaw left",yawright:"Yaw right",climb:"Climb",descend:"Descend"};

 roll:"<b>Roll</b> is rotation about the longitudinal axis, nose to tail. To roll right, the two <b>left</b> motors speed up, lifting the left side.",

 pitchback:"<b>Pitch back</b>: the two <b>front</b> motors speed up and the rear pair slows. The nose rises, the thrust vector tilts aft and the aircraft slows or backs up.",

  c:[{t:"No. The authorization is the limit here, not § 107.51. Reframe the shot from 200 ft or request a higher altitude through further coordination.",o:"good",r:"Inside controlled airspace the ATC authorization sets your ceiling. The 400 ft rule and the structure exception in § 107.51(b) cannot raise you above what ATC approved."},
     {t:"Yes. § 107.51 allows 400 ft above a structure when within 400 ft of it, so 350 is legal.",o:"bad",r:"The structure exception is a § 107.51 provision. It does not override an ATC authorization capped at 200 ft. You would be at 150 ft above your approval."},
     {t:"Go to 250 ft, splitting the difference.",o:"bad",r:"Any altitude above the authorized 200 ft is a violation. There is no grace margin."}]},
 {q:"You are set up. Your visual observer mentions a NOTAM search would be smart. Which one actually affects you here?",cite:"§ 107.47 · § 107.49",
  c:[{t:"A TFR. If there is one over the area, LAANC may still have approved me, so I check NOTAMs separately before launch.",o:"good",r:"TFRs are published by FDC NOTAM. § 107.47 and § 99.7 apply them to you. § 107.49 requires you to assess the operating environment before flight, and a TFR is part of that environment."},
     {t:"Nothing. If LAANC approved it, the airspace is clear.",o:"meh",r:"LAANC checks airspace classes and some restrictions, but a TFR issued after your approval, or a stadium TFR, is your job to catch. Approval is not a NOTAM check."},
     {t:"A runway closure NOTAM, because then I can fly higher.",o:"bad",r:"A closed runway changes nothing about the Class D airspace or your authorization."}]},
 {q:"Mid-flight at 180 ft a helicopter crosses the area at low level, heading toward you. What do you do?",cite:"§ 107.37",
  c:[{t:"Descend and move clear immediately. I yield to every manned aircraft, no exceptions.",o:"good",r:"§ 107.37(a): the small UA must yield the right of way to all aircraft, and yielding means you may not pass over, under or ahead of it unless well clear. Descending is usually the fastest way out of the conflict."},
     {t:"Hold position. The helicopter sees me and will go around.",o:"bad",r:"You never assume a manned pilot sees a drone. The yield obligation is yours and it is absolute."},
     {t:"Climb to 200 ft to get above its path.",o:"bad",r:"Climbing toward a helicopter at low level is exactly the wrong direction and you would be passing ahead of it, which § 107.37 forbids."}]}
 ]},
{id:"m2",t:"Weather Go / No-Go",art:"wx",lede:"A farmer wants crop photos at first light. The morning METAR reads KXYZ 111153Z 00000KT 2SM BR OVC006 14/14 A3002.",
 scenes:[
 {q:"Decode it. Can you launch right now?",cite:"§ 107.51(c)(d)",
  c:[{t:"No. Visibility is 2 statute miles, below the 3 SM minimum, and OVC006 is a 600 ft ceiling that leaves me 100 ft under the 500 ft cloud rule.",o:"good",r:"2SM fails § 107.51(c). A ceiling at 600 ft AGL minus the 500 ft required below clouds leaves 100 ft of usable sky. Both are stop signs."},
     {t:"Yes. Mist is not fog, and I will stay under the overcast.",o:"bad",r:"BR is mist, which means visibility of at least 5/8 SM but still restricted. The rule is 3 SM. And staying under the overcast means staying 500 ft under it."},
     {t:"Yes, if I stay below 100 ft AGL.",o:"meh",r:"That satisfies the cloud rule arithmetically, but visibility is still 2 SM and that fails on its own."}]},
 {q:"Temperature and dew point are both 14°C. Wind is calm. What is the weather about to do?",cite:"PHAK ch. 12 · Study Guide",
  c:[{t:"Fog is forming or holding. With zero spread and no wind to mix the air, it will not lift until the sun heats the ground.",o:"good",r:"When temperature and dew point converge, the air is saturated. Calm wind and a clear sky overnight produce radiation fog; it burns off after sunrise as the surface warms."},
     {t:"It will clear fast because mist is thin.",o:"bad",r:"Nothing in the report says thin. Zero spread with calm wind is the recipe for fog to persist."},
     {t:"A thunderstorm is likely.",o:"bad",r:"Thunderstorms need unstable air, moisture and a lifting force. A calm, saturated dawn is stable air."}]},
 {q:"At 10:00 the METAR shows 10SM SCT025 and wind 18 kt gusting 30. The aircraft manual lists a 24 kt limit.",cite:"§ 107.19 · § 107.49",
  c:[{t:"No-go on wind. The gusts exceed the manual's limit and gusty wind near the ground is wind shear and turbulence.",o:"good",r:"Part 107 does not publish a wind number; your aircraft's limitations do, and § 107.49(a)(1) makes assessing weather part of the required preflight. Gusts count."},
     {t:"Go. The steady wind is 18, under the limit; gusts are brief.",o:"bad",r:"Limits apply to gusts too. A 30 kt gust against a 24 kt limit means the aircraft may not be able to hold position, and you are responsible for that outcome as remote PIC."},
     {t:"Go, but fly downwind first so the return is easy.",o:"bad",r:"Backwards. Fly the upwind leg first so the return to you is with the wind, and that would still not cure a gust above the limit."}]},
 {q:"At 13:00 it is 10SM, SCT040, wind 8 kt, temperature 36°C. The farm sits at 1,200 ft elevation. What changes about the flight?",cite:"PHAK ch. 11",
  c:[{t:"Density altitude is high. Expect less thrust, shorter battery life, and keep the payload light.",o:"good",r:"Hot air is less dense. The props produce less thrust for the same RPM, motors draw more current, and endurance drops. Elevation adds to the effect."},
     {t:"Nothing. Density altitude only affects aeroplanes.",o:"bad",r:"Any wing or rotor produces lift from air density. A quadcopter at high density altitude hovers at higher RPM and runs out of battery sooner."},
     {t:"Performance improves because warm air is lighter and easier to push through.",o:"bad",r:"Lighter air is the problem, not the solution: less mass to push means less thrust."}]},
 {q:"You launch at 13:30. Towering cumulus is building to the west. Which stage of a thunderstorm begins with precipitation reaching the ground?",cite:"PHAK ch. 12",
  c:[{t:"The mature stage. That is when downdrafts, gust fronts and the worst turbulence arrive. Land now.",o:"good",r:"Cumulus stage is updrafts only. Precipitation falling to the surface marks the mature stage, with the most violent weather. Dissipating stage is downdrafts throughout."},
     {t:"The cumulus stage.",o:"bad",r:"Cumulus stage is updraft-only; precipitation has not yet reached the ground."},
     {t:"The dissipating stage.",o:"bad",r:"Dissipating is the end of the storm, dominated by downdrafts. Precipitation reaching the ground is the start of the mature stage."}]}
 ]},
{id:"m3",t:"Night Operation",art:"night",lede:"A town wants aerial video of its holiday lights, from 30 minutes after sunset until 21:00.",
 scenes:[
 {q:"Can you fly at night under part 107 at all?",cite:"§ 107.29",
  c:[{t:"Yes, since 2021, with anti-collision lighting visible for 3 statute miles and a flash rate sufficient to avoid collision.",o:"good",r:"§ 107.29(a) allows night operations if the aircraft has lighted anti-collision lighting visible for at least 3 SM with a flash rate sufficient to avoid a collision. No waiver needed. The remote PIC must also have completed the current training or test, which covers night."},
     {t:"Only with a Part 107.29 waiver.",o:"bad",r:"That was the old rule. Since April 2021 night flight is allowed without a waiver, provided the lighting requirement is met."},
     {t:"No. Part 107 is daylight only.",o:"bad",r:"Daylight-only was the original 2016 rule. It changed in 2021."}]},
 {q:"Sunset is at 17:45. The client wants to start at 17:50. What applies between sunset and 30 minutes after?",cite:"§ 107.29(b) · § 107.3",
  c:[{t:"That is civil twilight. The same anti-collision lighting is required even though it is not yet night.",o:"good",r:"§ 107.29(b) requires anti-collision lighting during civil twilight too. Civil twilight is 30 minutes before sunrise to sunrise and sunset to 30 minutes after, except in Alaska."},
     {t:"Nothing special. It is still daytime until 30 minutes after sunset.",o:"bad",r:"Civil twilight has its own requirement: lighting visible for 3 SM. The lights have to be on and working."},
     {t:"Civil twilight requires a waiver.",o:"bad",r:"No waiver. Lighting is the requirement."}]},
 {q:"Your anti-collision strobe is rated for 2 miles. The town is excited. Do you fly?",cite:"§ 107.29(a)(2)",
  c:[{t:"No. The strobe must be visible for 3 statute miles. Fit a compliant light or cancel.",o:"good",r:"§ 107.29 says 3 SM. Two miles is a violation, and the remote PIC may not reduce the intensity of the light unless it is in the interest of safety to do so."},
     {t:"Yes. At 2 miles nobody will see the difference.",o:"bad",r:"The rule is specific and the inspector reads spec sheets. Three miles."},
     {t:"Yes, if I stay below 200 ft.",o:"bad",r:"Altitude does not change the lighting requirement."}]},
 {q:"It is fully dark. Your eyes have adjusted. A bright floodlight on the town square snaps on. What is the night vision issue?",cite:"Study Guide · PHAK ch. 17",
  c:[{t:"Dark adaptation takes about 30 minutes and a bright light wipes it out in seconds. Protect it: avoid looking at bright lights, and use red or dim cockpit lighting.",o:"good",r:"The rods take roughly 30 minutes to fully adapt to darkness and lose that adaptation almost instantly in bright light. Off-centre viewing helps you see a dim aircraft at night because the rods are outside the fovea."},
     {t:"Nothing. Night vision is about the camera, not the pilot.",o:"bad",r:"VLOS still applies at night, § 107.31. Your eyes are the instrument, and the exam asks how they work in the dark."},
     {t:"Stare directly at the drone to keep it in focus.",o:"bad",r:"At night, looking slightly to the side of a dim object uses the rods and makes it easier to see. Staring directly at it uses the cones, which are poor in the dark."}]},
 {q:"At 20:40 you notice the aircraft is 1,800 ft away and you can only see the strobe, not the orientation. Legal?",cite:"§ 107.31",
  c:[{t:"No. VLOS means I can see the aircraft well enough to know its location, attitude, altitude and direction, and watch for hazards. A dot of light is not that. Bring it back.",o:"good",r:"§ 107.31 requires the ability to see the unmanned aircraft throughout the flight well enough to know its location, determine its attitude, altitude and direction of flight, observe the airspace, and ensure it does not endanger anyone. The strobe alone fails that test."},
     {t:"Yes. If I can see the light I have line of sight.",o:"bad",r:"Seeing a light is not seeing the aircraft well enough to judge attitude and direction. That is the test in § 107.31(a)."},
     {t:"Yes, as long as the camera feed is clear.",o:"bad",r:"A camera feed is not visual line of sight. First person view counts only with a visual observer who has unaided VLOS."}]}
 ]},
{id:"m4",t:"Over People and Remote ID",art:"people",lede:"A charity run wants live aerial video of 3,000 runners on a closed downtown course.",
 scenes:[
 {q:"What does part 107 say about flying over the runners at all?",cite:"§ 107.39 · Subpart D",
  c:[{t:"Not unless the aircraft qualifies under one of the four categories in Subpart D, or the people are under a covered structure or in a stationary vehicle that protects them.",o:"good",r:"§ 107.39 bans operation over a human being unless they are directly participating, are under a covered structure or inside a stationary vehicle, or the operation meets Category 1, 2, 3 or 4 in Subpart D (§§ 107.100 to 107.145)."},
     {t:"Fine, as long as I am above 100 ft.",o:"bad",r:"There is no altitude that makes flight over people legal on its own."},
     {t:"Fine, because the runners signed a waiver with the race.",o:"bad",r:"Race waivers do not make runners 'directly participating' in your operation. Only crew and people necessary to the safe operation count."}]},
 {q:"Your aircraft weighs 0.52 lb with the battery and has no exposed rotating parts that could lacerate skin. The organisers say the start line will be a dense crowd. Which category, and what is the catch?",cite:"§ 107.100 · § 107.110",
  c:[{t:"Category 1. Under 0.55 lb and no exposed laceration hazard. But sustained flight over an open-air assembly needs Remote ID.",o:"good",r:"Category 1 is 0.55 lb or less on takeoff including everything attached, no exposed rotating parts that would lacerate skin, no safety defects. Sustained flight over an open-air assembly of people requires the aircraft to meet Remote ID. No Declaration of Compliance for Category 1."},
     {t:"Category 2. Under 11 ft-lb of kinetic energy.",o:"bad",r:"Category 2 is about kinetic energy and requires a Declaration of Compliance and labelling. A 0.52 lb aircraft fits Category 1 and needs neither."},
     {t:"Category 1, and nothing else is required.",o:"meh",r:"Correct category, but you missed the Remote ID requirement for sustained flight over the open-air assembly at the start line."}]},
 {q:"The organisers offer a heavier 2.4 lb aircraft instead. The maker says it meets Category 2. What must exist for that to be true?",cite:"§ 107.115 · § 107.120 · § 107.130",
  c:[{t:"An FAA-accepted Declaration of Compliance for that make and model, and a label on the aircraft stating the category.",o:"good",r:"Category 2 and 3 eligibility requires the manufacturer to have a Declaration of Compliance accepted by the FAA and to label the aircraft with its category. UA.I.E.K13, the Declaration of Compliance, is the most-missed code on the real exam. The remote PIC must verify the label and the DoC before flight."},
     {t:"A note in the manual saying it is safe over people.",o:"bad",r:"Manufacturer marketing is not compliance. The Declaration of Compliance is a specific FAA process, and a label on the aircraft is required."},
     {t:"An airworthiness certificate.",o:"bad",r:"Airworthiness certificates are Category 4. Category 2 and 3 use the Declaration of Compliance route."}]},
 {q:"Halfway through, you want to follow the lead runners along a stretch where cars are still moving on a parallel road. Can you fly over the moving cars?",cite:"§ 107.145",
  c:[{t:"Only transiting, not sustained, unless the road is in a closed or restricted-access site where everyone has been notified. Cars on an open road are off limits for sustained flight.",o:"good",r:"§ 107.145: Category 1, 2 or 3 operations over moving vehicles must be in a closed or restricted-access site with notice to everyone inside, or must not maintain sustained flight over the vehicles. Transit is allowed; hovering and following is not."},
     {t:"Yes. The category covers people, and people are inside the cars.",o:"bad",r:"Moving vehicles have their own section, § 107.145. Category eligibility alone does not permit sustained flight over them on an open road."},
     {t:"Yes, if I stay above 200 ft.",o:"bad",r:"No altitude exemption exists."}]},
 {q:"A spectator asks whether your drone is 'one of those with the tracking thing'. What does Remote ID broadcast, and what is the alternative?",cite:"Part 89",
  c:[{t:"Identity, location, altitude and velocity of the aircraft, the control station location, and emergency status. Without built-in Standard Remote ID I can add a broadcast module, but then I must keep the aircraft in visual line of sight, or fly only inside a FRIA.",o:"good",r:"Part 89 Standard Remote ID broadcasts the serial number or session ID, aircraft and control station position, altitude, velocity, time and emergency status. A broadcast module broadcasts the takeoff location instead of the control station and limits you to VLOS. FAA-Recognized Identification Areas are the only place to fly without either."},
     {t:"It sends my flight plan to the FAA in advance.",o:"bad",r:"Remote ID is a live local broadcast, not a filed plan."},
     {t:"Nothing unless law enforcement requests it.",o:"bad",r:"It broadcasts continuously from takeoff to shutdown."}]}
 ]},
{id:"m5",t:"Emergency and Reporting",art:"accident",lede:"On a routine survey the aircraft loses GPS, drifts in wind, strikes a parked car and lands on a bystander's foot.",
 scenes:[
 {q:"The bystander is bruised and walks it off. The car has a dented hood; the body shop quotes $640. Do you have to report this to the FAA?",cite:"§ 107.9",
  c:[{t:"Yes. Damage to property other than the aircraft costing more than $500 to repair, or worth more than $500 if destroyed, is reportable within 10 calendar days.",o:"good",r:"§ 107.9 requires a report within 10 calendar days of an operation that results in serious injury or loss of consciousness, or damage to any property other than the UA where the cost to repair or the fair market value exceeds $500, whichever is lower. A bruise is not a serious injury, but $640 is a reportable damage event."},
     {t:"No. Nobody was seriously hurt.",o:"bad",r:"The injury test is only half of § 107.9. The property damage threshold is $500 and the car exceeds it."},
     {t:"Yes, within 24 hours, to the NTSB.",o:"bad",r:"The FAA report under § 107.9 is 10 calendar days. NTSB has separate rules in part 830 for accidents, but the part 107 question is 10 days to the FAA."}]},
 {q:"What makes an injury 'serious' for § 107.9?",cite:"§ 107.9 · AIS",
  c:[{t:"Level 3 or higher on the Abbreviated Injury Scale: roughly a reversible injury that needs hospitalisation, such as a fracture or a laceration needing surgery. Any loss of consciousness also counts.",o:"good",r:"The FAA uses the AIS. Level 3 is 'serious'. Loss of consciousness is independently reportable. Minor cuts and bruises are not."},
     {t:"Any injury that needs a bandage.",o:"bad",r:"Too low. First-aid level injuries are AIS 1 and are not reportable."},
     {t:"Only death.",o:"bad",r:"Death is far above the threshold; AIS 3 is the line."}]},
 {q:"While the aircraft was drifting you climbed it to 450 ft to clear a building before you could regain control. Trouble?",cite:"§ 107.21",
  c:[{t:"It was an in-flight emergency requiring immediate action. § 107.21 lets me deviate from any rule of the part to the extent necessary, and I must send a written report if the FAA asks for one.",o:"good",r:"§ 107.21(a): in an in-flight emergency requiring immediate action the remote PIC may deviate from any rule of part 107 to the extent necessary to meet that emergency. (b): upon request, send a written report of the deviation to the Administrator."},
     {t:"Yes. 400 ft is absolute and I will be cited.",o:"bad",r:"Emergency authority exists precisely for this. The deviation must be necessary and no more than necessary."},
     {t:"No problem, and no report is ever required.",o:"meh",r:"The deviation is lawful, but § 107.21(b) says a written report must be sent if the Administrator requests it."}]},
 {q:"The bystander's friend says she saw you drinking a beer at lunch an hour before the flight. What is the rule?",cite:"§ 107.27 · § 91.17",
  c:[{t:"No operating within 8 hours of consuming alcohol, while under its influence, or with a blood alcohol level of 0.04 or more. That lunch beer grounds me for the afternoon.",o:"good",r:"§ 107.27 applies § 91.17 and § 91.19 to part 107. § 91.17: eight hours bottle to throttle, no operation while impaired, and 0.04 percent by weight or more is prohibited. A conviction or refusal to test can cost you the certificate under § 61.15."},
     {t:"One beer is fine as long as I feel sober.",o:"bad",r:"The 8 hour rule is time-based, not feeling-based."},
     {t:"There is no alcohol rule in part 107.",o:"bad",r:"§ 107.27 imports the part 91 and part 61 drug and alcohol rules, including refusal-to-test consequences."}]},
 {q:"An FAA inspector arrives the next day and asks to see your paperwork. What must you be able to produce?",cite:"§ 107.7 · § 107.12",
  c:[{t:"My remote pilot certificate, the aircraft registration, and any waiver or authorization. I must also allow inspection of the aircraft and records on request.",o:"good",r:"§ 107.7 requires the remote PIC to present the remote pilot certificate and identification to the FAA, NTSB, TSA or law enforcement on request, and to make the aircraft, documents and records available for inspection and testing."},
     {t:"Nothing. The FAA needs a warrant.",o:"bad",r:"§ 107.7 is a condition of holding the certificate. Refusing inspection is itself a violation."},
     {t:"Only my driver's licence.",o:"bad",r:"Identification plus the remote pilot certificate, and the registration for the aircraft."}]}
 ]}
];

function mBestTag(d,max){
 if(!d||d.score==null)return '<span class="sc n">new</span>';
 var sc=Math.max(0,Math.min(max,Math.round(Number(d.score)||0)));
 if(!d.done)return '<span class="sc n">not passed yet · best '+sc+'/'+max+'</span>';
 return '<span class="sc '+(sc>=0.9*max?"g":"n")+'">best '+sc+'/'+max+'</span>';
}
function mXP(o){return o==="good"?20:o==="meh"?8:0}
function missionStart(id){
 if(id==="m1"&&typeof m1Start==="function"){m1Start();return}
 if(typeof RM!=="undefined"&&RM[id]){rmStart(id);return}
 var m=null;for(var i=0;i<MISSIONS.length;i++)if(MISSIONS[i].id===id)m=MISSIONS[i];
 if(!m)return;
 st.mRun={id:id,i:0,pick:null,xp:0,log:[]};
 go("practice","missions");render();
}
function missionChoose(ci){
 var r=st.mRun;if(!r||r.pick!==null)return;
 var m=MISSIONS.filter(function(x){return x.id===r.id})[0],sc=m.scenes[r.i],c=sc.c[+ci];
 r.pick=+ci;r.xp+=mXP(c.o);r.log.push(c.o);
 render();
}
function missionNext(){
 st.keepScroll=0;
 var r=st.mRun;if(!r)return;
 var m=MISSIONS.filter(function(x){return x.id===r.id})[0];
 r.i++;r.pick=null;
 if(r.i>=m.scenes.length){
  var prev=st.missions[r.id]||{};
  var good=r.log.filter(function(o){return o==="good"}).length;
  st.missions[r.id]={done:1,xp:Math.max(prev.xp||0,r.xp),best:Math.max(prev.best||0,good),n:m.scenes.length,at:Date.now()};
  r.finished=1;save();setTimeout(checkAch,350);
 }
 render();
}
function vMissions(){
 var r=st.mRun,i;
 if(r&&r.rich===1&&st.m1run&&typeof vM1==="function")return vM1();
 if(r&&r.rich===2&&st.rm&&typeof vRM==="function")return vRM();
 var h='<div class="hero col"><p class="eyebrow">Mission 107</p><h1>Five jobs. Every call has a consequence.</h1>';
 h+='<p class="lede">Each mission is a chain of real decisions, written in the rule\'s own words. Twenty XP for the best call, eight for a legal but weaker one, none for a violation. A bad call can change what happens next. A mission counts as flown at 70 percent.</p></div><div class="col">';
 if(!r||!r.id){
  h+='<div class="modes">';
  for(i=0;i<MISSIONS.length;i++){var m=MISSIONS[i],d=st.missions[m.id];
   h+='<button class="mode'+(d&&d.done?"":" hero2")+'" data-mission="'+m.id+'">';
   /* S1: saved values are coerced to numbers and clamped before they reach innerHTML */
   if(typeof RM!=="undefined"&&RM[m.id]){var rd=RM[m.id],rmax=rmMax(rd);
    h+=mBestTag(d,rmax);
    h+='<span class="badge">Mission '+(i+1)+' · full simulation · '+rmScored(rd)+' decisions, branches on a bad call</span><h4>'+esc(rd.t)+'</h4><p>'+esc(m.lede)+'</p></button>';continue}
   if(m.id==="m1"){h+=mBestTag(d,M1_MAX);
    h+='<span class="badge">Mission 1 · full simulation · 9 scored steps</span><h4>'+esc(m.t)+'</h4><p>Brief, chart, LAANC request, weather with a wait branch, preflight, an animated flight with a timed right-of-way event, and a debrief. About 12 minutes.</p></button>';continue}
   var dn=Math.max(0,Math.min(m.scenes.length,Math.round(Number(d&&d.n)||m.scenes.length))),db=Math.max(0,Math.min(dn,Math.round(Number(d&&d.best)||0)));
   h+='<span class="sc '+(d&&d.done?(db===dn?"g":"n"):"n")+'">'+(d&&d.done?db+"/"+dn+" best":"new")+'</span>';
   h+='<span class="badge">Mission '+(i+1)+' · '+m.scenes.length+' decisions</span><h4>'+esc(m.t)+'</h4><p>'+esc(m.lede)+'</p></button>';
  }
  h+='</div>';
  var done=0;for(var k in st.missions)if(st.missions[k].done)done++;
  if(done===MISSIONS.length)h+='<div class="complete"><div class="cxp">All five missions complete</div><div class="cbig">Certified</div><p class="mut">Every scenario here is drawn from the sections the exam weights heaviest. Replay any mission for a perfect run.</p></div>';
  h+='</div>';return h;
 }
 var m=MISSIONS.filter(function(x){return x.id===r.id})[0];
 if(r.finished){
  var good=r.log.filter(function(o){return o==="good"}).length,bad=r.log.filter(function(o){return o==="bad"}).length;
  h+='<div class="complete"><div class="cxp">Mission complete · +'+r.xp+' XP</div><div class="cbig">'+good+' / '+m.scenes.length+'</div>';
  h+='<p>'+(bad===0?(good===m.scenes.length?"A clean run. Every call was the best call.":"No violations. A couple of calls were legal but not the strongest."):bad+" decision"+(bad>1?"s":"")+" would have been a violation or an unsafe act. Read those outcomes again before you replay.")+'</p>';
  h+='<div class="row" style="justify-content:center"><button class="btn" data-mission="'+m.id+'">Replay</button><button class="btn gh" data-lab="mexit">All missions</button></div></div>';
  h+='</div>';return h;
 }
 var sc=m.scenes[r.i];
 h+='<div class="scene">'+mScene(m.art)+'<div class="sbody">';
 h+='<div class="mhead"><span class="mnum">Mission '+(MISSIONS.indexOf(m)+1)+' · decision '+(r.i+1)+' of '+m.scenes.length+'</span><span class="pill">'+esc(sc.cite)+'</span></div>';
 h+='<div class="xpbar"><span class="t"><i style="width:'+Math.round(100*r.i/m.scenes.length)+'%"></i></span><span>'+r.xp+' XP</span></div>';
 if(r.i===0&&r.pick===null)h+='<p class="mut" style="margin:12px 0 0">'+esc(m.lede)+'</p>';
 h+='<h3 style="margin-top:14px">'+esc(sc.q)+'</h3>';
 for(i=0;i<sc.c.length;i++){var c=sc.c[i],cls="choice";
  if(r.pick!==null){if(i===r.pick)cls+=" "+c.o;else if(c.o==="good")cls+=" good"}
  h+='<button class="'+cls+'" data-choice="'+i+'"'+(r.pick!==null?' disabled':'')+'><span class="cl2">'+"ABC".charAt(i)+'</span><span>'+esc(c.t)+'</span></button>';
 }
 if(r.pick!==null){var pc=sc.c[r.pick];
  h+='<div class="outcome '+pc.o+'"><div class="oh">'+(pc.o==="good"?"Best call · +20 XP":pc.o==="meh"?"Legal, not the best call · +8 XP":"Violation or unsafe · +0 XP")+'</div><p>'+pc.r+'</p>';
  if(pc.o!=="good"){for(i=0;i<sc.c.length;i++)if(sc.c[i].o==="good")h+='<p><b>The best call:</b> '+sc.c[i].r+'</p>'}
  h+='<div class="row"><button class="btn" data-lab="mnext">'+(r.i+1>=m.scenes.length?"Finish mission":"Next decision")+'</button><button class="btn gh" data-lab="mexit">Quit</button></div></div>';
 } else h+='<p class="mut" style="margin-top:6px">Pick one. You will see why for each.</p>';
 h+='</div></div></div>';
 return h;
}

/* ============================================================
   MISSION 1 · FLIGHT AUTHORIZATION  (full simulation)
   A branching remote-pilot job: brief, airspace, LAANC request,
   weather with a wait branch, 107.49 preflight, an animated
   flight with a timed right-of-way event, and a debrief.
   Everything marked SIMULATED is invented for training: the
   airport, the grid ceilings and the METARs. The rules are real
   and every outcome names its section.

function ecfr(sec){ /* "107.41" -> eCFR deep link */
